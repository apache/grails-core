plugins {
    id 'groovy'
    id 'project-report'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.vulnerability-scan'
}

version = projectVersion
group = 'org.apache.grails.testing'

dependencies {
    implementation platform(project(':grails-bom'))

    testImplementation project(':grails-async')
    testImplementation project(':grails-codecs')
    testImplementation project(':grails-controllers')
    testImplementation project(':grails-databinding')
    testImplementation project(':grails-datasource')
    testImplementation project(':grails-domain-class')
    testImplementation project(':grails-interceptors')
    testImplementation project(':grails-rest-transforms')
    testImplementation project(':grails-xml')
    testImplementation project(':grails-services')
    testImplementation project(':grails-url-mappings')
    testImplementation project(':grails-spring')
    testImplementation project(':grails-test-suite-base')
    testImplementation project(':grails-testing-support-core')
    testImplementation testFixtures(project(':grails-web-common'))
    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'org.apache.groovy:groovy-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'tools.jackson.core:jackson-databind'
    testImplementation project(':grails-data-hibernate5-core')
    testImplementation project(':grails-gsp')
    if (System.getenv('SITEMESH2_TESTING_ENABLED') == 'true') {
        implementation project(':grails-layout')
    } else {
        implementation project(':grails-sitemesh3')
    }
    testImplementation project(':grails-testing-support-datamapping'), {
        // This is a local project dependency
        exclude module: 'grails-testing-support-core'
        exclude module: 'grails-rest-transforms'
    }
    testImplementation project(':grails-testing-support-web'), {
        // This is a local project dependency
        exclude module: 'grails-testing-support-core'
        exclude module: 'grails-rest-transforms'
    }
    testImplementation project(':grails-datamapping-validation')
    testImplementation 'org.spockframework:spock-core'

    testCompileOnly 'jakarta.servlet:jakarta.servlet-api'
    testCompileOnly 'org.springframework:spring-test', {
        // MockHttpServletRequest/Response/Context used in many classes
    }

    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.apache.tomcat:tomcat-jdbc'
    testRuntimeOnly 'org.aspectj:aspectjrt'
    testRuntimeOnly 'org.aspectj:aspectjweaver'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.springframework:spring-aspects'
    testRuntimeOnly project(':grails-test-listener')
}

// FrameworkToolsCompleteSpec reads the -cli and -cli-standalone jar of every project of the framework that publishes
// one, found as the BOMs find them (gradle/cli-companion-bom-constraints.gradle): by the artifact ids a project
// exports once it is configured, which is why they are read when the configuration is resolved. Each jar is resolved
// alone, without what it depends on, and is not on the class path of any test: the spec only reads it. The projects
// of the test suites and of the test examples are not the framework's.
def frameworkToolJars = configurations.register('frameworkToolJars') { Configuration jars ->
    jars.canBeConsumed = false
    jars.canBeResolved = true
    jars.transitive = false
    jars.attributes { AttributeContainer attributes ->
        attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        attributes.attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attributes.attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        attributes.attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
    }
    List<String> notTheFrameworks = rootProject.ext.testProjectsStartWith as List<String>
    jars.withDependencies { DependencySet companions ->
        for (Project subproject : rootProject.subprojects) {
            if (notTheFrameworks.any { String prefix -> subproject.name.startsWith(prefix) }) {
                continue
            }
            for (String companionProperty : ['cliArtifactId', 'cliStandaloneArtifactId']) {
                def artifactId = subproject.findProperty(companionProperty)
                if (artifactId) {
                    ModuleDependency companion = (ModuleDependency) project.dependencies.project(path: subproject.path)
                    companion.capabilities { it.requireCapability("${subproject.group}:${artifactId}") }
                    companions.add(companion)
                }
            }
        }
    }
}

def isolatedTestPatterns = [
        isolatedTestsOne: [
                'org.grails.web.util.WebUtilsTests'
        ],
        isolatedTestsTwo: [
                'grails.test.mixin.UrlMappingsTestMixinTests',
                'grails.test.mixin.SetupTeardownInvokeTests',
                'grails.test.mixin.TestMixinSetupTeardownInvokeTests'
        ],
        isolatedRestRendererTests: [
                '*.rest.render.*Spec'
        ],
        isolatedPersonTests: [
                'org.grails.validation.TestingValidationSpec',
                'org.grails.validation.CascadingErrorCountSpec'
        ],
        isolatedRestfulControllerTests: [
                'grails.test.mixin.RestfulControllerSpec',
                'grails.test.mixin.ResourceAnnotationRestfulControllerSpec'
        ],
]

def frameworkToolsSpec = 'org.apache.grails.tools.FrameworkToolsCompleteSpec'

// A task of its own, so that the jars of the tools, which a change to any module with tools changes, are the
// input of this one spec and not of the whole suite
tasks.register('frameworkToolsTest', Test) {
    group = 'verification'
    description = 'Checks that every tool in the -cli and -cli-standalone jars of the framework has a description, hints and ' +
            'the declarations of the arguments it reads (FrameworkToolsCompleteSpec).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter.includePatterns = [frameworkToolsSpec]
    jvmArgumentProviders.add(new FrameworkToolJars(jars: files(frameworkToolJars)))
}

def testSkippingProperties = [
        'onlyFunctionalTests',
        'onlyHibernate5Tests',
        'onlyHibernate7Tests',
        'onlySpringSecurityTests',
        'onlyMongodbTests',
        'skipCoreTests',
        'skipTests',
]

isolatedTestPatterns.keySet().each { taskName ->
    tasks.register(taskName, Test) {
        group = 'verification'
        // A Test task registered rather than inherited has neither of these, which makes it
        // NO-SOURCE: it reports success having run nothing. These classes are excluded from
        // `test` below, so without this they run in no task at all.
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        filter.includePatterns = isolatedTestPatterns[taskName]
    }
}

boolean cacheTests = !doNotCacheTests
boolean testsSkipped = testSkippingProperties.any { project.hasProperty(it) }
tasks.withType(Test).configureEach {
    // Honor DO_NOT_CACHE_TESTS=1 so developers can repeatedly invoke the same test command
    // without --rerun-tasks (and without recompiling everything else).
    outputs.cacheIf { cacheTests }
    outputs.upToDateWhen { cacheTests }

    onlyIf { !testsSkipped }
    useJUnitPlatform()
    // The excludes of test-config.gradle, which this build does not apply.
    exclude('**/*TestCase.class', '**/*$*.class')
    maxParallelForks = rootProject.ext.configuredTestParallel
    maxHeapSize = "${rootProject.ext.testForkHeapMb}m"
    jvmArgs('--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED')
}

// Must be configured AFTER the tasks.withType(Test) block above. Both are deferred
// configuration actions and Gradle runs them in registration order, so a tasks.named
// block registered first would be silently overwritten by the later configureEach.
tasks.named('isolatedTestsTwo', Test) {
    maxParallelForks = 1
}

tasks.named('test', Test) {
    // Exclude the isolated tests, and the spec frameworkToolsTest runs, from the main test task
    filter.excludePatterns = isolatedTestPatterns.values().flatten() + [frameworkToolsSpec]
}

tasks.register('testAll') {
    group = 'verification'
    description = 'Runs all tests, including isolated ones.'
    dependsOn(tasks.withType(Test))
}

tasks.named('check') {
    dependsOn('testAll')
}

tasks.withType(Groovydoc).configureEach {
    // tests do not have groovydoc
    enabled = false
}

/** Hands FrameworkToolsCompleteSpec the jars of the tools of the framework, as {@code -Dframework.tools.jars=<paths>}. */
class FrameworkToolJars implements CommandLineArgumentProvider {

    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    FileCollection jars

    @Override
    Iterable<String> asArguments() {
        ["-Dframework.tools.jars=${jars.files*.absolutePath.join(File.pathSeparator)}".toString()]
    }
}
