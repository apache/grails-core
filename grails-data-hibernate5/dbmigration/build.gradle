plugins {
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.gradle.grails-plugin'
    id 'org.apache.grails.gradle.grails-plugin-cli'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.buildsrc.vulnerability-scan'
    id 'org.apache.grails.gradle.grails-code-style'
    id 'org.apache.grails.gradle.grails-jacoco'
}

version = projectVersion
group = 'org.apache.grails'

cliArtifact {
    automaticModuleName = 'org.apache.grails.data.hibernate5.dbmigration.cli'
    // this framework module wires its cli dependencies with project dependencies below
    defaultDependencies = false
}

ext {
    gormApiDocs = true
    pomTitle = 'Grails Database Migration Plugin for Hibernate 5'
    pomDescription = 'The Database Migration plugin helps you manage database changes, via Liquibase, while developing Grails applications for Hibernate 5'
}

dependencies {
    // TODO: Clarify and clean up dependencies
    implementation platform(project(':grails-hibernate5-bom'))

    implementation("org.liquibase:liquibase-core") {
        exclude group: 'javax.xml.bind', module: 'jaxb-api'
    }
    implementation("org.liquibase.ext:liquibase-hibernate5") {
        exclude group: 'org.hibernate', module: 'hibernate-core'
        exclude group: 'org.hibernate', module: 'hibernate-entitymanager'
        exclude group: 'org.hibernate', module: 'hibernate-envers'
        exclude group: 'com.h2database', module: 'h2'
        exclude group: 'org.liquibase', module: 'liquibase-commercial'
        exclude group: 'org.liquibase', module: 'liquibase-core'
    }

    // the cli tier — published separately as org.apache.grails:grails-data-hibernate5-dbmigration-cli;
    // the dbm-* commands and their CLI-only dependencies (grails-shell-cli) stay off the
    // application runtime classpath entirely
    cliImplementation platform(project(':grails-hibernate5-bom'))
    cliApi project(project.path)
    cliApi(project(':grails-core')) {
        capabilities {
            requireCapability('org.apache.grails:grails-core-cli')
        }
    }
    cliImplementation("org.liquibase:liquibase-core") {
        exclude group: 'javax.xml.bind', module: 'jaxb-api'
    }
    cliImplementation("org.liquibase.ext:liquibase-hibernate5") {
        exclude group: 'org.hibernate', module: 'hibernate-core'
        exclude group: 'org.hibernate', module: 'hibernate-entitymanager'
        exclude group: 'org.hibernate', module: 'hibernate-envers'
        exclude group: 'com.h2database', module: 'h2'
        exclude group: 'org.liquibase', module: 'liquibase-commercial'
        exclude group: 'org.liquibase', module: 'liquibase-core'
    }
    cliImplementation project(':grails-data-hibernate5')
    cliCompileOnly 'org.apache.groovy:groovy-sql'
    cliCompileOnly 'org.apache.groovy:groovy-xml'
    cliCompileOnly 'org.slf4j:slf4j-nop' // Prevents warning about missing slf4j implementation during compilation
    cliImplementation(project(':grails-shell-cli')) {
        exclude group: 'org.slf4j', module: 'slf4j-simple'

        // Keep legacy org.codehaus.groovy artifacts off this plugin's Groovy 5 classpath.
        exclude group: 'org.codehaus.groovy'
    }

    compileOnly 'org.springframework.boot:spring-boot-starter-logging'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly project(':grails-data-hibernate5')
    compileOnly project(':grails-core')
    compileOnly 'org.apache.groovy:groovy-sql'
    compileOnly 'org.apache.groovy:groovy-xml'

    testImplementation 'org.springframework.boot:spring-boot-starter-tomcat'
    testImplementation project(':grails-data-hibernate5')
    testImplementation project(':grails-core')
    testImplementation project(':grails-testing-support-datamapping')
    testImplementation project(':grails-testing-support-web')
    testImplementation 'com.h2database:h2'

    // Liquibase uses JUL for logging -> redirect it to SLF4J to reliably capture its output
    testRuntimeOnly 'org.slf4j:jul-to-slf4j'
}

tasks.named('test', Test) {
    systemProperty("java.util.logging.config.file", "src/test/resources/logging.properties")
}

tasks.named('testCli', Test) {
    systemProperty("java.util.logging.config.file", "src/test-cli/resources/logging.properties")
}

tasks.named('jar', Jar) {
    exclude('testapp/**/**')
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/hibernate5-test-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/docs-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/grails-extension-gradle-config.gradle')
}
