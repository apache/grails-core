dependencies {
    // https://docs.gradle.org/8.3/userguide/upgrading_version_8.html#test_framework_implementation_dependencies
    add('testRuntimeOnly', 'org.junit.platform:junit-platform-launcher')
}

tasks.withType(Test).configureEach {
    // Honor DO_NOT_CACHE_TESTS=1 so developers can repeatedly invoke the same test command
    // without --rerun-tasks (and without recompiling everything else).
    outputs.cacheIf { !doNotCacheTests }
    outputs.upToDateWhen { !doNotCacheTests }

    onlyIf {
        ![
                'onlyFunctionalTests',
                'onlyHibernate5Tests',
                'skipHibernate7Tests',
                'onlyMongodbTests',
                'onlyNeo4jTests',
                'onlyRedisTests',
                'onlySpringSecurityTests',
                'onlyCoreTests',
                'skipTests'
        ].find {
            project.hasProperty(it)
        }
    }

    useJUnitPlatform()
    // This script does not apply gradle/test-config.gradle, so forkEvery would otherwise stay 0
    // and one worker would run every class assigned to the task. :grails-data-hibernate7-core:test
    // retains a SessionFactory per spec for the life of that worker. After the 8.1.x specs landed
    // on 9.0.x, a worker that draws a large slice of this task exhausts its heap (Java heap space).
    // That is what fails the Hibernate 7 CI shards that include such a slice, and the same task
    // fails coverage and the Groovy snapshot canary. Recycle on the unit-test cadence. Cap the
    // single worker at 2g and leave maxParallelForks at
    // 1: without a cap the worker takes the ergonomic heap, and several of those plus the 3g
    // daemon do not fit a 16 GB runner.
    forkEvery = hasProperty('forkEveryUnitTest') ? getProperty('forkEveryUnitTest') as long : (isCiBuild ? 50 : 100)
    maxHeapSize = '2048m'
    // Lets TCK specs gate features on the running suite. Spock evaluates @IgnoreIf/@Requires
    // preconditions before setupSpec() runs, so this must be set at the task level - a
    // TCK-manager System.setProperty would come too late.
    systemProperty('hibernate7.gorm.suite', 'true')
    reports.html.required = !isCiBuild
    reports.junitXml.required = !isCiBuild
    testLogging {
        events('passed', 'skipped', 'failed')
        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true

        // set options for log level DEBUG and INFO
        debug {
            events('started', 'passed', 'skipped', 'failed', 'standardOut', 'standardError')
            exceptionFormat = 'full'
        }
        info.events = debug.events
        info.exceptionFormat = debug.exceptionFormat
    }
    addTestListener([
        afterTest: { desc, result ->
            logger.quiet(' -- Executed test {} [{}] with result: {}', desc.name, desc.className, result.resultType)
        },
        afterSuite: { desc, result ->
            if (!desc.parent) { // will match the outermost suite
                def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)"
                def startItem = '|  ', endItem = '  |'
                def repeatLength = startItem.length() + output.length() + endItem.length()
                def dashes = '-' * repeatLength
                logger.quiet('\n{}\n{}{}{}\n{}', dashes, startItem, output, endItem, dashes)
            }
        }
    ] as TestListener)
}
