dependencies {
    // https://docs.gradle.org/8.3/userguide/upgrading_version_8.html#test_framework_implementation_dependencies
    add('testRuntimeOnly', 'org.junit.platform:junit-platform-launcher')
}

boolean cacheTests = !doNotCacheTests
tasks.withType(Test).configureEach {
    // Honor DO_NOT_CACHE_TESTS=1 so developers can repeatedly invoke the same test command
    // without --rerun-tasks (and without recompiling everything else).
    outputs.cacheIf { cacheTests }
    outputs.upToDateWhen { cacheTests }

    // This config does not apply test-config.gradle, so the forks would run at Gradle's 512 MB default. The scan of the
    // roughly 1,200 domain classes of the core test sources (ClassicOracleSpec and the differential specs) does not
    // fit: CI failed with "Java heap space" while reading the candidate components.
    maxHeapSize = '2g'

    boolean skipped = [
            'onlyFunctionalTests',
            'onlyHibernate5Tests',
            'skipHibernate7Tests',
            'onlyMongodbTests',
            'onlyNeo4jTests',
            'onlyRedisTests',
            'onlySpringSecurityTests',
            'onlyCoreTests',
            'skipTests'
    ].any { project.hasProperty(it) }
    onlyIf { !skipped }

    useJUnitPlatform()

    // Opt-in: -Pgrails.test.generatedDomainClasses=true runs the suite with every manager-built datastore booted through the
    // generated-domain-class path (hibernate.generatedDomainClasses). Binder mode stays the default. Specs that exercise the
    // domain binder's internals do not apply to that path and are listed, one class name per line, in the module's
    // generated-mode-exclusions.txt.
    if (providers.gradleProperty('grails.test.generatedDomainClasses').map { it.toBoolean() }.getOrElse(false)) {
        systemProperty('grails.hibernate.generatedDomainClasses', 'true')
        File exclusions = project.file('generated-mode-exclusions.txt')
        if (exclusions.exists()) {
            exclusions.readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') }.each { String pattern ->
                filter.excludeTestsMatching(pattern)
            }
        }
    }
    // The differential specs compare native domain binding against what the classic binder produced, recorded under
    // src/test/resources/classic-oracle/. By default they read the recorded files and do not boot the classic binder.
    // -Pgrails.test.verifyClassicOracle=true boots it too and asserts it still produces exactly the recorded data;
    // -Pgrails.test.refreezeClassicOracle=true boots it and rewrites the files (see ClassicOracle for the details).
    ['verifyClassicOracle', 'refreezeClassicOracle'].each { String oracleSwitch ->
        if (providers.gradleProperty("grails.test.${oracleSwitch}").map { it.toBoolean() }.getOrElse(false)) {
            systemProperty("grails.test.${oracleSwitch}", 'true')
        }
    }
    // Lets TCK specs gate features on the running suite. Spock evaluates @IgnoreIf/@Requires
    // preconditions before setupSpec() runs, so this must be set at the task level - a
    // TCK-manager System.setProperty would come too late.
    systemProperty('hibernate7.gorm.suite', 'true')
    reports.html.required = !isCiBuild
    reports.junitXml.required = !isCiBuild
    testLogging {
        events('passed', 'skipped', 'failed')
        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true

        // set options for log level DEBUG and INFO
        debug {
            events('started', 'passed', 'skipped', 'failed', 'standardOut', 'standardError')
            exceptionFormat = 'full'
        }
        info.events = debug.events
        info.exceptionFormat = debug.exceptionFormat
    }
    Logger testLogger = logger
    addTestListener([
        afterTest: { desc, result ->
            testLogger.quiet(' -- Executed test {} [{}] with result: {}', desc.name, desc.className, result.resultType)
        },
        afterSuite: { desc, result ->
            if (!desc.parent) { // will match the outermost suite
                def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)"
                def startItem = '|  ', endItem = '  |'
                def repeatLength = startItem.length() + output.length() + endItem.length()
                def dashes = '-' * repeatLength
                testLogger.quiet('\n{}\n{}{}{}\n{}', dashes, startItem, output, endItem, dashes)
            }
        }
    ] as TestListener)
}
