// Add JUnit Platform launcher dependency required by Gradle 9 for running tests
// Also add ByteBuddy for Spock mocking on Java 17+ (CGLIB doesn't support Java 17 class files)
dependencies {
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.bytebuddy:byte-buddy"
}

// Skipped Test tasks still execute their dependsOn. Only wire the local-Maven
// publish chain when Forge tests will actually run.
boolean forgeTestsEnabled = !['skipTests', 'skipForgeTests'].any { project.hasProperty(it) } &&
        (project.hasProperty('onlyForgeTests') ||
                !['onlyCoreTests',
                  'onlyFunctionalTests',
                  'onlyHibernate5Tests',
                  'onlyHibernate7Tests',
                  'onlyMongodbTests',
                  'onlyNeo4jTests',
                  'onlyRedisTests',
                  'onlySpringSecurityTests'].any { project.hasProperty(it) })

tasks.withType(Test).configureEach { Test testTask ->
    if (forgeTestsEnabled) {
        boolean forgeTestsNeedLocalMaven = project.findProperty('forgeTestsNeedLocalMaven') == true
        if (forgeTestsNeedLocalMaven) {
            testTask.dependsOn(
                    ':publishAllPublicationsToTestCaseMavenRepoRepository',
                    gradle.includedBuild('grails-gradle').task(':publishAllPublicationsToTestCaseMavenRepoRepository')
            )
            testTask.environment('GRAILS_REPO_URL', uri(rootProject.layout.projectDirectory.dir('build/local-maven')))
        }
    }

    // Honor DO_NOT_CACHE_TESTS=1 so developers can repeatedly invoke the same test command
    // without --rerun-tasks (and without recompiling everything else).
    outputs.cacheIf { !doNotCacheTests }
    outputs.upToDateWhen { !doNotCacheTests }

    onlyIf { forgeTestsEnabled }
    testLogging {
        events('passed', 'skipped', 'failed')
        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }

    maxHeapSize = '2G'
    jvmArgs('-Duser.country=US', '-Duser.language=en',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED')
    forkEvery = 100
    maxParallelForks = rootProject.ext.configuredTestParallel

    useJUnitPlatform()
}
