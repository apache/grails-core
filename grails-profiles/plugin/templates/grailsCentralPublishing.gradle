publishing {
    publications {
        maven(MavenPublication) {
            pom.withXml {
                def pomNode = asNode()
                pomNode.dependencyManagement.replaceNode {}

                // simply remove dependencies without a version
                // version-less dependencies are handled with dependencyManagement
                // remove version-less dependencies since versions are managed by the Grails BOM platform
                pomNode.dependencies.dependency.findAll {
                    it.version.text().isEmpty()
                }.each {
                    it.replaceNode {}
                }
            }
            artifactId project.name
            from components.java
            artifact sourcesJar
            artifact javadocJar
            def descriptorTask = tasks.named('generatePluginDescriptor')
            artifact(descriptorTask.flatMap { it.outputDirectory.file('META-INF/grails-plugin.xml') }) {
                classifier = 'plugin'
                extension = 'xml'
                builtBy descriptorTask
            }
        }
    }

    repositories {
        maven {
            credentials {
                username System.getenv('GRAILS_CENTRAL_USERNAME') ?: project.properties.get('grailsPluginsUsername')
                password System.getenv("GRAILS_CENTRAL_PASSWORD") ?: project.properties.get('grailsPluginsPassword')
            }

            if(version.endsWith('-SNAPSHOT')) {
                url "https://repo.grails.org/grails/plugins3-snapshots-local"
            }
        }
    }
}

task install(dependsOn: project.tasks.withType(PublishToMavenLocal))
