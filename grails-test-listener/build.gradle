plugins {
    id 'groovy'
    id 'java'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.gradle.grails-code-style'
}

version = projectVersion
group = 'org.apache.grails'

// Not published: test-config.gradle puts this module on the test runtime classpath of the modules
// of this repository only. Its listener registers itself through the ServiceLoader, so a published
// jar would run it in the test suites of every application that depended on it.
dependencies {
    compileOnly platform(project(':grails-bom'))
    compileOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation platform(project(':grails-bom'))
    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.spockframework:spock-core'
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
}
