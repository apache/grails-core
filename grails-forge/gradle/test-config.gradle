// Add JUnit Platform launcher dependency required by Gradle 9 for running tests
// Also add ByteBuddy for Spock mocking on Java 17+ (CGLIB doesn't support Java 17 class files)
dependencies {
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.bytebuddy:byte-buddy"
}

// Skipped Test tasks still execute their dependsOn. Only wire the local-Maven publish chain
// of the included builds when Forge tests will actually run.
boolean forgeTestsEnabled = !['skipTests', 'skipForgeTests'].any { project.hasProperty(it) }
boolean cacheTests = !doNotCacheTests
// -PgrailsIndy=false reaches the included grails-core build, so the framework it publishes for the
// generated applications is then compiled with classic call sites.
boolean classicFramework = project.hasProperty('grailsIndy') && !Boolean.parseBoolean(project.property('grailsIndy').toString())

tasks.withType(Test).configureEach { Test testTask ->
    if (forgeTestsEnabled) {
        // Only the modules whose specs build generated applications (TestKit) need the published
        // framework; the unit specs of the other modules run without the publish chain.
        boolean forgeTestsNeedLocalMaven = project.findProperty('forgeTestsNeedLocalMaven') == true
        if (forgeTestsNeedLocalMaven) {
            // -PprebuiltTestRepository (see settings.gradle): the repository is there already and was checked
            // when the build was configured, so nothing is published and no module of the framework is built
            def prebuilt = rootProject.ext.prebuiltTestRepository
            if (prebuilt) {
                testTask.environment('GRAILS_REPO_URL', prebuilt.directory.toURI())
                // the jars are part of what the specs test, and no task of this build makes them
                testTask.inputs.dir(prebuilt.directory).withPropertyName('prebuiltTestRepository').withPathSensitivity(PathSensitivity.RELATIVE)
                String staleRepository = prebuilt.warning
                if (staleRepository) {
                    testTask.doFirst { Task task -> task.logger.warn('WARNING: {}', staleRepository) }
                }
            } else {
                testTask.dependsOn(
                        gradle.includedBuild('grails-core').task(':publishAllPublicationsToTestCaseMavenRepoRepository'),
                        gradle.includedBuild('grails-gradle').task(':publishAllPublicationsToTestCaseMavenRepoRepository')
                )
                testTask.environment('GRAILS_REPO_URL', uri(rootProject.layout.projectDirectory.dir('../build/local-maven')))
            }
            if (classicFramework) {
                // Groovy 6 loads a classic-compiled class only with groovy-callsite. The specs pass this
                // init script to every generated build (GeneratedBuild in the CLI module's test fixtures
                // reads the property) so the application declares the module itself.
                testTask.systemProperty('forge.generatedBuild.initScript',
                        rootProject.layout.projectDirectory.file('gradle/classic-framework.init.gradle').asFile.absolutePath)
            }
        }
    }

    // Honor DO_NOT_CACHE_TESTS=1 so developers can repeatedly invoke the same test command
    // without --rerun-tasks (and without recompiling everything else).
    outputs.cacheIf { cacheTests }
    outputs.upToDateWhen { cacheTests }

    boolean skipped = !forgeTestsEnabled
    onlyIf { !skipped }
    testLogging {
        events('passed', 'skipped', 'failed')
        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }

    maxHeapSize = '2G'
    jvmArgs('-Duser.country=US', '-Duser.language=en',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED')
    forkEvery = 100
    maxParallelForks = rootProject.ext.configuredTestParallel

    useJUnitPlatform()
}

// Coverage is measured only when it is asked for. The JaCoCo plugin puts its agent into every test JVM and
// the convention plugin writes three reports after every Test task, which an ordinary build of Forge has no
// use for, so the plugin is applied only when a coverage task is requested by its full name (an abbreviation
// such as `jAR` is not recognised), as gradle/dependency-analysis.settings.gradle does for its plugin.
// `./gradlew jacocoAggregateReport` runs the tests of every module and writes
// build/reports/jacoco/aggregate/jacocoAggregateReport.xml, the file the Coverage workflow uploads;
// `./gradlew :grails-forge-core:test :grails-forge-core:jacocoTestReport` reports one module.
// A JVM the specs start themselves (a generated build, the forked command line) carries no agent and is not counted.
Set<String> coverageTasks = ['jacocoAggregateReport', 'jacocoTestReport'] as Set
boolean coverageRequested = gradle.startParameter.taskNames.any { String requested ->
    coverageTasks.contains(requested.substring(requested.lastIndexOf(':') + 1))
}
if (coverageRequested) {
    pluginManager.apply('org.apache.grails.gradle.grails-jacoco')
}
