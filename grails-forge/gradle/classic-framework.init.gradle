// Passed to the builds of the applications the Forge specs generate when the Forge build runs with
// -PgrailsIndy=false (see gradle/test-config.gradle). The framework those applications consume from
// build/local-maven was then compiled with classic call sites, which Groovy 6 loads only with
// groovy-callsite, so each generated application declares the module on every source set, as any
// application that depends on a library compiled that way must. A published Grails is compiled with
// invokedynamic, so a real application never needs this, and the generated build files stay as Forge
// writes them.
allprojects {
    plugins.withId('java-base') {
        sourceSets.configureEach { sourceSet ->
            dependencies.add(sourceSet.implementationConfigurationName, 'org.apache.groovy:groovy-callsite')
        }
    }
}
