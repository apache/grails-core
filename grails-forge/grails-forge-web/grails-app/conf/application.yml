---
grails:
  profile: rest-api
  mime:
    types:
      json: ['application/json', 'application/hal+json', 'text/json']
      all: '*/*'
  cors:
    enabled: true
    allowedOrigins:
      - https://grails.github.io
      - "${CORS_ALLOWED_ORIGIN:https://start.grails.org}"
      - "${CORS_ALLOWED_ORIGIN_APACHE:https://grails.apache.org}"
    allowedMethods:
      - GET
    allowedHeaders:
      - '*'
  forge:
    redirect-url: ${GITHUB_REDIRECT_URL:https://start.grails.org/}
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
