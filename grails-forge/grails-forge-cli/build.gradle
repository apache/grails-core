import org.grails.forge.internal.tasks.GenerateManpageAsciidoc
import org.grails.forge.internal.tasks.PicocliBuildCompletionTask

plugins {
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.gradle.grails-app'
    id 'java-library' // api: what a program that calls GrailsCli.execute compiles against
    id 'java-test-fixtures' // CliRunner, which the specs here and in test-core run one command bean with
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.gradle.grails-code-style'
}

version = projectVersion
group = 'org.apache.grails.forge'

grails {
    // a generator has no developer CLI tier of its own
    cliAutoProvision = false
}

configurations.configureEach {
    resolutionStrategy {
        // prevent fatJar result containing multiple versions of picocli
        force("info.picocli:picocli:$picocliVersion")
    }
}

def processManPages = tasks.register('processManPages', Sync)
configurations {
    generateConfig

    asciidocPages {
        canBeConsumed = true
        canBeResolved = false
        outgoing.artifact(processManPages.map {
            it.project.layout.buildDirectory.dir('processed-manpages').get().asFile
        })
    }
}

// the test fixtures serve the specs of this build and are not published with the CLI
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { ConfigurationVariantDetails details ->
    details.skip()
}
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { ConfigurationVariantDetails details ->
    details.skip()
}

ext {
    pomTitle = 'Apache Grails® Application Forge CLI'
    pomDescription = 'Generates Apache Grails® applications from the command line'
    cliProject = true
    // the Grails application the launcher starts, and the picocli root command the code generators read
    startMainClass = 'org.grails.forge.cli.Application'
    rootCommandClass = 'org.grails.forge.cli.ForgeCommand'
    sbomProjectType = org.cyclonedx.model.Component.Type.APPLICATION.name()
    forgeTestsNeedLocalMaven = true
}

dependencies {
    implementation platform("org.apache.grails:grails-bom:$projectVersion")
    generateConfig "info.picocli:picocli-codegen:$picocliVersion"

    // the generator: the Forge plugin, consumed as an application consumes any Grails plugin
    implementation project(':grails-forge-core')
    // the framework of a Grails application without a web server
    implementation 'org.apache.grails:grails-core'
    implementation 'org.apache.grails.bootstrap:grails-bootstrap' // grails.codegen.model, for add-property
    // GrailsCli, which a program calls (see "Starting the Command Line from a Tool" in the guide), is a Groovy class:
    // its supertype groovy.lang.GroovyObject is on the class path a program compiles a call of execute against
    api 'org.apache.groovy:groovy'
    // the document help --json writes
    implementation 'org.apache.groovy:groovy-json'

    implementation "info.picocli:picocli:$picocliVersion"
    implementation 'jakarta.inject:jakarta.inject-api'
    // InteractiveShell drives JLine directly, and since the ansi stream install was dropped it also
    // relies on JLine's terminal for virtual-terminal processing. CommandLineCompleter connects it to
    // picocli's completion itself: picocli's own bridge, picocli-shell-jline3, is built for JLine 3.
    implementation 'org.jline:jline'
    // What the commands that are a build of the project run Gradle with, see GradleBuild. It is published to the
    // repository of Gradle and not to Maven Central; repo.grails.org, which this build resolves from, serves it.
    // Its version is the Gradle of the wrappers: gradleToolingApiVersion in the gradle.properties of the root.
    implementation("org.gradle:gradle-tooling-api:$gradleToolingApiVersion") {
        // the logging API is the one the BOM manages
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    implementation 'org.slf4j:slf4j-api'
    implementation 'org.yaml:snakeyaml'
    runtimeOnly 'org.slf4j:slf4j-nop'

    // CliRunner, the fixture the specs run one command bean with
    testFixturesImplementation platform("org.apache.grails:grails-bom:$projectVersion")
    testFixturesImplementation 'org.apache.groovy:groovy'
    testFixturesImplementation 'org.springframework:spring-context'
    testFixturesImplementation "info.picocli:picocli:$picocliVersion"

    testImplementation "org.reflections:reflections:$reflectionsVersion"
    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'org.spockframework:spock-core', {
        exclude group: 'org.apache.groovy', module: 'groovy-all'
    }
    testImplementation 'org.apache.groovy:groovy-test'
    // what writes the catalog of the application commands, for the spec that reads what it writes: that class alone, and nothing it brings
    testImplementation "org.apache.grails.gradle:grails-gradle-model:$projectVersion", {
        transitive = false
    }
    testRuntimeOnly 'org.objenesis:objenesis'
}

tasks.named('test', Test).configure { Test test ->
    // the specs name their catalogs themselves, whatever the environment of whoever runs them names; and a spec that
    // would ask another computer for anything fails with the address (NoNetworkExtension, in the test sources)
    test.environment('GRAILS_FORGE_CATALOG', 'none')
    // and so do the specs of list-plugins and plugin-info name their plugin index
    test.environment('GRAILS_PLUGIN_INDEX', 'none')
    // How the commands run Gradle is what it is without the variable, whatever the environment of whoever runs the specs
    // says: a command line that runs one command starts the wrapper, which in the specs of the commands is a script that
    // writes down what it was given. A spec that holds another way to something asks for it itself (GradleBuild.setRunner).
    test.environment('GRAILS_GRADLE_RUNNER', 'auto')
    // BundledPluginsSpec holds the list of the plugins of this release to the plugin classes in the sources of the framework:
    // a project that is added to its build, which is where a new plugin comes from, runs the spec again
    test.inputs.files(rootProject.layout.projectDirectory.file('../settings.gradle'), rootProject.layout.projectDirectory.file('../gradle/publish-root-config.gradle'))
            .withPropertyName('frameworkProjects').withPathSensitivity(PathSensitivity.NONE)
    // -PpluginIndex=<file> has PluginIndexCatalogSpec, PluginIndexSpec and PluginDiscoveryContractSpec read a whole copy of grails-plugins-index.json besides the part
    // among the test resources, such as the index the indexer of apache/grails-plugins-metadata writes with the packs it records:
    // ./gradlew :grails-forge-cli:test --tests '*PluginIndexCatalogSpec' -PpluginIndex=/path/to/grails-plugins-index.json
    if (providers.gradleProperty('pluginIndex').present) {
        test.systemProperty('forge.pluginIndex', providers.gradleProperty('pluginIndex').get())
    }
    // RunAppReadinessSpec holds the command line to what it and grails-startup-progress agree on, which is written down there
    test.inputs.file(rootProject.layout.projectDirectory.file('../grails-startup-progress/src/test/resources/org/apache/grails/startup/run-app-protocol.properties'))
            .withPropertyName('runAppProtocol').withPathSensitivity(PathSensitivity.NONE)
    // FormerCommandsSpec holds the guide to the table of the commands of earlier versions
    test.inputs.file(rootProject.layout.projectDirectory.file('../grails-doc/src/en/guide/commandLine.adoc'))
            .withPropertyName('commandLineGuide').withPathSensitivity(PathSensitivity.NONE)
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/doc-config.gradle')
}

def generateManpageAsciiDoc = tasks.register('generateManpageAsciiDoc', GenerateManpageAsciidoc) {
    mainClass = findProperty('rootCommandClass') as String
    classpath.from(configurations.generateConfig, sourceSets.main.runtimeClasspath)
    outputDirectory = layout.buildDirectory.dir('generated-picocli-docs')
}

processManPages.configure { Sync it ->
    it.group = 'documentation'
    it.from generateManpageAsciiDoc
    it.include '**/*.adoc'
    it.into layout.buildDirectory.dir('processed-manpages')
    it.filter { String line ->
        if (line == ':doctype: manpage' || line.startsWith('= ')) {
            return ''
        } else if (line.startsWith('==')) {
            return '=' + line
        } else {
            return line
        }
    }
}

// The completion script of the program grails for bash and zsh (build-completion/grails_completion), which the
// distribution of grails-cli has in its bin directory: written from the command line as the program has it,
// every command of the command line itself with its options, those of a project among them.
def buildCompletion = tasks.register('buildCompletion', PicocliBuildCompletionTask)
buildCompletion.configure { PicocliBuildCompletionTask it ->
    it.outputDirectory.set(layout.buildDirectory.dir('build-completion'))
    it.classpath.from(sourceSets.main.runtimeClasspath)
    it.mainClass.set('org.grails.forge.cli.CompletionScript')
    // the name of the program, as org.apache.grails.forge.cli.GrailsCli starts the command line
    it.commandName.set('grails')
}

// The CLI is distributed through the shadow jar of grails-cli and consumed as a library by it and by
// test-core, so the plain jar keeps its name, and the executable jar Spring Boot would build is not made.
// Its module name is that of the package of its entry point, GrailsCli, which no other jar of Grails has.
TaskProvider<Jar> jarTask = tasks.named('jar', Jar)
jarTask.configure { Jar it ->
    it.archiveClassifier.set('')
    it.manifest {
        attributes 'Main-Class': project.property('startMainClass'), 'Automatic-Module-Name': 'org.apache.grails.forge.cli'
    }
}
tasks.named('bootJar').configure {
    it.enabled = false
}
