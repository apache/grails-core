import org.grails.forge.internal.tasks.GenerateManpageAsciidoc
import org.grails.forge.internal.tasks.PicocliBuildCompletionTask

plugins {
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.gradle.grails-app'
    id 'java-test-fixtures' // CliRunner, which the specs here and in test-core run one command bean with
    // the pages of the code generation commands, under grails-app/views/forge/cli
    id 'org.apache.grails.gradle.grails-gsp'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.gradle.grails-code-style'
}

version = projectVersion
group = 'org.apache.grails.forge'

grails {
    // a generator has no developer CLI tier of its own
    cliAutoProvision = false
}

configurations.configureEach {
    resolutionStrategy {
        // prevent fatJar result containing multiple versions of picocli
        force("info.picocli:picocli:$picocliVersion")
    }
}

def processManPages = tasks.register('processManPages', Sync)
configurations {
    generateConfig

    asciidocPages {
        canBeConsumed = true
        canBeResolved = false
        outgoing.artifact(processManPages.map {
            it.project.layout.buildDirectory.dir('processed-manpages').get().asFile
        })
    }
}

// the test fixtures serve the specs of this build and are not published with the CLI
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { ConfigurationVariantDetails details ->
    details.skip()
}
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { ConfigurationVariantDetails details ->
    details.skip()
}

ext {
    pomTitle = 'Apache Grails® Application Forge CLI'
    pomDescription = 'Generates Apache Grails® applications from the command line'
    cliProject = true
    // the Grails application the launcher starts, and the picocli root command the code generators read
    startMainClass = 'org.grails.forge.cli.Application'
    rootCommandClass = 'org.grails.forge.cli.ForgeCommand'
    sbomProjectType = org.cyclonedx.model.Component.Type.APPLICATION.name()
    forgeTestsNeedLocalMaven = true
}

dependencies {
    implementation platform("org.apache.grails:grails-bom:$projectVersion")
    generateConfig "info.picocli:picocli-codegen:$picocliVersion"

    // the generator: the Forge plugin, consumed as an application consumes any Grails plugin
    implementation project(':grails-forge-core')
    // the framework of a Grails application without a web server
    implementation 'org.apache.grails:grails-core'
    implementation 'org.apache.grails.bootstrap:grails-bootstrap' // grails.codegen.model, for add-property
    implementation 'org.apache.groovy:groovy'

    // renders the compiled pages, without a web request
    implementation 'org.apache.grails.views:grails-gsp-core'
    // the page compiler compileGroovyPages forks, which lives in the web GSP module; needed to build
    // the pages only
    compileOnly 'org.apache.grails.views:grails-web-gsp'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    implementation "info.picocli:picocli:$picocliVersion"
    implementation "info.picocli:picocli-shell-jline3:$picocliVersion"
    implementation 'jakarta.inject:jakarta.inject-api'
    // InteractiveShell drives JLine directly, and since the ansi stream install was dropped it also
    // relies on JLine's terminal for virtual-terminal processing; pin it rather than inheriting
    // whatever version picocli-shell-jline3 happens to bring
    implementation 'org.jline:jline'
    implementation 'org.yaml:snakeyaml'
    runtimeOnly 'org.slf4j:slf4j-nop'

    // CliRunner, the fixture the specs run one command bean with
    testFixturesImplementation platform("org.apache.grails:grails-bom:$projectVersion")
    testFixturesImplementation 'org.apache.groovy:groovy'
    testFixturesImplementation 'org.springframework:spring-context'
    testFixturesImplementation "info.picocli:picocli:$picocliVersion"

    testImplementation "org.reflections:reflections:$reflectionsVersion"
    testImplementation "org.testcontainers:spock:$testcontainersVersion"
    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'org.spockframework:spock-core', {
        exclude group: 'org.apache.groovy', module: 'groovy-all'
    }
    testImplementation 'org.apache.groovy:groovy-test'
    testRuntimeOnly 'org.objenesis:objenesis'
}

// The specs render the pages as the application ships them, compiled. The GSP plugin leaves the
// compiled pages off a Grails build's test class path, where an application renders its views from source.
tasks.named('test', Test).configure { Test test ->
    test.classpath += files(layout.buildDirectory.dir('gsp-classes/main')).builtBy('compileGroovyPages')
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/doc-config.gradle')
}

def generateManpageAsciiDoc = tasks.register('generateManpageAsciiDoc', GenerateManpageAsciidoc) {
    mainClass = findProperty('rootCommandClass') as String
    classpath.from(configurations.generateConfig, sourceSets.main.runtimeClasspath)
    outputDirectory = layout.buildDirectory.dir('generated-picocli-docs')
}

processManPages.configure { Sync it ->
    it.group = 'documentation'
    it.from generateManpageAsciiDoc
    it.include '**/*.adoc'
    it.into layout.buildDirectory.dir('processed-manpages')
    it.filter { String line ->
        if (line == ':doctype: manpage' || line.startsWith('= ')) {
            return ''
        } else if (line.startsWith('==')) {
            return '=' + line
        } else {
            return line
        }
    }
}

def buildCompletion = tasks.register('buildCompletion', PicocliBuildCompletionTask)
buildCompletion.configure { PicocliBuildCompletionTask it ->
    it.outputDirectory.set(layout.buildDirectory.dir('build-completion'))
    it.classpath.from(sourceSets.main.runtimeClasspath)
    it.mainClass.set(findProperty('rootCommandClass'))
}

// The CLI is distributed through the shadow jar of grails-cli and consumed as a library by it and by
// test-core, so the plain jar keeps its name, and the executable jar Spring Boot would build is not made.
TaskProvider<Jar> jarTask = tasks.named('jar', Jar)
jarTask.configure { Jar it ->
    it.archiveClassifier.set('')
    it.manifest {
        attributes 'Main-Class': project.property('startMainClass')
    }
}
tasks.named('bootJar').configure {
    it.enabled = false
}
