# The grails launcher (grails-cli) binds SLF4J to slf4j-simple. The Grails application
# this CLI starts logs its lifecycle at INFO, which is noise on a generator's console, so the
# launcher logs warnings and errors only. The Forge CLI on its own binds slf4j-nop and ignores this.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.err
# An application that cannot be started is said in one line by the command that needed it, with the
# stack trace when --stacktrace asks for it: Spring's report of the failure is not written before it.
org.slf4j.simpleLogger.log.org.springframework.boot.diagnostics.LoggingFailureAnalysisReporter=off
org.slf4j.simpleLogger.log.org.springframework.boot.SpringApplication=off
