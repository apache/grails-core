#
# The grails launcher binds SLF4J to slf4j-simple, through grails-shell-cli. The Grails application
# this CLI starts logs its lifecycle at INFO, which is noise on a generator's console, so the
# launcher logs warnings and errors only. The Forge CLI on its own binds slf4j-nop and ignores this.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.err
