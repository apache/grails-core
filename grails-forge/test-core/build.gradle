plugins {
    id 'groovy'
    id 'java-library'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.gradle.grails-code-style'
}

version = projectVersion
group = 'org.apache.grails.forge'

configurations.register('generateConfig')
configurations.configureEach {
    resolutionStrategy {
        // prevent fatJar result containing multiple versions of picocli
        force("info.picocli:picocli:$picocliVersion")
    }
}

dependencies {
    implementation platform("org.apache.grails:grails-bom:$projectVersion")
    generateConfig "info.picocli:picocli-codegen:$picocliVersion"

    testImplementation project(':grails-forge-cli')
    testImplementation testFixtures(project(':grails-forge-cli'))
    testImplementation project(':grails-forge-core')
    // gradleTestKit() is a file collection: the TestKit jar, the Gradle API jar, and the Groovy 4 that
    // Gradle itself runs on. Only the first two are wanted. Left in, Gradle's Groovy would be the one the
    // compiler infers for these Groovy 5 specs and the runtime their call sites run against; GradleRunner
    // does not need it. The collection also carries Gradle's SLF4J binding, which is why there is no
    // Logback here: Spring Boot refuses to start the Forge application over another binding.
    testImplementation gradleTestKit().files.filter { File jar -> !jar.name.startsWith('groovy-') }

    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'org.spockframework:spock-core', {
        exclude group: 'org.apache.groovy', module: 'groovy-all'
    }

    testRuntimeOnly 'org.objenesis:objenesis'
    testImplementation 'org.apache.groovy:groovy-test'
}

ext {
    forgeTestsNeedLocalMaven = true
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
}
