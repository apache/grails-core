plugins {
    id 'groovy'
    id 'java-library'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.gradle.grails-code-style'
}

version = projectVersion
group = 'org.apache.grails.forge'

// McpGeneratedApplicationSpec starts grails mcp from the jar the Grails wrapper downloads: its task is read below
evaluationDependsOn(':grails-cli')

configurations.register('generateConfig')
configurations.configureEach {
    resolutionStrategy {
        // prevent fatJar result containing multiple versions of picocli
        force("info.picocli:picocli:$picocliVersion")
    }
}

dependencies {
    implementation platform("org.apache.grails:grails-bom:$projectVersion")
    generateConfig "info.picocli:picocli-codegen:$picocliVersion"

    testImplementation project(':grails-forge-cli')
    testImplementation testFixtures(project(':grails-forge-cli'))
    testImplementation project(':grails-forge-core')
    // gradleTestKit() is a file collection: the TestKit jar, the Gradle API jar, and the Groovy 4 that
    // Gradle itself runs on. Only the first two are wanted. Left in, Gradle's Groovy would be the one the
    // compiler infers for these Groovy 5 specs and the runtime their call sites run against; GradleRunner
    // does not need it. The collection also carries Gradle's SLF4J binding, which is why there is no
    // Logback here: Spring Boot refuses to start the Forge application over another binding.
    testImplementation gradleTestKit().files.filter { File jar -> !jar.name.startsWith('groovy-') }

    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'org.spockframework:spock-core', {
        exclude group: 'org.apache.groovy', module: 'groovy-all'
    }

    testRuntimeOnly 'org.objenesis:objenesis'
    testImplementation 'org.apache.groovy:groovy-test'
    // the client McpGeneratedApplicationSpec drives grails mcp with: the SDK's own, at the version grails-bom manages
    testImplementation 'io.modelcontextprotocol.sdk:mcp'
    testImplementation 'org.apache.groovy:groovy-json'
}

ext {
    forgeTestsNeedLocalMaven = true
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
}

tasks.named('test', Test).configure { Test test ->
    // The Gradle API jar of TestKit has, besides the classes of Gradle, the file in which Groovy reads its own
    // version, and it is that of the Groovy 4 Gradle runs on. Groovy takes the first such file on the class path.
    // Generating an application compiles the templates of the feature packs, the compiler then loads the global
    // transform of Spock from this class path, and Spock refuses a Groovy that says it is version 4. So the
    // Groovy of the specs comes first.
    FileCollection declared = test.classpath
    test.classpath = declared.filter { File jar -> jar.name ==~ /groovy-\d.*\.jar/ } + declared
}

// McpGeneratedApplicationSpec runs grails mcp as the program the Grails wrapper starts, the jar with everything in it.
// The content of the jar is the input; its path is given apart from the inputs so that it is in no cache key.
TaskProvider<Jar> cliAllJar = project(':grails-cli').tasks.named('shadowJar', Jar)
tasks.named('test', Test).configure { Test test ->
    test.inputs.files(cliAllJar).withPropertyName('cliAllJar').withPathSensitivity(PathSensitivity.NONE)
    Provider<String> cliAllJarPath = cliAllJar.flatMap { Jar jar -> jar.archiveFile }.map { RegularFile file -> file.asFile.absolutePath }
    test.jvmArgumentProviders.add({ ["-Dgrails.cli.all.jar=${cliAllJarPath.get()}".toString()] } as CommandLineArgumentProvider)
}

// FeaturePackTasksSpec runs the tasks of the Grails Gradle plugin that check and test the feature pack of a
// plugin with the Forge of this build, as a plugin gets it from a repository: the class path of the Forge
// module without its tests, which that module writes to a file for its own specs.
tasks.named('test', Test).configure { Test test ->
    test.dependsOn(':grails-forge-core:writePackCheckClasspath')
    String forgeClasspathFile = rootProject.layout.projectDirectory.file('grails-forge-core/build/pack-check/classpath.txt').asFile.absolutePath
    test.jvmArgumentProviders.add({
        ["-Dforge.packCheck.classpathFile=${forgeClasspathFile}".toString()]
    } as CommandLineArgumentProvider)
}
