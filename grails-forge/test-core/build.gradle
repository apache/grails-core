import org.gradle.api.tasks.compile.GroovyCompile

plugins {
    id 'groovy'
    id 'java-library'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.grails.forge.rocker'
    id 'org.apache.grails.buildsrc.compile'
}

version = projectVersion
group = 'org.apache.grails.forge'

sourceSets {
    test {
        rocker {
            srcDir('src/test/groovy')
        }
    }
}

configurations.register('generateConfig')
configurations.register('groovyCompiler')
configurations.configureEach {
    resolutionStrategy {
        // prevent fatJar result containing multiple versions of picocli
        force("info.picocli:picocli:$picocliVersion")
    }
}

dependencies {
    implementation platform(project(':grails-bom'))
    generateConfig "info.picocli:picocli-codegen:$picocliVersion"
    groovyCompiler platform(project(':grails-bom'))
    groovyCompiler 'org.apache.groovy:groovy'

    testImplementation project(':grails-forge-cli')
    testImplementation project(':grails-forge-core')
    testImplementation 'ch.qos.logback:logback-classic'
    // gradleTestKit() is a file collection that includes Gradle's Groovy 4.
    // groovyc is forced onto grails-bom Groovy so Spock 2.4-groovy-5.0 can compile.
    testImplementation gradleTestKit()

    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'org.spockframework:spock-core', {
        exclude group: 'org.apache.groovy', module: 'groovy-all'
    }

    testRuntimeOnly 'ch.qos.logback:logback-classic'
    testRuntimeOnly 'org.objenesis:objenesis'
    testImplementation 'org.apache.groovy:groovy-test'
}

tasks.withType(GroovyCompile).configureEach { GroovyCompile compile ->
    compile.groovyClasspath = configurations.groovyCompiler
}

ext {
    forgeTestsNeedLocalMaven = true
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/forge-test-config.gradle')
}
