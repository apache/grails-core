import org.apache.grails.buildsrc.WriteGrailsVersionInfoTask

plugins {
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.gradle.grails-plugin'
    // the generator's pages, under grails-app/views/forge, are GSPs compiled with the plugin
    id 'org.apache.grails.gradle.grails-gsp'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.gradle.grails-code-style'
}

ext {
    pomTitle = 'Apache Grails® Application Forge'
    pomDescription = 'Generates Apache Grails® applications: the Grails plugin shared by the Forge web service and the Forge CLI'
}

version = projectVersion
group = 'org.apache.grails.forge'

grails {
    // the plugin is consumed by Forge's own two applications, which wire their CLI tier themselves
    cliAutoProvision = false
    // the message bundles under src/main/resources are templates written into generated
    // applications as they are, not bundles of this plugin to escape
    native2ascii = false
}

dependencies {
    implementation platform("org.apache.grails:grails-bom:$projectVersion")

    compileOnly 'org.apache.grails:grails-core' // Provided as this is a Grails plugin
    compileOnly 'org.apache.groovy:groovy' // Provided as this is a Grails plugin
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure' // @AutoConfiguration on the descriptor

    api 'org.springframework:spring-context'
    api 'jakarta.annotation:jakarta.annotation-api'
    api 'jakarta.inject:jakarta.inject-api'
    api 'jakarta.validation:jakarta.validation-api'
    api "io.github.java-diff-utils:java-diff-utils:$javaDiffUtils"

    // renders the compiled pages, without a web request
    implementation 'org.apache.grails.views:grails-gsp-core'
    // the page compiler compileGroovyPages forks, which lives in the web GSP module; needed to build
    // the pages only, the plugin renders them with grails-gsp-core alone
    compileOnly 'org.apache.grails.views:grails-web-gsp'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    implementation "com.typesafe:config:$typesafeConfigVersion"
    implementation "org.apache.commons:commons-compress:$commonsCompressVersion"
    implementation "org.yaml:snakeyaml"
    implementation 'org.slf4j:slf4j-api'

    testImplementation 'org.apache.grails:grails-core' // ForgeGrailsPluginSpec starts the plugin in a Grails application
    testImplementation 'org.apache.groovy:groovy-yaml'
    testImplementation 'org.apache.groovy:groovy'
    testImplementation "org.spockframework:spock-core", {
        exclude group: 'org.apache.groovy', module: 'groovy-all'
    }

    testImplementation "ch.qos.logback:logback-classic"
    testRuntimeOnly 'org.objenesis:objenesis'
    testImplementation 'org.apache.groovy:groovy-test'
}


def grailsVersionsPath = layout.buildDirectory.dir('version-info')
def grailsVersionInfoTask = tasks.register('grailsVersionInfo', WriteGrailsVersionInfoTask)
grailsVersionInfoTask.configure { WriteGrailsVersionInfoTask it ->
    def bomPublicationTask = gradle.includedBuild('grails-core').task(':grails-bom:generatePomFileForMavenPublication')
    it.dependsOn(bomPublicationTask)
    it.bomPublicationFile = rootProject.layout.projectDirectory.file('../grails-bom/default/build/publications/maven/pom-default.xml')
    it.versionsDirectory = grailsVersionsPath
}
sourceSets.main.resources.srcDir(grailsVersionsPath)

tasks.named('build').configure {
    it.dependsOn(grailsVersionInfoTask)
}

// A Grails plugin's GSPs are its views, compiled rather than packaged, so the plugin build keeps them out
// of the resources. The GSPs under src/main/resources/gsp are templates the generator writes into
// generated applications, not views of this plugin, so they stay in.
tasks.named('processResources', ProcessResources).configure { ProcessResources task ->
    task.excludes = task.excludes.findAll { String pattern -> pattern != '**/*.gsp' }
}

// profile base
TaskProvider<Sync> copyGrailsWrapper = tasks.register('copyGrailsWrapper', Sync)
copyGrailsWrapper.configure { Sync it ->
    it.dependsOn(gradle.includedBuild('grails-core').task(':grails-wrapper:installDist'))

    def wrapperFiles = rootProject.layout.projectDirectory.dir('../grails-wrapper/build/install/apache-grails-wrapper-bin')
    it.inputs.files(wrapperFiles)
    it.includeEmptyDirs = false

    it.from(wrapperFiles) {
        include(
                'grailsw',
                'grailsw.bat',
                'grails-wrapper.jar'
        )
        eachFile { details -> details.path = details.name } // flatten
    }
    it.into(layout.projectDirectory.dir('src/main/resources/grails-wrapper'))
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/doc-config.gradle')
}

['processResources', 'sourcesJar'].each { name ->
    tasks.named(name).configure {
        it.dependsOn(copyGrailsWrapper, grailsVersionInfoTask)
    }
}
// The specs render the pages as the plugin ships them, compiled. The GSP plugin leaves the compiled
// pages off a Grails build's test class path, where an application renders its views from source.
tasks.named('test', Test).configure { Test test ->
    test.classpath += files(layout.buildDirectory.dir('gsp-classes/main')).builtBy('compileGroovyPages')
}
