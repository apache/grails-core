format: 1
kind: feature
templateApi: 1
name: spring-boot-starter-security
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Spring Boot Starter Security
description: "Secures the application with a lightweight, plain Spring Security setup that does NOT use any Grails plugins: spring-boot-starter-security, a GORM-backed User domain implementing UserDetails, form login and logout, a scaffolded user admin, and a bootstrapped admin account with a generated password."
category: Spring Security
documentation: 'https://docs.spring.io/spring-boot/reference/web/spring-security.html'
applicationTypes: [web]
# one of the security foundations: this starter or the Grails Spring Security Core plugin secures an application, not both
oneOf: spring-security
# after the default features, and before the build file is rendered from the dependencies of the features
order: test
adds:
  - scaffolding
dependencies:
  - scope: implementation
    coordinates: org.springframework.boot:spring-boot-starter-security
files:
  - from: User.groovy.gsp
    to: grails-app/domain/{packagePath}/User.groovy
  - from: UserController.groovy.gsp
    to: grails-app/controllers/{packagePath}/UserController.groovy
  - from: UserService.groovy.gsp
    to: grails-app/services/{packagePath}/UserService.groovy
  - from: UserSpec.groovy.gsp
    to: src/test/groovy/{packagePath}/UserSpec.groovy
