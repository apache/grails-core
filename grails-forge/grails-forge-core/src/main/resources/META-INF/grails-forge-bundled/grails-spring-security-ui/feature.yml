format: 1
kind: feature
templateApi: 1
name: grails-spring-security-ui
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Grails Spring Security UI Plugin
description: "Supplements the Grails Spring Security Core plugin - added automatically when selected - with the Spring Security UI plugin's administration screens, rendered through the application's own layout: user and role CRUD, registration and forgot-password flows (sending mail requires SMTP configuration), all on the same classic User/Role/UserRole domain model."
category: Spring Security
documentation: 'https://grails.apache.org/docs/latest/grails-spring-security-ui/'
applicationTypes: [web]
# the domain classes, the scaffolded user administration and the security settings come from the core plugin,
# which widens its rules and encodes passwords in the service when this feature is there
requires: [grails-spring-security]
# after the default features, and before the build file is rendered from the dependencies of the features
order: test
adds:
  - scaffolding
  - grails-spring-security
dependencies:
  - scope: implementation
    coordinates: org.apache.grails:grails-spring-security-ui
  - scope: implementation
    coordinates: org.apache.grails:grails-mail
configuration:
  grails.mail.default.from: do.not.reply@localhost
