format: 1
kind: feature
templateApi: 1
name: sqlserver
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Microsoft SQL Server
description: Add Microsoft SQL Server driver and default configuration.
category: Database
oneOf: database-driver
adds:
  - testcontainers
  - feature: gorm-hibernate5
    when: { not: { anyOf: [gorm-hibernate5, gorm-hibernate7] } }
dependencies:
  - scope: runtimeOnly
    coordinates: com.microsoft.sqlserver:mssql-jdbc
dataSource:
  dataSource.driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
  dataSource.username: sa
  dataSource.password: ''
  environments:
    development:
      dataSource.dbCreate: create-drop
      dataSource.url: 'jdbc:sqlserver://localhost:1433;databaseName=devDb;socketKeepAlive=true'
    test:
      dataSource.dbCreate: update
      dataSource.url: 'jdbc:sqlserver://localhost:1433;databaseName=testDb;socketKeepAlive=true'
    production:
      dataSource.dbCreate: none
      dataSource.url: 'jdbc:sqlserver://localhost:1433;databaseName=prodDb;socketKeepAlive=true'
