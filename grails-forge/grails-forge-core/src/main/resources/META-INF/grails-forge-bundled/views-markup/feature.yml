format: 1
kind: feature
templateApi: 1
name: views-markup
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Markup Views
description: Markup views are written in Groovy, end with the file extension gml and reside in the grails-app/views directory. They provide a DSL for producing output in the XML.
category: View Rendering
guideOfGrails: guide/theWebLayer.html
oneOf: api-views
adds:
  - grails-web
buildPlugins:
  - id: org.apache.grails.gradle.grails-markup
    apply: true
dependencies:
  - scope: implementation
    coordinates: org.apache.grails:grails-views-markup
files:
  - from: index.gml.gsp
    to: grails-app/views/application/index.gml
  - from: _errors.gml.gsp
    to: grails-app/views/errors/_errors.gml
  - from: error.gml.gsp
    to: grails-app/views/error.gml
  - from: notFound.gml.gsp
    to: grails-app/views/notFound.gml
