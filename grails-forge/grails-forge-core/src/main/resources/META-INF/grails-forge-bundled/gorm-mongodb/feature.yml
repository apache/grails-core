format: 1
kind: feature
templateApi: 1
name: gorm-mongodb
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Grails Data for MongoDB
description: Configure Grails Data for using MongoDB.
category: Database
thirdPartyDocumentation: 'https://grails.apache.org/docs/latest/grails-data/mongodb/manual/'
oneOf: data-nosql
default: { option: { data: mongodb } }
adds:
  - testcontainers
dependencies:
  - scope: implementation
    coordinates: org.apache.grails:grails-data-mongodb
  # without it a generated application only starts when a MongoDB happens to be listening on the url of
  # production, so it is there by default and not a feature of its own
  - scope: implementation
    coordinates: org.apache.grails:grails-data-mongodb-embedded
# development and test name the embedded server where they would name a host, the way an application with a
# database driver names an in-memory H2 there; production reaches the server MONGO_HOST and MONGO_PORT name
configuration:
  grails.mongodb.url: 'mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/prodDb'
  environments:
    development:
      grails.mongodb.url: 'mongodb://embedded/devDb'
    test:
      grails.mongodb.url: 'mongodb://embedded/testDb'
