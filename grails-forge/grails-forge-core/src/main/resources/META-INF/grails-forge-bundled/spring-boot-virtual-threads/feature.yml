format: 1
kind: feature
templateApi: 1
name: spring-boot-virtual-threads
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Spring Boot Virtual Threads
description: Enables Virtual Threads in Spring Boot for JDK 25+.
category: Spring Framework
documentation: 'https://docs.spring.io/spring-boot/reference/features/spring-application.html#features.spring-application.virtual-threads'
oneOf: threading
# the setting is always written, and turns virtual threads on only for JDK 25 and later
configuration:
  - when: { jdkAtLeast: 25 }
    values:
      spring.threads.virtual.enabled: true
  - when: { not: { jdkAtLeast: 25 } }
    values:
      spring.threads.virtual.enabled: false
