format: 1
kind: feature
templateApi: 1
name: logback-config
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Logback Configuration
description: Generates an editable grails-app/conf/logback-spring.xml. Logback logging already works out of the box via Spring Boot's defaults; add this only to customize logging configuration in XML.
category: Logging
oneOf: logging
# it takes the place of the default feature of the group, logback, so it names grails-logging again
dependencies:
  - scope: implementation
    coordinates: org.apache.grails:grails-logging
files:
  - from: logback-spring.xml.gsp
    to: grails-app/conf/logback-spring.xml
