format: 1
kind: feature
templateApi: 1
name: cache-ehcache
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Ehcache Plugin
description: The Grails Ehcache Plugin extends the Cache Plugin and uses Ehcache as the storage provider for cached content.
category: Cache
documentation: 'https://grails-plugins.github.io/grails-cache-ehcache/latest/'
thirdPartyDocumentation: 'https://www.ehcache.org/'
oneOf: cache-provider
dependencies:
  - scope: implementation
    coordinates: org.grails.plugins:cache-ehcache
    versionOfForge: true
configuration:
  grails.cache.ehcache.ehcacheXmlLocation: 'classpath:ehcache.xml'
  grails.cache.ehcache.lockTimeout: 200
