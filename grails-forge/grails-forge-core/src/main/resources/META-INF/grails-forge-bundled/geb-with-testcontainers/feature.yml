format: 1
kind: feature
templateApi: 1
name: geb-with-testcontainers
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Geb Functional Testing for Grails with Testcontainers
description: This plugins configure Geb for Grails framework to write automation tests that run with Testcontainers.
category: Testing
documentation: 'https://github.com/apache/grails-geb#readme'
thirdPartyDocumentation: 'https://groovy.apache.org/geb/manual/current/'
applicationTypes: [web, web-plugin]
oneOf: geb
order: test
default:
  allOf:
    - applicationType: web
    - not: { group: geb }
# the generated specification opens the home page, which is a GSP view
reliesOn:
  - gsp
adds:
  - spock
dependencies:
  - scope: integrationTestImplementationTestFixtures
    coordinates: org.apache.grails:grails-geb
files:
  - from: ContainerGebSpec.groovy.gsp
    to: src/integration-test/groovy/{packagePath}/{className}Spec.groovy
