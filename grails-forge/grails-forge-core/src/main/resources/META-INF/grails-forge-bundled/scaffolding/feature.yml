format: 1
kind: feature
templateApi: 1
name: scaffolding
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Scaffolding
description: The Scaffolding Plugin simplifies generating CRUD interfaces for domain classes. It is useful for rapid prototyping and creates basic data management user interfaces with minimal manual code.
guideOfGrails: guide/scaffolding.html
applicationTypes: [web, web-plugin, rest-api, rest-api-plugin]
default: { applicationType: [web, web-plugin] }
# a REST API has JSON views and no GSP, which is how the commands of the plugin tell that it is given JSON views
adds:
  - feature: gsp
    when: { applicationType: [web, web-plugin] }
# a web application has the plugin, which also scaffolds pages at run time; a REST API has its commands and their
# templates only, which generate sources: the plugin, GSP and the fields plugin stay off the class path it runs with
dependencies:
  - scope: implementation
    coordinates: org.apache.grails:grails-scaffolding
    when: { applicationType: [web, web-plugin] }
  - scope: grailsCli
    coordinates: org.apache.grails:grails-scaffolding-cli
    when: { applicationType: [rest-api, rest-api-plugin] }
