format: 1
kind: feature
templateApi: 1
name: spring-boot-devtools
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: SpringBoot Developer Tools
description: Spring Boot Devtools is a powerful tool that enhances development productivity by providing features like automatic application restarts on code changes, live reloading of static resources, and remote debugging support. It enables developers to rapidly iterate and test changes during the development process, making it a valuable asset for Spring Boot projects.
category: Development Tools
documentation: 'https://docs.spring.io/spring-boot/reference/using/devtools.html'
oneOf: reloading
visible: false
default:
  allOf:
    - option: { reloading: devtools }
    - not: grails-micronaut
dependencies:
  - scope: developmentOnly
    coordinates: org.springframework.boot:spring-boot-devtools
configuration:
  - environmentFile: development
    values:
      spring.devtools.livereload.enabled: true
