format: 1
kind: feature
templateApi: 1
name: asset-pipeline-grails
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Asset Pipeline
description: Asset Pipeline is used for managing and processing static assets (such as JavaScript, CSS and image files) in Grails applications. Read more at https://github.com/wondrify/asset-pipeline.
category: View Rendering
documentation: 'https://github.com/wondrify/asset-pipeline#readme'
applicationTypes: [web, web-plugin]
default: { applicationType: [web, web-plugin] }
dependencies:
  - scope: buildscript
    coordinates: cloud.wondrify:asset-pipeline-gradle
  - scope: runtimeOnly
    coordinates: cloud.wondrify:asset-pipeline-grails
  - scope: testAndDevelopmentOnly
    coordinates: org.webjars.npm:bootstrap
  - scope: testAndDevelopmentOnly
    coordinates: org.webjars.npm:bootstrap-icons
  - scope: testAndDevelopmentOnly
    coordinates: org.webjars.npm:jquery
buildPlugins:
  - id: cloud.wondrify.asset-pipeline
    apply: true
# The webjars that only serve development and tests are left out of the packaged assets, apart from
# the files of them the application uses.
build:
  extensions:
    assets:
      - when: { applicationType: web-plugin }
        text: packagePlugin = true
      - text: |
          excludes = [
                  'webjars/jquery/**',
                  'webjars/bootstrap/**',
                  'webjars/bootstrap-icons/**',
      - when: { feature: openapi }
        text: "        'webjars/swagger-ui/**',"
      - text: |
          ]
          includes = [
                  'webjars/jquery/*/dist/jquery.js',
                  'webjars/bootstrap/*/dist/js/bootstrap.bundle.js',
                  'webjars/bootstrap/*/dist/css/bootstrap.css',
                  'webjars/bootstrap-icons/*/font/bootstrap-icons.css',
                  'webjars/bootstrap-icons/*/font/fonts/*',
          ]
files:
  - from: images/advancedgrails.svg
    to: grails-app/assets/images/advancedgrails.svg
  - from: images/community.svg
    to: grails-app/assets/images/community.svg
  - from: images/documentation.svg
    to: grails-app/assets/images/documentation.svg
  - from: images/favicon.ico
    to: grails-app/assets/images/favicon.ico
  - from: images/grails.svg
    to: grails-app/assets/images/grails.svg
  - from: images/groovy.svg
    to: grails-app/assets/images/groovy.svg
  - from: images/java.svg
    to: grails-app/assets/images/java.svg
  - from: images/spring.svg
    to: grails-app/assets/images/spring.svg
  - from: images/spring-boot.svg
    to: grails-app/assets/images/spring-boot.svg
  - from: javascripts/application.js
    to: grails-app/assets/javascripts/application.js
  - from: javascripts/theme.js
    to: grails-app/assets/javascripts/theme.js
  - from: javascripts/welcome.js
    to: grails-app/assets/javascripts/welcome.js
  - from: stylesheets/application.css
    to: grails-app/assets/stylesheets/application.css
  - from: stylesheets/errors.css
    to: grails-app/assets/stylesheets/errors.css
  - from: stylesheets/grails.css
    to: grails-app/assets/stylesheets/grails.css
  - from: stylesheets/welcome.css
    to: grails-app/assets/stylesheets/welcome.css
