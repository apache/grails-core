format: 1
kind: feature
templateApi: 1
name: gorm-neo4j
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: GORM for Neo4j
description: Configure GORM for using Neo4j
category: Database
thirdPartyDocumentation: 'https://grails.apache.org/docs/latest/grails-data/neo4j/manual/'
oneOf: data-nosql
default: { option: { data: neo4j } }
dependencies:
  - scope: implementation
    coordinates: org.apache.grails:grails-data-neo4j
  - scope: testRuntimeOnly
    coordinates: org.neo4j.test:neo4j-harness
configuration:
  grails.neo4j.type: embedded
  grails.neo4j.location: build/data/neo4j
