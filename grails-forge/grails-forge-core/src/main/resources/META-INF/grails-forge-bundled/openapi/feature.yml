format: 1
kind: feature
templateApi: 1
name: openapi
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: OpenAPI / Swagger UI
description: "Describes the application's URL mappings and domain classes as an OpenAPI document, served at /v3/api-docs and browsable at /swagger-ui/index.html outside production."
category: API
guideOfGrails: 'guide/REST.html#openApi'
applicationTypes: [web, rest-api]
dependencies:
  - scope: implementation
    coordinates: org.apache.grails:grails-openapi
  - scope: implementation
    coordinates: org.springdoc:springdoc-openapi-starter-webmvc-ui
# The document describes every endpoint and constraint to whoever can reach it, so it is not served
# in production unless the application chooses to.
configuration:
  environments:
    production:
      springdoc.api-docs.enabled: false
      springdoc.swagger-ui.enabled: false
