format: 1
kind: feature
templateApi: 1
name: asciidoctor
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: AsciiDoc
description: Add support for creating AsciiDoc documentation.
category: Documentation
versionsOfForge:
  asciidoctorj: '3.0.0'
  asciidoctorj-diagram: '2.3.1'
buildPlugins:
  - id: org.asciidoctor.jvm.convert
    artifactOfForge: asciidoctor-gradle-jvm
build:
  blocks:
    afterPlugins: 'apply from: "gradle/asciidoc.gradle"'
files:
  - from: asciidoc.gradle.gsp
    to: gradle/asciidoc.gradle
  - from: index.adoc.gsp
    to: src/docs/asciidoc/index.adoc
