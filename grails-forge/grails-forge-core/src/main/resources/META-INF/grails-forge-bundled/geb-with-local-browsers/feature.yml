format: 1
kind: feature
templateApi: 1
name: geb-with-local-browsers
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Geb Functional Testing with locally installed browsers
description: Configures Geb to run functional tests against browsers installed on your machine. Selenium Manager downloads the WebDriver binary that matches each browser.
category: Testing
documentation: 'https://github.com/apache/grails-geb#readme'
thirdPartyDocumentation: 'https://groovy.apache.org/geb/manual/current/'
applicationTypes: [web, web-plugin]
oneOf: geb
order: test
# the generated specification opens the home page, which is a GSP view
reliesOn:
  - gsp
adds:
  - spock
dependencies:
  - scope: integrationTestImplementationTestFixtures
    coordinates: org.apache.grails:grails-geb
  - scope: testImplementation
    coordinates: org.seleniumhq.selenium:selenium-api
  - scope: testImplementation
    coordinates: org.seleniumhq.selenium:selenium-support
  - scope: testImplementation
    coordinates: org.seleniumhq.selenium:selenium-remote-driver
  - scope: testRuntimeOnly
    coordinates: org.seleniumhq.selenium:selenium-firefox-driver
  - scope: testRuntimeOnly
    coordinates: org.seleniumhq.selenium:selenium-safari-driver
files:
  - from: GebSpec.groovy.gsp
    to: src/integration-test/groovy/{packagePath}/{className}Spec.groovy
  - from: GebConfig.groovy.gsp
    to: src/integration-test/resources/GebConfig.groovy
