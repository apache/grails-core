format: 1
kind: feature
templateApi: 1
name: database-migration
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Database Migration
description: Add support for Liquibase database migrations. The Database Migration Plugin helps you manage database schema changes while developing Grails applications.
category: Database
guideOfGrails: 'grails-data/hibernate5/manual/index.html#databaseMigration'
thirdPartyDocumentation: 'https://docs.liquibase.com/home.html'
oneOf: migration
dependencies:
  - scope: implementation
    coordinates: org.apache.grails:grails-data-hibernate7-dbmigration
    when: { feature: gorm-hibernate7 }
  - scope: implementation
    coordinates: org.apache.grails:grails-data-hibernate5-dbmigration
    when: { not: gorm-hibernate7 }
files:
  - from: .gitkeep
    to: grails-app/migrations/.gitkeep
