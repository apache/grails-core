format: 1
kind: feature
templateApi: 1
name: cache
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Cache
description: The Cache Plugin provides powerful and easy-to-use caching functionality for Grails applications and plugins.
category: Cache
guideOfGrails: guide/cache.html
dependencies:
  - scope: implementation
    coordinates: org.apache.grails:grails-cache
configuration:
  - values:
      grails.cache.enabled: true
      grails.cache.cleanAtStartup: false
  # beside a cache provider the cache manager is the grailsCacheManager that resources.groovy defines, which this does not choose
  - when: { not: { group: cache-provider } }
    values:
      grails.cache.cacheManager: grails.plugin.cache.GrailsConcurrentMapCacheManager
