format: 1
kind: feature
templateApi: 1
name: grails-compile-static
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Compile Static
description: "Compiles controllers, services and tag libraries statically, and GSP views in applications that use GSP, by enabling the Grails Gradle plugin's compileStatic options."
category: Configuration
# Each option is set on its own rather than through `all`, so an artefact type a later release adds
# to `all` is not compiled statically without being asked for.
build:
  extensions:
    grails:
      - text: |
          compileStatic {
              controllers = true
              services = true
              tagLibs = true
      - when: { feature: gsp }
        text: '    gsp = true'
      - text: '}'
