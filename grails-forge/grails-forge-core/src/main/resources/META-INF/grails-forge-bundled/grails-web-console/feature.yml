format: 1
kind: feature
templateApi: 1
name: grails-web-console
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Web Console
description: A web-based Groovy console for interactive runtime application management and debugging.
category: Management
documentation: 'https://github.com/grails-plugins/grails-web-console/#readme'
dependencies:
  - scope: runtimeOnly
    coordinates: org.grails.plugins:grails-web-console
    versionOfForge: true
configuration:
  environments:
    production:
      grails.plugin.console.enabled: false
      grails.plugin.console.fileStore.remote.enabled: false
