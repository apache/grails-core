format: 1
kind: feature
templateApi: 1
name: grails-gradle-plugin
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
visible: false
default: true
dependencies:
  - scope: buildscript
    coordinates: org.apache.grails:grails-gradle-plugins
buildPlugins:
  - id: org.apache.grails.gradle.grails-plugin
    apply: true
    when: { applicationType: [plugin, web-plugin, rest-api-plugin] }
  - id: org.apache.grails.gradle.grails-web
    apply: true
    when:
      allOf:
        - applicationType: [web, rest-api]
        - grails-web
  - id: org.apache.grails.gradle.grails-gsp
    apply: true
    when: { feature: gsp }
