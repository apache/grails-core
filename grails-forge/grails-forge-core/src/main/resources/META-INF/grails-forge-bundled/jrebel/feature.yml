format: 1
kind: feature
templateApi: 1
name: jrebel
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: JRebel JVM Agent
description: Adds support for class reloading with JRebel (requires separate JRebel installation)
category: Development Tools
documentation: 'https://manuals.jrebel.com/jrebel/standalone/springboot.html'
oneOf: reloading
visible: false
default: { option: { reloading: jrebel } }
buildPlugins:
  - id: org.zeroturnaround.gradle.jrebel
    artifactOfForge: gradle-jrebel-plugin
build:
  propertyComments:
    - 'TODO: Replace with agent path from JRebel installation; see documentation'
    - 'rebelAgent=-agentpath:~/bin/jrebel/lib/jrebel6/lib/libjrebel64.dylib'
  extensions:
    tasks.bootRun: |-
      dependsOn(generateRebel)
      if (project.hasProperty("rebelAgent")) {
          jvmArgs(rebelAgent)
      }
readmeLinks:
  - label: JRebel Gradle Plugin
    href: 'https://plugins.gradle.org/plugin/org.zeroturnaround.gradle.jrebel'
