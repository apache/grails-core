format: 1
kind: feature
templateApi: 1
name: gsp
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: GSP
description: GSP (Groovy Server Pages) is the server-side view technology used in Grails. It is designed to be familiar to developers with experience in ASP or JSP, while providing a more flexible, expressive, and intuitive way to build web pages.
category: View Rendering
default: { applicationType: [web, web-plugin] }
adds:
  - grails-web
# the layout and the pages this feature writes use the asset tags for their styles, scripts and images
reliesOn:
  - asset-pipeline-grails
dependencies:
  - scope: implementation
    coordinates: org.apache.grails:grails-gsp
configuration:
  grails.views.gsp.encoding: UTF-8
  grails.views.gsp.codecs.scriptlet: html
files:
  - from: main.gsp
    to: grails-app/views/layouts/main.gsp
    template: false
  - from: index.gsp
    to: grails-app/views/index.gsp
    template: false
  - from: error.gsp
    to: grails-app/views/error.gsp
    template: false
  - from: notFound.gsp
    to: grails-app/views/notFound.gsp
    template: false
