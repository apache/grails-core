format: 1
kind: feature
templateApi: 1
name: gorm-graphql
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Grails Data for GraphQL
description: Generates a GraphQL schema based on entities in Grails Data.
category: API
guideOfGrails: grails-data/graphql/manual/
thirdPartyDocumentation: 'https://graphql.org'
applicationTypes: [web, rest-api]
adds:
  - feature: gorm-hibernate5
    when: { not: { anyOf: [gorm-hibernate5, gorm-hibernate7, gorm-mongodb, gorm-neo4j] } }
dependencies:
  - scope: implementation
    coordinates: org.apache.grails:grails-data-graphql
