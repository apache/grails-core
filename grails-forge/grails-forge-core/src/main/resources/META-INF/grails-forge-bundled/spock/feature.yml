format: 1
kind: feature
templateApi: 1
name: spock
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Spock Testing Framework
description: Spock is a testing, specification, and mocking framework for JVM developers that emphasizes readability and clarity. By blending BDD concepts and Groovy's concise syntax, Spock helps teams write tests that are easy to understand and enjoyable to maintain.
default: true
dependencies:
  - scope: testImplementation
    coordinates: org.spockframework:spock-core
build:
  extensions:
    tasks.withType(Test).configureEach:
      - text: useJUnitPlatform()
      - when: { feature: geb-with-local-browsers }
        text: |-
          def gebEnv = providers.systemProperty('geb.env')
          if (gebEnv.present) {
              systemProperty('geb.env', gebEnv.get())
          }
