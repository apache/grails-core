format: 1
kind: feature
templateApi: 1
name: spring-ai-anthropic
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Spring AI Anthropic
description: 'Uses Anthropic Claude models through Spring AI, which reads the API key from the ANTHROPIC_API_KEY environment variable.'
category: AI
guideOfGrails: guide/usingAi.html
thirdPartyDocumentation: 'https://docs.spring.io/spring-ai/reference/api/chat/anthropic-chat.html'
applicationTypes:
  - web
  - rest-api
requires:
  - grails-spring-ai
oneOf: spring-ai-provider
dependencies:
  - scope: implementation
    coordinates: org.springframework.ai:spring-ai-starter-model-anthropic
