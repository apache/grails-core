format: 1
kind: feature
templateApi: 1
name: mongodb-testing-support
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: MongoDB Testing Support
description: Adds Grails MongoDB testing support with Testcontainers for unit and integration tests.
category: Testing
documentation: 'https://grails.apache.org/docs/latest/guide/testing.html#testingMongodb'
# a selection without mongo-sync or gorm-mongodb is refused by MongoDBTestingSupportValidator
order: test
dependencies:
  - scope: testImplementation
    coordinates: org.apache.grails.testing:grails-testing-support-mongodb
