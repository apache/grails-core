format: 1
kind: feature
templateApi: 1
name: grails-spring-security
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Grails Spring Security Plugin
description: "Secures the application with the Grails Spring Security Core plugin: @Secured annotations, the sec taglib, the plugin's login pages backed by the classic GORM User/Role/UserRole model, static URL rules that lock the application down (the scaffolded user admin requires ROLE_ADMIN), and a bootstrapped admin account with a generated password."
category: Spring Security
documentation: 'https://grails.apache.org/docs/latest/grails-spring-security/'
applicationTypes: [web]
# one of the security foundations: the plain starter or this plugin secures an application, not both
oneOf: spring-security
# after the default features, and before the build file is rendered from the dependencies of the features
order: test
adds:
  - scaffolding
dependencies:
  - scope: implementation
    coordinates: org.apache.grails:grails-spring-security
# the classic User/Role/UserRole model, which the Spring Security UI plugin uses as it is
files:
  - from: User.groovy.gsp
    to: grails-app/domain/{packagePath}/User.groovy
  - from: Role.groovy.gsp
    to: grails-app/domain/{packagePath}/Role.groovy
  - from: UserRole.groovy.gsp
    to: grails-app/domain/{packagePath}/UserRole.groovy
  - from: UserSpec.groovy.gsp
    to: src/test/groovy/{packagePath}/UserSpec.groovy
  - from: UserService.groovy.gsp
    to: grails-app/services/{packagePath}/UserService.groovy
  - from: UserController.groovy.gsp
    to: grails-app/controllers/{packagePath}/UserController.groovy
  - from: application.groovy.gsp
    to: grails-app/conf/application.groovy
