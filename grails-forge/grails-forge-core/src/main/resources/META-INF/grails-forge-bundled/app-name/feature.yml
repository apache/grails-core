format: 1
kind: feature
templateApi: 1
name: app-name
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
visible: false
default: true
order: lowest
# The values are the tokens the build of the application replaces, between two at signs. Each at sign
# is written as \x40: the build of Forge replaces such tokens in its own resources too, and would put
# the name and version of Forge here.
configuration:
  info.app.name: "\x40info.app.name\x40"
  info.app.version: "\x40info.app.version\x40"
  info.app.grailsVersion: "\x40info.app.grailsVersion\x40"
