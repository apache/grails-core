format: 1
kind: feature
templateApi: 1
name: spring-ai-ollama
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: Spring AI Ollama
description: 'Uses models served by a local Ollama through Spring AI; no credentials needed.'
category: AI
guideOfGrails: guide/usingAi.html
thirdPartyDocumentation: 'https://docs.spring.io/spring-ai/reference/api/chat/ollama-chat.html'
applicationTypes:
  - web
  - rest-api
requires:
  - grails-spring-ai
oneOf: spring-ai-provider
dependencies:
  - scope: implementation
    coordinates: org.springframework.ai:spring-ai-starter-model-ollama
configuration:
  spring.ai.ollama.base-url: 'http://localhost:11434'
