format: 1
kind: feature
templateApi: 1
name: mongo-sync
compatibility:
  grails: '[9.0.0,10.0.0)'
  forge: '[9.0.0,10.0.0)'
title: MongoDB Synchronous Driver
description: Add support for the MongoDB Synchronous Driver.
category: Database
documentation: 'https://www.mongodb.com/docs/drivers/java/sync/current/'
thirdPartyDocumentation: 'https://www.mongodb.com/docs/'
adds:
  - testcontainers
dependencies:
  - scope: implementation
    coordinates: org.mongodb:mongodb-driver-sync
# Grails Data for MongoDB has its own urls, with embedded databases for development and test; the driver
# alone names a server to reach in every environment, which MONGO_HOST and MONGO_PORT point at another
configuration:
  - when: { not: gorm-mongodb }
    values:
      grails.mongodb.url: 'mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/prodDb'
      environments:
        development:
          grails.mongodb.url: 'mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/devDb'
        test:
          grails.mongodb.url: 'mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/testDb'
