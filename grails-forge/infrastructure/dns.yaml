AWSTemplateFormatVersion: '2010-09-09'
Description: Route 53 aliases for Grails Forge API Elastic Beanstalk slots.

Parameters:
  SharedStackName:
    Type: String
    Default: grails-forge-shared
    Description: Name of the shared Grails Forge infrastructure stack.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone ID for the Grails Forge API names.
  LatestHostName:
    Type: String
    Default: latest.grails.org
    Description: DNS hostname for the latest slot.
  SnapshotHostName:
    Type: String
    Default: snapshot.grails.org
    Description: DNS hostname for the snapshot slot.
  NextHostName:
    Type: String
    Default: next.grails.org
    Description: DNS hostname for the next slot.
  PrevHostName:
    Type: String
    Default: prev.grails.org
    Description: DNS hostname for the previous release slot.
  PrevSnapshotHostName:
    Type: String
    Default: prev-snapshot.grails.org
    Description: DNS hostname for the previous snapshot slot.

Resources:
  LatestAlias:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName:
          Fn::ImportValue:
            Fn::Sub: ${SharedStackName}:SharedLoadBalancerDnsName
        HostedZoneId:
          Fn::ImportValue:
            Fn::Sub: ${SharedStackName}:SharedLoadBalancerCanonicalHostedZoneId
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Ref: LatestHostName
      Type: A
  SnapshotAlias:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName:
          Fn::ImportValue:
            Fn::Sub: ${SharedStackName}:SharedLoadBalancerDnsName
        HostedZoneId:
          Fn::ImportValue:
            Fn::Sub: ${SharedStackName}:SharedLoadBalancerCanonicalHostedZoneId
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Ref: SnapshotHostName
      Type: A
  NextAlias:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName:
          Fn::ImportValue:
            Fn::Sub: ${SharedStackName}:SharedLoadBalancerDnsName
        HostedZoneId:
          Fn::ImportValue:
            Fn::Sub: ${SharedStackName}:SharedLoadBalancerCanonicalHostedZoneId
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Ref: NextHostName
      Type: A
  PrevAlias:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName:
          Fn::ImportValue:
            Fn::Sub: ${SharedStackName}:SharedLoadBalancerDnsName
        HostedZoneId:
          Fn::ImportValue:
            Fn::Sub: ${SharedStackName}:SharedLoadBalancerCanonicalHostedZoneId
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Ref: PrevHostName
      Type: A
  PrevSnapshotAlias:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName:
          Fn::ImportValue:
            Fn::Sub: ${SharedStackName}:SharedLoadBalancerDnsName
        HostedZoneId:
          Fn::ImportValue:
            Fn::Sub: ${SharedStackName}:SharedLoadBalancerCanonicalHostedZoneId
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Ref: PrevSnapshotHostName
      Type: A

Outputs:
  LatestHostName:
    Description: Latest slot DNS hostname.
    Value:
      Ref: LatestHostName
  SnapshotHostName:
    Description: Snapshot slot DNS hostname.
    Value:
      Ref: SnapshotHostName
  NextHostName:
    Description: Next slot DNS hostname.
    Value:
      Ref: NextHostName
  PrevHostName:
    Description: Previous release slot DNS hostname.
    Value:
      Ref: PrevHostName
  PrevSnapshotHostName:
    Description: Previous snapshot slot DNS hostname.
    Value:
      Ref: PrevSnapshotHostName
