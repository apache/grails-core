# Project version is defined in the root gradle.properties file.
# Forge remains a standalone Gradle build. Groovy, Jackson, Spock, Ant,
# Objenesis, and other coordinates managed by grails-bom /
# grails-gradle-bom come from the parent build. Keep Forge-only pins here.

title=Grails Application Forge
projectDesc=Generates Grails applications

antlr4Version=4.8-1!!
commonsCompressVersion=1.28.0
gradleSdkvendorPluginVersion=3.0.0
javaDiffUtils=4.15
nohttpGradleVersion=0.0.11
reflectionsVersion=0.10.2
rockerVersion=2.2.1
shadowVersion=8.3.11
spotlessVersion=6.25.0
testcontainersVersion=1.20.4
typesafeConfigVersion=1.4.3

# custom checkstyle configuration for forge
grails.codestyle.dir.checkstyle=config/checkstyle

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx5G
