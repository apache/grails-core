# Project version is defined in the root gradle.properties file. Forge is a separate Gradle build that
# consumes the framework it is built with by coordinates (includeBuild substitution), so every version
# the framework manages comes from grails-bom; only Forge-specific pins live here. The pins build-logic
# needs as well (shadow) live in the root gradle.properties.
title=Grails Application Forge
projectDesc=Generates Grails applications
commonsCompressVersion=1.28.0
gradleSdkvendorPluginVersion=3.0.0
javaDiffUtils=4.15
reflectionsVersion=0.10.2
testcontainersVersion=1.20.4
typesafeConfigVersion=1.4.3

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx5G
# Bound the dependency-analysis jar cache; see the root gradle.properties for the measured basis.
systemProp.dependency.analysis.cache.max=200
