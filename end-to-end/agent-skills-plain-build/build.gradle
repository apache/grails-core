// A build without the Grails Gradle plugin - the root of a multi-project build whose Grails
// applications are subprojects, for example - gets the Grails agent skills the way the user guide's
// Agent Skills section describes: it applies the SkillsJars Gradle plugin and names the Grails BOM on
// the skill configuration itself, since nothing applies the BOM for it. agent-skills checks what it
// extracts.
plugins {
    id 'com.skillsjars.gradle-plugin' version '0.1.0'
}

dependencies {
    skill platform("org.apache.grails:grails-bom:${projectVersion}")
    skill 'org.apache.grails.skills:grails-developer'
    skill 'org.apache.grails.skills:grails-8-upgrade'
}

// As in agent-skills: this project's own directory, not the grails-core repository's .agents/skills
skillsjars {
    outputDir = layout.projectDirectory.dir('.agents/skills')
}
