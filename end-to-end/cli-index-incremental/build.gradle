plugins {
    id 'groovy'
    id 'org.apache.grails.buildsrc.properties'
}

dependencies {
    testImplementation platform("org.apache.grails:grails-bom:${projectVersion}")
    testImplementation 'org.apache.grails:grails-core-cli'
    testImplementation 'org.spockframework:spock-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'grails.e2e.repo', rootProject.file('../build/local-maven').toURI()
    systemProperty 'grails.e2e.version', projectVersion
    systemProperty 'grails.e2e.gradlew', rootProject.file('../gradlew').absolutePath
    systemProperty 'grails.e2e.repositories', rootProject.file('../gradle/plugin-repositories.gradle').absolutePath
    systemProperty 'grails.e2e.offline', gradle.startParameter.offline
}
