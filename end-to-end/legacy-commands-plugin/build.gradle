plugins {
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.vulnerability-scan'
    id 'org.apache.grails.gradle.grails-plugin'
}

version = '0.0.1'
group = 'legacy.commands.plugin'

dependencies {
    implementation platform("org.apache.grails:grails-bom:$projectVersion")

    // This fixture recompiles legacy command sources against Grails 8's grails-core-cli-legacy to
    // validate discovery, adapter, registry, and runner wiring end-to-end. It does not
    // re-validate a pre-compiled Grails 7 binary's Groovy-trait ABI. That relies on Groovy's
    // stable trait encoding across 4->5 and could be strengthened later with a prebuilt Grails 7
    // fixture jar.
    compileOnly 'org.apache.grails:grails-core-cli-legacy'
}

apply {
    from rootProject.layout.projectDirectory.file('../gradle/grails-extension-gradle-config.gradle')
}
