// Set DO_NOT_CACHE_TESTS=1 to force test tasks to re-run on every invocation without needing
// --rerun-tasks. Useful for repeatedly running the same test command while chasing flaky tests
// across runs. The core build, grails-gradle and grails-forge all honour the same variable.
def doNotCacheTests = System.getenv('DO_NOT_CACHE_TESTS')?.toBoolean()

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // Honor DO_NOT_CACHE_TESTS=1 so developers can repeatedly invoke the same test command
    // without --rerun-tasks (and without recompiling everything else). It matters more in this
    // build than in the core one: republishing grails-core does not change these projects'
    // inputs in any way Gradle can see, so re-running against freshly published artifacts is
    // exactly the case that otherwise comes back UP-TO-DATE or FROM-CACHE.
    outputs.cacheIf { !doNotCacheTests }
    outputs.upToDateWhen { !doNotCacheTests }
}
