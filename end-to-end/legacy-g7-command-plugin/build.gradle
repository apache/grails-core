// Standalone build compiled against published Grails 7 / Groovy 4, producing a real precompiled
// Grails 7 ApplicationCommand binary for legacy-commands to consume instead of recompiling the
// sources under Grails 8.
//
// This is deliberately not part of the end-to-end build and is not composed with includeBuild:
// substitution would rewrite org.apache.grails:grails-core to this repo's Groovy 5 project, which
// is exactly what the fixture exists to avoid.
//
// It builds under the JDK declared in .sdkmanrc (17, the minimum for a Grails 7 app) rather than a
// Gradle toolchain, so the surrounding builds never inherit a second JDK requirement. Run it with
// `sdk env` from this directory, or see .github/workflows/end-to-end.yml for how CI provisions it.
plugins {
    id 'java-library'
    id 'groovy'
}

group = 'legacy.g7.commands'
version = '0.0.1'

repositories {
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform('org.apache.grails:grails-bom:7.0.14')
    implementation 'org.apache.groovy:groovy'
    compileOnly 'org.apache.grails:grails-core'
}

def resolvedCompileVersion = { String group, String name ->
    def component = configurations.compileClasspath.incoming.resolutionResult.allComponents.find {
        it.moduleVersion?.group == group && it.moduleVersion?.name == name
    }
    if (component == null) {
        throw new GradleException("Could not resolve ${group}:${name} for the legacy command fixture")
    }
    component.moduleVersion.version
}

def grailsCompileVersion = providers.provider {
    resolvedCompileVersion('org.apache.grails', 'grails-core')
}
def groovyCompileVersion = providers.provider {
    resolvedCompileVersion('org.apache.groovy', 'groovy')
}

// With no toolchain or release set (deliberate - see above), the JVM running Gradle is what
// determines the class-file version, so record it for the CI verify step to assert against.
def buildJdkSpec = providers.systemProperty('java.specification.version')

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property('grailsCompileVersion', grailsCompileVersion)
    inputs.property('groovyCompileVersion', groovyCompileVersion)
    inputs.property('buildJdkSpec', buildJdkSpec)
    doFirst {
        manifest.attributes(
                'Grails-Legacy-Command-Fixture': 'true',
                'Grails-Compile-Version': grailsCompileVersion.get(),
                'Groovy-Compile-Version': groovyCompileVersion.get(),
                'Build-Jdk-Spec': buildJdkSpec.get()
        )
    }
}
