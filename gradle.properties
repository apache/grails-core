# Do NOT turn on due to https://github.com/gradle/gradle/issues/9489
#org.gradle.configureondemand=true
# This -Xmx sizes the Gradle DAEMON only. Test forks are separate child JVMs and get their
# own heap from maxHeapSize in gradle/test-config.gradle (768m on CI, 1024m locally), so a
# rough lower bound on a job's configured heap is:
#
#     daemon -Xmx  +  (concurrent test forks x per-fork maxHeapSize)
#
# "Concurrent test forks" is NOT maxParallelForks. With org.gradle.parallel=true several
# Test tasks run at once, so the live fork count is bounded by Gradle's global worker pool
# (--max-workers, defaulting to the CPU count).
#
# This is a simplified CONFIGURED-HEAP budget, not a true peak: it excludes metaspace and
# other native memory, the Gradle client, and forked Java/Groovy compiler workers (which
# CompilePlugin gives their own -Xmx2G). Treat it as a floor when sizing a runner.
#
# Documentation does NOT run on this heap. Every groovydoc task is launched as a JVM of its
# own by GroovydocEnhancerPlugin, and the user guide in a worker process by PublishGuideTask.
# That is what lets this number be 3G: before, groovydoc kept a Groovy runtime per documented
# module alive inside the daemon for the whole build, which needed 5G and still exhausted it
# on the smallest runner.
#
# 3G is measured, not guessed. The macOS job's own command - `build
# :grails-shell-cli:installDist groovydoc --continue -PonlyCoreTests -PskipCodeStyle
# --max-workers=2 -PmaxTestParallel=2` - with 123 groovydoc tasks, both aggregates, the guide
# and 108 test tasks all executing in one daemon runs with ZERO full GCs; mixed collections
# settle it at about 1.7 GB. Re-measure with -Xlog:gc* before changing it, and read the MIXED
# collections: a young-only "after GC" figure does not touch the old generation and reads
# about 700 MB higher than the truth. Note that deleting doc outputs is not enough to make
# them re-run - org.gradle.caching restores them, so pass --no-build-cache too.
# Raising this on a memory-constrained runner can backfire - a larger heap lets G1 defer
# collection, so the daemon's resident size grows to meet it and leaves the forked doc JVMs
# and test forks less room, not more.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx3G

# Those doc JVMs size themselves: groovydoc gets 1g per module, raised to 3g by grails-doc
# and 2g by grails-data-docs/stage for their aggregates; the guide runs on PublishGuideTask's
# own 1500m default. To get a documentation run that will not fit moving without editing a
# build script, pass -PgroovydocMaxHeapSize=<size> or -PguideMaxHeapSize=<size>; either beats
# the build script.
