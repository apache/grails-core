name: "Gradle cache policy"
description: >-
  Decides whether the setup-gradle step that follows may save the Gradle User Home to the GitHub Actions
  cache. Every setup-gradle step takes its cache-read-only value from this action, so the policy lives here
  and nowhere else; see the "Gradle caching" section of AGENTS.md for the reasons behind it.
inputs:
  cache-writer:
    description: >-
      'true' only for the core build matrix entry that writes the cache for its OS (cache_writer in that
      matrix). Every other job leaves it unset and only restores entries.
    required: false
    default: 'false'
outputs:
  read-only:
    description: "'false' when the job saves the Gradle User Home, 'true' when it only restores it"
    value: ${{ steps.decide.outputs.read-only }}
runs:
  using: composite
  steps:
    - id: decide
      shell: bash
      # A cache writer saves only on a push or dispatch, only on a branch whose major version is at least the
      # default branch's, and, for Windows and macOS, only on that major's first branch (x.0.x). A run restores
      # entries from its own branch and the default branch only, so older majors' entries would serve nobody
      # else. The rule is relative to the default branch, so promoting a new default branch needs no change:
      # older majors simply stop writing. Anything unexpected leaves the cache read-only.
      env:
        EVENT_NAME: ${{ github.event_name }}
        CACHE_WRITER: ${{ inputs.cache-writer }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        branch_major="${GITHUB_REF_NAME%%.*}"
        default_major="${DEFAULT_BRANCH%%.*}"
        read_only=true
        if [[ "$EVENT_NAME" != pull_request && "$CACHE_WRITER" == true ]] \
            && [[ "$branch_major" =~ ^[0-9]+$ && "$default_major" =~ ^[0-9]+$ ]] \
            && (( branch_major >= default_major )) \
            && [[ "$RUNNER_OS" == Linux || "$GITHUB_REF_NAME" == *.0.x ]]; then
          read_only=false
        fi
        echo "read-only=$read_only" >> "$GITHUB_OUTPUT"
        echo "Gradle cache read-only: $read_only (branch $GITHUB_REF_NAME, default branch $DEFAULT_BRANCH, $RUNNER_OS)"
