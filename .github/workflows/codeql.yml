# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches:
      - '[4-9]+.[0-9]+.x'
      - '8.0.x-hibernate7.*'
  pull_request:
    # ready_for_review is not a default type: a draft runs nothing until it is ready or labelled "run ci".
    types: [ opened, synchronize, reopened, ready_for_review ]
    # The branches below must be a subset of the branches above
    branches:
      - '[4-9]+.[0-9]+.x'
      - '8.0.x-hibernate7.*'
# queue jobs and only allow 1 run per branch due to the likelihood of hitting GitHub resource limits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # A pull request labelled "no ci", or a draft without the "run ci" label, skips every job of this workflow.
  analyze:
    name: Analyze
    if: >-
      github.event_name != 'pull_request'
      || (!contains(github.event.pull_request.labels.*.name, 'no ci')
          && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run ci')))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
    - name: "☕️ Setup JDK"
      uses: actions/setup-java@v6.1.0
      with:
        distribution: liberica
        java-version: 21
    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: ${{ matrix.language }}
        # The autobuild action runs `./gradlew testClasses`, which compiles Groovy sample apps that are covered by regular CI.
        build-mode: none
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
