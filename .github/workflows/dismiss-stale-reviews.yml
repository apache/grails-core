# An approval says nothing about the commits pushed after it, but GitHub keeps showing it unless the branch requires
# pull requests, which the release branches do not: build changes and merges between them are pushed directly. This
# workflow dismisses the approvals of a pull request that were given to another commit than its head. GitHub moves an
# approval to the new head by itself after a push that leaves the diff of the pull request as it was, such as a rebase
# or a merge of the base branch, so those approvals are kept.
#
# GitHub does not move an approval over a merge of the base branch that had conflicts, since resolving them changes
# the diff of the pull request. Such an update merge is not a change of the pull request to review again, so the
# approval is kept as well, as long as every commit pushed after it is a merge of the base branch that differs from
# the merge git makes by itself only inside the conflicts git could not merge, and resolves each of them as a whole:
# one side, the other, or both. Any other resolution is a change like any other. The pull request then gets a comment
# naming the files whose conflicts were resolved, once for each merge, since nobody reviewed the resolution. A merge
# that changes any other line, or that merges anything but the base branch, dismisses the approval like any other
# push, and so does a walk over the merges that cannot finish, because a request fails or the walk takes more than
# its two minutes. How many merges follow the approval does not matter.
#
# A pull_request run from a fork gets a read-only token that cannot dismiss a review, so this workflow does not react
# to the pull request. It reacts to the Code Style workflow being requested for one, which a push to a pull request
# does, even for a draft or a pull request labelled "no ci", whose jobs are then skipped. A workflow_run run uses the
# workflow file of the default branch and a token of this repository, and it never checks out or runs anything of the
# pull request: it reads commit ids through the API and, to repeat a merge, fetches the history of its commits and
# merges them in a bare repository, which runs no hook and no filter.
#
# Not every push requests the Code Style workflow: GitHub starts no pull_request workflow for a commit whose message
# asks to skip them ("[skip ci]" and its variants), nor for a pull request that conflicts with its base branch. So
# the workflow also looks at every open pull request once an hour, which bounds how long an approval can outlive
# such a push. A manual run looks at every open pull request too, and only reports what it would dismiss unless its
# dry-run input is cleared.
name: "Dismiss Stale Reviews"
on:
  workflow_run:
    workflows: [ "Code Style" ]
    types: [ requested ]
  schedule:
    - cron: '17 * * * *' # hourly, for the pushes that request no Code Style run
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only report the approvals that would be dismissed'
        type: boolean
        default: true
permissions:
  contents: read
  pull-requests: write
jobs:
  dismiss:
    name: "Dismiss Stale Reviews"
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: "🧹 Dismiss the approvals given to earlier changes"
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Empty on a scheduled and on a manual run, which look at every open pull request.
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A check of the merges after an approval has two minutes, and all of them together have seven, which
          # leaves the job three for the rest before its timeout. Each git and gh command a check runs gets what is
          # left: a request or a fetch left to hang, or one pull request with a long run of merges, would otherwise
          # end the job at its timeout, and with it the dismissals of every pull request after that one, on each run.
          export GIT_LITERAL_PATHSPECS=1
          checks_end=$(( SECONDS + 420 ))
          bounded() {
            local left=$(( deadline - SECONDS ))
            (( left > 0 )) || return 124
            timeout "$left" "$@"
          }
          # Fetches the commits named with their history, but without trees or file contents, which git fetches
          # when a merge needs them. A failed fetch is tried once more after a pause, as long as the check has time
          # left: an approval kept this way is checked again on every hourly run, and one passing error should not
          # dismiss it.
          fetched() {
            bounded git -C merges.git fetch --quiet --filter=tree:0 origin "$@" && return
            (( deadline - SECONDS > 5 )) || return 124
            sleep 5
            bounded git -C merges.git fetch --quiet --filter=tree:0 origin "$@"
          }
          # Whether a merge commit changed a conflicted file only inside its conflicts, and resolved each of them as
          # a whole. The file git merges by itself holds each conflict between markers labelled with the two
          # parents, and the pushed file has to be that file with every line outside the conflicts as git wrote it
          # and each conflict replaced by what git offers for one: the lines of the pull request's side, those of
          # the base branch's side, or both sides one after the other, in either order. Conflict markers left in the
          # file are no resolution. The pushed file is matched against those choices line by line from the start, so the answer does
          # not depend on how a diff would line the two files up; lines are compared with their line ends, and the
          # end of the file has to end, or not, with a newline as the choice that ends it does. Lines picked from
          # the sides, repeated, reordered or written by hand are a change nobody reviewed, even when each line
          # looks like one of a side. Answers 1 when the file is not such a resolution, also for a conflict git
          # writes without markers, such as one of a binary file or of a file deleted on one side, and when the
          # mode differs; and 2 when a command fails or runs out of time.
          resolved_within_conflicts() {
            local tree=$1 commit=$2 path=$3 first=$4 second=$5 size=$6 ours=$7 theirs=$8 entry pushed
            entry=$(bounded git -C merges.git ls-tree --format='%(objectmode) %(objecttype)' "$tree" -- "$path") || return 2
            [[ "$entry" == 100*' blob' ]] || return 1
            pushed=$(bounded git -C merges.git ls-tree --format='%(objectmode) %(objecttype)' "$commit" -- "$path") || return 2
            [[ "$pushed" == "$entry" ]] || return 1
            [[ -n "$ours" && -n "$theirs" ]] || return 1
            bounded git -C merges.git cat-file blob "$tree:$path" > conflicted.file || return 2
            bounded git -C merges.git cat-file blob "$commit:$path" > resolved.file || return 2
            bounded git -C merges.git cat-file blob "$ours" > ours.file || return 2
            bounded git -C merges.git cat-file blob "$theirs" > theirs.file || return 2
            # Whether a file ends with a newline: its last byte is one.
            ends() { [[ "$(tail -c 1 "$1" | od -An -tx1 | tr -d ' ')" == 0a ]] && echo 1 || echo 0; }
            bounded awk -v size="$size" -v first="$first" -v second="$second" -v merged_nl="$(ends conflicted.file)" \
              -v resolved_nl="$(ends resolved.file)" -v ours_nl="$(ends ours.file)" -v theirs_nl="$(ends theirs.file)" '
              # c repeated n times, by doubling, so that a long marker takes no time to build.
              function run(c, n,   s) { s = c; while (2 * length(s) <= n) s = s s; return s substr(s, 1, n - length(s)) }
              # Whether the pushed lines from p on are the merged lines from a to b.
              function same(p, a, b,   j) {
                if (p - 1 + (b - a + 1) > lines) return 0
                for (j = a; j <= b; j++) if (resolved[p + j - a] != merged[j]) return 0
                return 1
              }
              FILENAME == ARGV[1] { merged[FNR] = $0; total = FNR; next }
              { resolved[FNR] = $0; lines = FNR }
              END {
                opening = run("<", size) " " first; closing = run(">", size) " " second; separator = run("=", size)
                for (j = 1; j <= total; j++) {
                  line = merged[j]; sub(/\r$/, "", line)
                  if (line == opening || index(line, opening ":") == 1) { if (start) exit 1; start = j; seps = 0; at = 0 }
                  else if (start && line == separator) { seps++; at = j }
                  else if (line == closing || index(line, closing ":") == 1) {
                    if (!start) exit 1
                    if (seps != 1) exit 1
                    conflicts++; open[conflicts] = start; shut[conflicts] = j; split_at[conflicts] = at; start = 0
                  }
                }
                if (start || !conflicts) exit 1
                # Every place in the pushed file the lines matched so far can end at, with the choice that ended it.
                reach[1] = "file"; done_to = 0
                for (k = 1; k <= conflicts; k++) {
                  delete next_reach
                  for (p in reach) {
                    if (!same(p + 0, done_to + 1, open[k] - 1)) continue
                    q = p + open[k] - 1 - done_to
                    o = split_at[k] - open[k] - 1; t = shut[k] - split_at[k] - 1
                    if (same(q, open[k] + 1, split_at[k] - 1)) next_reach[q + o] = next_reach[q + o] " ours"
                    if (same(q, split_at[k] + 1, shut[k] - 1)) next_reach[q + t] = next_reach[q + t] " theirs"
                    if (same(q, open[k] + 1, split_at[k] - 1) && same(q + o, split_at[k] + 1, shut[k] - 1)) next_reach[q + o + t] = next_reach[q + o + t] " theirs"
                    if (same(q, split_at[k] + 1, shut[k] - 1) && same(q + t, open[k] + 1, split_at[k] - 1)) next_reach[q + o + t] = next_reach[q + o + t] " ours"
                  }
                  delete reach; for (p in next_reach) reach[p] = next_reach[p]; done_to = shut[k]
                }
                for (p in reach) {
                  if (!same(p + 0, done_to + 1, total) || p - 1 + total - done_to != lines) continue
                  # The newline at the end is that of the merged file, unless the last conflict ends the file: then
                  # it is that of the side the resolution ends with, as git takes it from that side.
                  if (lines == 0) exit 0
                  if (done_to < total) { if (resolved_nl == merged_nl) exit 0; continue }
                  if (index(reach[p], "ours") && resolved_nl == ours_nl) exit 0
                  if (index(reach[p], "theirs") && resolved_nl == theirs_nl) exit 0
                }
                exit 1
              }' conflicted.file resolved.file
            case $? in 0) return 0 ;; 1) return 1 ;; *) return 2 ;; esac
          }
          # Whether every commit from the approved one to the head is a merge of the base branch that changes nothing
          # by hand outside the conflicts git could not merge. Each commit on the way has to have two parents, the
          # second one a commit of the base branch, and its tree is compared with the one git merges from those
          # parents: the files that differ have to be conflicted ones, resolved as described above. The head and
          # the base branch are fetched with their history, so that git finds the merge bases of each merge as a
          # merge of its own would, also when there are more than one, and answers from the history whether a
          # commit is on the base branch; it fetches the trees and the contents of the files a merge needs only when
          # it merges. Paths are read as git writes them with -z, unquoted, so that any name can be looked up. Sets
          # the reason of a dismissal, and lists the files whose conflicts were resolved by hand, one line with the
          # merge and the file each. A commit that is not such a merge answers no, and so does anything that keeps
          # the check from finishing: a fetch that fails twice, or a command that fails or runs out of time. The
          # number of merges is not limited, only the time: GitHub does not move an approval kept this way, so each
          # hourly run walks its merges again, and the time limit is what bounds that cost.
          only_merges_base() {
            local base=$1 approved=$2 commit=$3 deadline=$(( SECONDS + 120 )) parents first second other tree record path size longest status blob run
            local -A conflicted=() ours=() theirs=()
            (( deadline <= checks_end )) || deadline=$checks_end
            accepted=
            reason="the commits after this approval could not be checked"
            fetched "$commit" "$base" || return 1
            while [[ "$commit" != "$approved" ]]; do
              parents=$(bounded git -C merges.git rev-list --parents -n 1 "$commit") || return 1
              read -r _ first second other <<< "$parents"
              [[ -n "$first" ]] || return 1
              [[ -n "$second" && -z "$other" ]] || { reason="the pull request changed after this approval"; return 1; }
              bounded git -C merges.git merge-base --is-ancestor "$second" "$base"
              case $? in
                0) ;;
                1) reason="the pull request changed after this approval"; return 1 ;;
                *) return 1 ;;
              esac
              # git's markers are seven characters long, and a side may hold a line just like one, such as the seven
              # equal signs that underline a heading. The merge is made once to learn the conflicted files and the
              # two sides git took each from (stages 2 and 3), and when a side has a line that starts with seven or
              # more <, = or >, once more with markers one longer than the longest such run, given for that merge
              # alone, so that what lies between the markers can be told apart from them.
              size=7
              rm -f marker.attributes || return 1
              while :; do
                bounded git -C merges.git -c merge.conflictStyle=merge -c core.attributesFile="$PWD/marker.attributes" \
                  merge-tree --write-tree -z --no-messages "$first" "$second" > merged.z
                status=$?
                (( status <= 1 )) || return 1
                conflicted=() ours=() theirs=() tree=
                while IFS= read -r -d '' record; do
                  [[ -n "$tree" ]] || { tree=$record; continue; }
                  [[ -n "$record" ]] || break
                  path=${record#*$'\t'}
                  conflicted[$path]=1
                  case ${record%%$'\t'*} in
                    *' 2') ours[$path]=$(cut -d ' ' -f 2 <<< "${record%%$'\t'*}") ;;
                    *' 3') theirs[$path]=$(cut -d ' ' -f 2 <<< "${record%%$'\t'*}") ;;
                  esac
                done < merged.z
                [[ -n "$tree" ]] || return 1
                (( size == 7 )) || break
                longest=0
                for path in "${!conflicted[@]}"; do
                  for blob in ${ours[$path]:-} ${theirs[$path]:-}; do
                    run=$(set -o pipefail; bounded git -C merges.git cat-file blob "$blob" | bounded awk '
                      { sub(/\r$/, ""); if (match($0, /^(<+|=+|>+)/) && RLENGTH > longest) longest = RLENGTH }
                      END { print longest + 0 }') || return 1
                    (( run <= longest )) || longest=$run
                  done
                done
                (( longest >= 7 )) || break
                size=$(( longest + 1 ))
                printf '* conflict-marker-size=%d\n' "$size" > marker.attributes || return 1
              done
              rm -f marker.attributes || return 1
              bounded git -C merges.git diff --name-only -z --no-renames "$tree" "$commit^{tree}" > changed.z || return 1
              # A conflicted file the merge left as git wrote it still holds the conflict markers when git wrote
              # them, which is no resolution. A conflict git writes without markers, such as one of a binary file,
              # holds one side there, which may be kept.
              for path in "${!conflicted[@]}"; do
                grep -qzxF -- "$path" changed.z && continue
                blob=$(bounded git -C merges.git ls-tree --format='%(objecttype) %(objectname)' "$tree" -- "$path") || return 1
                [[ "$blob" == 'blob '* ]] || continue
                bounded git -C merges.git cat-file blob "${blob#blob }" > conflicted.file || return 1
                bounded awk -v size="$size" -v first="$first" '
                  BEGIN { opening = "<"; while (2 * length(opening) <= size) opening = opening opening
                    opening = opening substr(opening, 1, size - length(opening)) " " first }
                  { sub(/\r$/, "") }
                  $0 == opening || index($0, opening ":") == 1 { found = 1; exit }
                  END { exit found ? 3 : 0 }' conflicted.file
                case $? in
                  0) ;;
                  3) reason="the pull request changed after this approval"; return 1 ;;
                  *) return 1 ;;
                esac
              done
              while IFS= read -r -d '' path; do
                [[ -n "${conflicted[$path]+set}" ]] || { reason="the pull request changed after this approval"; return 1; }
                resolved_within_conflicts "$tree" "$commit" "$path" "$first" "$second" "$size" "${ours[$path]:-}" "${theirs[$path]:-}" || {
                  (( $? == 1 )) && reason="the pull request changed after this approval"
                  return 1
                }
                # One line per file: a newline in a name is written as \n, so that the list keeps one file a line.
                path=${path//\\/\\\\}
                accepted+="$commit ${path//$'\n'/\\n}"$'\n'
              done < changed.z
              commit=$first
            done
          }
          # The answer of only_merges_base, worked out once per run for the same approved commit, head and base
          # branch, such as for two approvals given to the same commit.
          declare -A answers=() reasons=() resolutions=()
          checked_merges() {
            local key="$1 $2 $3"
            if [[ -z "${answers[$key]+set}" ]]; then
              only_merges_base "$@" < /dev/null
              answers[$key]=$? reasons[$key]=$reason resolutions[$key]=$accepted
            fi
            reason=${reasons[$key]} accepted=${resolutions[$key]}
            return "${answers[$key]}"
          }
          # Whether an approval whose commit has the very tree of the head was given at the same place on the base
          # branch: whether the approved commit and the head have the same merge bases with it. The same files then
          # make the same changes, as after a reworded commit or a rebase onto the same commit. When the head has
          # taken in commits of the base branch that the approved commit had not, through a merge or a rebase, the
          # same files undo what those commits changed, which is a change of the pull request, so the approval goes
          # to the check of the merges instead. The answer is worked out once per run for the same commits.
          declare -A forks=()
          same_fork() {
            local base=$1 approved=$2 head=$3 key="$1 $2 $3" deadline=$(( SECONDS + 120 )) before after
            (( deadline <= checks_end )) || deadline=$checks_end
            if [[ -z "${forks[$key]+set}" ]]; then
              forks[$key]=1
              if fetched "$approved" "$head" "$base" < /dev/null \
                && before=$(bounded git -C merges.git merge-base --all "$approved" "$base" | sort) \
                && after=$(bounded git -C merges.git merge-base --all "$head" "$base" | sort) \
                && [[ -n "$before" && "$before" == "$after" ]]; then
                forks[$key]=0
              fi
            fi
            return "${forks[$key]}"
          }
          # A conflict resolution that keeps an approval was not reviewed, so the pull request says which files each
          # merge resolved, once for each merge: every comment of this workflow names its merges in a hidden marker,
          # and the markers are read once per pull request and run, before the first comment.
          declare -A noted=()
          note_resolutions() {
            local number=$1 merges merge sha path files body
            [[ -n "$accepted" && "$DRY_RUN" != true ]] || return 0
            if [[ -z "${noted[$number]+set}" ]]; then
              noted[$number]=$(timeout 60 gh api --paginate "repos/$REPO/issues/$number/comments" \
                --jq '.[] | select(.user.login == "github-actions[bot]") | .body | scan("<!-- kept-resolution:([0-9a-f]{40}) -->") | .[0]') || {
                unset "noted[$number]"
                return 1
              }
            fi
            merges=$(cut -d ' ' -f 1 <<< "$accepted" | awk 'NF && !seen[$0]++' | grep -vxF -f <(printf '%s\n' "${noted[$number]}")) || return 0
            body="An approval of this pull request was kept across merges of the base branch whose conflicts were resolved by hand. Each resolution changes the files below only inside the conflicts git could not merge, and nobody has reviewed it yet."$'\n'
            for merge in $merges; do
              files=
              while read -r sha path; do
                [[ "$sha" == "$merge" ]] && files+="${files:+, }\`${path//\`/}\`"
              done <<< "$accepted"
              body+=$'\n'"- $merge: $files <!-- kept-resolution:$merge -->"
            done
            timeout 60 gh api "repos/$REPO/issues/$number/comments" -f body="$body" > /dev/null || return 1
            noted[$number]+=$'\n'"$merges"
          }
          git init --quiet --bare merges.git
          # Every fetch adds a pack, and once there are enough of them git would start a gc in the background, which
          # holds the lock of the shallow commits that the next fetch has to take, and that fetch would then fail.
          git -C merges.git config gc.auto 0
          git -C merges.git config maintenance.auto false
          git -C merges.git remote add origin "$GITHUB_SERVER_URL/$REPO"
          git -C merges.git config "http.$GITHUB_SERVER_URL/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # The approvals given to another commit than the head, of every open pull request or of the ones whose head
          # is the pushed commit. A review dismissed earlier is no longer an approval. GitHub has already moved an
          # approval to the head when the push left the diff of the pull request as it was, so an approval still at
          # another commit was given to other changes. Only two of those are kept: an approval whose commit has the
          # very tree of the head, which holds the content, the name and the mode of every file, at the same place on
          # the base branch (see same_fork), and an approval that only merges of the base branch separate from the
          # head (see only_merges_base). Every other one is dismissed, also when a tree is unknown. One query serves
          # a hundred pull requests, so that the hourly run does not spend a request of the token's rate limit on each.
          gh api graphql --paginate -f owner="${REPO%/*}" -f name="${REPO#*/}" -f query='
            query($owner: String!, $name: String!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequests(states: OPEN, first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    number headRefOid
                    baseRef { target { oid } }
                    commits(last: 1) { nodes { commit { oid tree { oid } } } }
                    reviews(states: APPROVED, first: 100) { nodes { databaseId author { login } commit { oid tree { oid } } } }
                  }
                }
              }
            }' --jq '.data.repository.pullRequests.nodes[] | select(env.SHA == "" or .headRefOid == env.SHA) | . as $pull
              | ([.commits.nodes[].commit | select(.oid == $pull.headRefOid) | .tree.oid][0] // "-") as $tree
              | .reviews.nodes[] | select(.commit.oid != $pull.headRefOid)
              | [$pull.number, $pull.headRefOid, .databaseId, .author.login // "ghost", .commit.oid // "-",
                  (if $tree != "-" and .commit.tree.oid == $tree then "same" else "changed" end),
                  $pull.baseRef.target.oid // "-"] | @tsv' > stale.tsv
          while IFS=$'\t' read -r number head review login commit tree base; do
            reason="the pull request changed after this approval" accepted=
            if [[ "$tree" == same && "$base" != - ]] && same_fork "$base" "$commit" "$head"; then
              echo "#$number: approval of $login at ${commit:0:10} kept, ${head:0:10} has the same files"
            elif [[ "$commit" != - && "$base" != - ]] && checked_merges "$base" "$commit" "$head"; then
              echo "#$number: approval of $login at ${commit:0:10} kept, ${head:0:10} only merges the base branch$(
                awk 'NF { files[$1] = files[$1] sep[$1] $2; sep[$1] = ", "; if (!($1 in seen)) order[++n] = $1; seen[$1] }
                  END { for (i = 1; i <= n; i++) printf "%s %s resolved %s", (i == 1 ? ";" : ","), substr(order[i], 1, 10), files[order[i]] }' <<< "$accepted")" | tee -a "$GITHUB_STEP_SUMMARY"
              note_resolutions "$number" || echo "::warning title=Resolution not noted::Could not comment on pull request #$number about the conflicts resolved after an approval"
            elif [[ "$DRY_RUN" == true ]]; then
              echo "#$number: approval of $login at ${commit:0:10} would be dismissed, $reason, the head is ${head:0:10}" | tee -a "$GITHUB_STEP_SUMMARY"
            elif gh api -X PUT "repos/$REPO/pulls/$number/reviews/$review/dismissals" -f event=DISMISS \
              -f message="Dismissed automatically: $reason, from ${commit:0:10} to ${head:0:10}." > /dev/null; then
              echo "#$number: approval of $login at ${commit:0:10} dismissed, $reason, the head is ${head:0:10}" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              # Another run may have dismissed it first, which is the outcome wanted anyway.
              echo "::warning title=Review not dismissed::Could not dismiss review $review of $login on pull request #$number"
            fi
          done < stale.tsv
