name: "CI"
on:
  push:
    branches:
      - '[0-9]+.[0-9]+.x'
  pull_request:
    # ready_for_review is not a default type: a draft runs nothing until it is ready or labelled "run ci".
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
    inputs:
      run-tests:
        description: "Run the test jobs where the branch rule would skip them (a release branch below the default); a [skip tests] head commit still skips them"
        type: boolean
        default: false
# A new commit on the same pull request or branch cancels the build and test jobs of the run in flight: their
# results would be for a superseded commit, and the run that replaces it publishes the newer one. The publish
# jobs (publishGradle, publish, publishForge, verifyWrapper, docs) run on always() with explicit result checks
# instead, so a publish that has started completes: an interrupted upload would leave the snapshot repository
# with modules from two commits. publishGradle waits for every build job (buildGradle, buildForge and
# validateDependencies), so nothing of the cancelled commit is published when the cancel arrives before the
# builds have finished. A later cancel lets the publish jobs whose needs have already succeeded or been skipped
# run: on a run without tests that is the whole chain, and on a run whose tests are still running only
# publishGradle, because a cancelled test job fails the explicit checks of publish and of everything after it.
# A cancel after every test has passed lets the whole chain run as well. The replacing run is pending until the
# cancelled run has finished every job, so two publishes of the same branch never overlap, and it then publishes
# the newer commit over whatever the cancelled run published. A normal cancel does not stop a running always()
# job either; the CI policy section of AGENTS.md says how to force one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: "CI policy"
    # A pull request labelled "no ci", or a draft without the "run ci" label, skips this job; every other
    # job needs it, so nothing runs for such a pull request.
    if: >-
      github.event_name != 'pull_request'
      || (!contains(github.event.pull_request.labels.*.name, 'no ci')
          && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run ci')))
    uses: ./.github/workflows/ci-policy.yml
  validateDependencies:
    name: 'Validate Dependency Versions'
    needs: [ policy ]
    runs-on: ubuntu-22.04
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.1.0
        with:
          distribution: liberica
          java-version: 21
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Validate grails-core dependency versions"
        run: >
          ./gradlew validateDependencyVersions
          --continue
          --stacktrace
      - name: "🔍 Validate grails-core production classpath"
        run: >
          ./gradlew validateProductionClasspath
          --continue
          --stacktrace
      - name: "🔍 Validate grails-gradle dependency versions"
        working-directory: 'grails-gradle'
        run: >
          ./gradlew validateDependencyVersions
          --continue
          --stacktrace
  validateBomProperties:
    name: 'Validate BOM Properties'
    needs: [ policy ]
    runs-on: ubuntu-24.04
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.1.0
        with:
          distribution: liberica
          java-version: 21
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Validate grails-core BOM properties"
        run: >
          ./gradlew validateBomProperties
          --continue
          --stacktrace
      - name: "🔍 Validate grails-gradle BOM properties"
        working-directory: 'grails-gradle'
        run: >
          ./gradlew validateBomProperties
          --continue
          --stacktrace
  validateGithubBranch:
    name: 'Validate githubBranch'
    needs: [ policy ]
    runs-on: ubuntu-24.04
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "🔍 Verify githubBranch names the maintenance branch"
        # The documentation links every page to its source on githubBranch, and a release fails unless githubBranch names
        # the branch it targets, so a maintenance branch must set it to itself from the moment it is created. A pull
        # request is checked against the branch it merges into. GitHub expressions have no regular expressions, so the
        # step skips any branch that is not named X.Y.x.
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          if [[ ! "${BRANCH}" =~ ^[0-9]+\.[0-9]+\.x$ ]]; then
            echo "Skipping, ${BRANCH} is not a maintenance branch"
            exit 0
          fi
          githubBranch=$(sed -n 's/^githubBranch=//p' gradle.properties)
          if [[ "${githubBranch}" != "${BRANCH}" ]]; then
            echo "❌ githubBranch in gradle.properties is '${githubBranch}', not ${BRANCH}." >&2
            exit 1
          fi
          echo "✅ gradle.properties sets githubBranch=${BRANCH}"
  buildGradle:
    name: 'Build Gradle Plugins'
    needs: [ policy ]
    strategy:
      fail-fast: false
      matrix:
        java: [ 21, 25 ]
    runs-on: ubuntu-22.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.1.0
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@89edf53f781ac41833b4bc74d0e19a5315c79c67 # v1.10.0
      - name: "🔨 Build project without tests"
        if: ${{ needs.policy.outputs.run-tests != 'true' }}
        working-directory: 'grails-gradle'
        run: >
          ./gradlew build
          --continue
          --stacktrace
          -PskipCodeStyle
          -PskipTests
      - name: "🔨 Build project with tests"
        if: ${{ needs.policy.outputs.run-tests == 'true' }}
        working-directory: 'grails-gradle'
        run: >
          ./gradlew build
          --continue
          --stacktrace
          --rerun-tasks
          -PskipCodeStyle
  buildLogic:
    # The build logic is an included build: the root build uses its plugins but never runs its tests
    name: 'Build Logic'
    needs: [ policy ]
    runs-on: ubuntu-24.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.1.0
        with:
          distribution: liberica
          java-version: 21
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@89edf53f781ac41833b4bc74d0e19a5315c79c67 # v1.10.0
      - name: "🔨 Build and test the build logic"
        if: ${{ needs.policy.outputs.run-tests == 'true' }}
        working-directory: 'build-logic'
        run: >
          ./gradlew check
          --continue
          --stacktrace
  build:
    name: 'Build Grails-Core (${{ matrix.job_name }})'
    needs: [ policy ]
    if: ${{ needs.policy.outputs.run-tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            java: 21
            job_name: Ubuntu JDK 21
            cache_writer: true
            gradle_task: 'build :grails-shell-cli:installDist groovydoc'
          - os: ubuntu-22.04
            java: 25
            job_name: Ubuntu JDK 25
            gradle_task: 'build :grails-shell-cli:installDist groovydoc'
          - os: macos-latest
            java: 21
            job_name: macOS JDK 21
            cache_writer: true
            gradle_task: 'build :grails-shell-cli:installDist groovydoc'
            # The macOS runner has ~7 GB of RAM and 3 CPUs, against ~16 GB and 4 CPUs on the
            # Linux and Windows runners, so it has the least room for concurrent JVMs.
            # Capping only maxTestParallel would not help: that is a per-Test-task limit, and
            # with org.gradle.parallel=true several projects' test tasks run at once, so the
            # number of live forks is bounded by Gradle's global worker pool - which defaults
            # to the 3 CPUs here. --max-workers is therefore the setting that actually limits
            # concurrent test, compiler and groovydoc JVMs; maxTestParallel is kept alongside
            # it so no single task exceeds that cap either.
            runner_arguments: '--max-workers=2 -PmaxTestParallel=2'
          - os: windows-latest
            java: 25
            job_name: Windows JDK 25 shard 0
            cache_writer: true
            gradle_task: 'build :grails-shell-cli:installDist groovydoc'
            shard_arguments: '-PtestShardCount=3 -PtestShardIndex=0'
          - os: windows-latest
            java: 25
            job_name: Windows JDK 25 shard 1
            gradle_task: testShard
            shard_arguments: '-PtestShardCount=3 -PtestShardIndex=1'
          - os: windows-latest
            java: 25
            job_name: Windows JDK 25 shard 2
            gradle_task: testShard
            shard_arguments: '-PtestShardCount=3 -PtestShardIndex=2'
    runs-on: ${{ matrix.os }}
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.1.0
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
        with:
          cache-writer: ${{ matrix.cache_writer }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@89edf53f781ac41833b4bc74d0e19a5315c79c67 # v1.10.0
      - name: "🔨 Build project"
        # build-logic is an included build, so the specs of its vulnerability-scan plugin are run through the root build.
        run: >
          ./gradlew ${{ matrix.gradle_task }} :build-logic-root:vulnerability-scan:check
          --continue
          --stacktrace
          -PonlyCoreTests
          -PskipCodeStyle
          ${{ matrix.shard_arguments }}
          ${{ matrix.runner_arguments }}
  buildRerunTasks:
    name: 'Build Grails-Core Rerunning all Tasks (${{ matrix.job_name }})'
    needs: [ policy ]
    if: ${{ needs.policy.outputs.run-tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            java: 21
            job_name: Ubuntu JDK 21 build
            gradle_task: 'build :grails-shell-cli:installDist groovydoc'
            extra_arguments: '-PskipTests'
          - os: ubuntu-22.04
            java: 21
            job_name: Ubuntu JDK 21 shard 0
            gradle_task: testShard
            extra_arguments: '-PtestShardCount=3 -PtestShardIndex=0'
          - os: ubuntu-22.04
            java: 21
            job_name: Ubuntu JDK 21 shard 1
            gradle_task: testShard
            extra_arguments: '-PtestShardCount=3 -PtestShardIndex=1'
          - os: ubuntu-22.04
            java: 21
            job_name: Ubuntu JDK 21 shard 2
            gradle_task: testShard
            extra_arguments: '-PtestShardCount=3 -PtestShardIndex=2'
    runs-on: ${{ matrix.os }}
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.1.0
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@89edf53f781ac41833b4bc74d0e19a5315c79c67 # v1.10.0
      - name: "🔨 Build project"
        run: >
          ./gradlew ${{ matrix.gradle_task }} :build-logic-root:vulnerability-scan:check
          --continue
          --rerun-tasks
          --stacktrace
          -PonlyCoreTests
          -PskipCodeStyle
          ${{ matrix.extra_arguments }}
  buildForge:
    name: "Build Grails Forge (Java ${{ matrix.java }}, indy=${{ matrix.indy }})"
    needs: [ policy ]
    strategy:
      fail-fast: false
      matrix:
        java: [ 21, 25 ]
        indy: [ false ]
        include:
          - java: 21
            indy: true
    runs-on: ubuntu-22.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'liberica'
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@89edf53f781ac41833b4bc74d0e19a5315c79c67 # v1.10.0
      - name: "🔨 Build project without tests"
        if: ${{ needs.policy.outputs.run-tests != 'true' }}
        working-directory: 'grails-forge'
        run: >
          ./gradlew build
          --continue
          --stacktrace
          -PgrailsIndy=${{ matrix.indy }}
          -PskipCodeStyle
          -PskipTests
      - name: "🔨 Build project with tests"
        if: ${{ needs.policy.outputs.run-tests == 'true' }}
        working-directory: 'grails-forge'
        run: >
          ./gradlew build
          --continue
          --rerun-tasks
          --stacktrace
          -PgrailsIndy=${{ matrix.indy }}
          -PskipCodeStyle
      - name: "✅ Verify combined CLI"
        run: |
          cd grails-forge
          cp grails-cli/build/distributions/apache-grails-*.zip cli.zip
          unzip cli -d tmp1
          mv tmp1/apache-grails-* tmp1/cli
          ./tmp1/cli/bin/grails --version
          ./tmp1/cli/bin/grails-forge-cli --version
      - name: "📤 Upload CLI Zip to Workflow Summary Page"
        if: ${{ matrix.java == '21' && matrix.indy == false }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'apache-grails-SNAPSHOT-bin.zip'
          include-hidden-files: true
          path: grails-forge/tmp1/cli/**/*
          if-no-files-found: 'error'
  # Every test job from here through neo4jFunctional sets timeout-minutes to twice the slowest run that
  # finished on its own, passed or failed, over the 160 CI runs of 2026-09-03 to 2026-09-13, rounded up to
  # the half hour. Without a limit, a test JVM that never exits holds its job for GitHub's six-hour default.
  functional:
    name: "Functional Tests (${{ matrix.job_name }})"
    needs: [ policy ]
    if: ${{ needs.policy.outputs.run-tests == 'true' }}
    timeout-minutes: 150 # slowest run: 63 min
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 21
            indy: false
            job_name: Java 21, indy=false
            gradle_task: 'bootJar check'
            artifact_suffix: java21-indyfalse-shard0
            shard_arguments: '-PtestShardCount=2 -PtestShardIndex=0'
          - java: 21
            indy: false
            job_name: Java 21, indy=false, shard 1
            gradle_task: testShard
            artifact_suffix: java21-indyfalse-shard1
            shard_arguments: '-PtestShardCount=2 -PtestShardIndex=1'
          - java: 21
            indy: true
            job_name: Java 21, indy=true
            gradle_task: 'bootJar check'
            artifact_suffix: java21-indytrue-shard0
            shard_arguments: '-PtestShardCount=2 -PtestShardIndex=0'
          - java: 21
            indy: true
            job_name: Java 21, indy=true, shard 1
            gradle_task: testShard
            artifact_suffix: java21-indytrue-shard1
            shard_arguments: '-PtestShardCount=2 -PtestShardIndex=1'
          - java: 25
            indy: false
            job_name: Java 25, indy=false
            gradle_task: 'bootJar check'
            artifact_suffix: java25-indyfalse-shard0
            shard_arguments: '-PtestShardCount=2 -PtestShardIndex=0'
          - java: 25
            indy: false
            job_name: Java 25, indy=false, shard 1
            gradle_task: testShard
            artifact_suffix: java25-indyfalse-shard1
            shard_arguments: '-PtestShardCount=2 -PtestShardIndex=1'
    runs-on: ubuntu-22.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.1.0
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@89edf53f781ac41833b4bc74d0e19a5315c79c67 # v1.10.0
      - name: "🏃 Run Functional Tests"
        run: >
          ./gradlew ${{ matrix.gradle_task }}
          --continue
          --rerun-tasks
          --stacktrace
          -PgrailsIndy=${{ matrix.indy }}
          -PonlyFunctionalTests
          -PskipCodeStyle
          -PskipHibernate5Tests
          -PskipHibernate7Tests
          -PskipMongodbTests
          -PskipNeo4jTests
          -PskipSpringSecurityTests
          -PskipRedisTests
          ${{ matrix.shard_arguments }}
      - name: "📤 Upload Geb Reports"
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: geb-reports-functional-${{ matrix.artifact_suffix }}
          path: '**/build/geb-reports/'
          if-no-files-found: ignore
  security:
    name: "Spring Security Tests (${{ matrix.job_name }})"
    needs: [ policy ]
    if: ${{ needs.policy.outputs.run-tests == 'true' }}
    timeout-minutes: 150 # slowest run: 71 min
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 21
            job_name: Java 21
            gradle_task: 'bootJar check'
          - java: 25
            job_name: Java 25
            gradle_task: 'bootJar check'
            shard_arguments: '-PtestShardCount=2 -PtestShardIndex=0'
          - java: 25
            job_name: Java 25, shard 1
            gradle_task: testShard
            shard_arguments: '-PtestShardCount=2 -PtestShardIndex=1'
    runs-on: ubuntu-22.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.1.0
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
