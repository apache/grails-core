    # explicitly because the implicit success() check also covers the skipped test jobs upstream, which would
    # skip this job on a build-only run, and because a cancelled test job must not be published: the core of a
    # commit whose tests were cancelled never reaches the snapshot repository, although its Gradle plugins may.
    # Every test job of this workflow belongs in these needs.
    if: >-
      ${{ always() &&
          github.repository_owner == 'apache' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          needs.publishGradle.result == 'success' &&
