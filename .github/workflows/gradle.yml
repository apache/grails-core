name: "CI"
on:
  push:
    branches:
      - '[0-9]+.[0-9]+.x'
  pull_request:
    # ready_for_review is not a default type: a draft runs nothing until it is ready or labelled "run ci".
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
    inputs:
      run-tests:
        description: "Run the test jobs where the branch rule would skip them (a release branch below the default); a [skip tests] head commit still skips them"
        type: boolean
        default: false
# A new commit on the same pull request or branch cancels the build and test jobs of the run in flight: their
# results would be for a superseded commit, and the run that replaces it publishes the newer one. The publish
# jobs (publishGradle, publish, publishForge, verifyWrapper, docs) run on always() with explicit result checks
# instead, so a publish that has started completes: an interrupted upload would leave the snapshot repository
# with modules from two commits. publishGradle waits for every build job (buildGradle, buildForge and
# validateDependencies), so nothing of the cancelled commit is published when the cancel arrives before the
# builds have finished. A later cancel lets the publish jobs whose needs have already succeeded or been skipped
# run: on a run without tests that is the whole chain, and on a run whose tests are still running only
# publishGradle, because a cancelled test job fails the explicit checks of publish and of everything after it.
# A cancel after every test has passed lets the whole chain run as well. The replacing run is pending until the
# cancelled run has finished every job, so two publishes of the same branch never overlap, and it then publishes
# the newer commit over whatever the cancelled run published. A normal cancel does not stop a running always()
# job either; the CI policy section of AGENTS.md says how to force one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: "CI policy"
    # A pull request labelled "no ci", or a draft without the "run ci" label, skips this job; every other
    # job needs it, so nothing runs for such a pull request.
    if: >-
      github.event_name != 'pull_request'
      || (!contains(github.event.pull_request.labels.*.name, 'no ci')
          && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run ci')))
    uses: ./.github/workflows/ci-policy.yml
  validateDependencies:
    name: 'Validate Dependency Versions'
    needs: [ policy ]
    runs-on: ubuntu-22.04
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: 17
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Validate grails-core dependency versions"
        run: >
          ./gradlew validateDependencyVersions
          --continue
          --stacktrace
      - name: "🔍 Validate grails-gradle dependency versions"
        working-directory: 'grails-gradle'
        run: >
          ./gradlew validateDependencyVersions
          --continue
          --stacktrace
  buildGradle:
    name: 'Build Gradle Plugins'
    needs: [ policy ]
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 25 ]
    runs-on: ubuntu-22.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@d96a555133c275a00949d2cc77b70fe9a4242ebf # v1.9.2
      - name: "🔨 Build project without tests"
        if: ${{ needs.policy.outputs.run-tests != 'true' }}
        working-directory: 'grails-gradle'
        run: >
          ./gradlew build
          --continue
          --stacktrace
          -PskipCodeStyle
          -PskipTests
      - name: "🔨 Build project with tests"
        if: ${{ needs.policy.outputs.run-tests == 'true' }}
        working-directory: 'grails-gradle'
        run: >
          ./gradlew build
          --continue
          --stacktrace
          --rerun-tasks
          -PskipCodeStyle
  build:
    needs: [ policy ]
    if: ${{ needs.policy.outputs.run-tests == 'true' }}
    name: 'Build Grails-Core'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            java: 17
            cache_writer: true
          - os: ubuntu-22.04
            java: 21
          - os: ubuntu-22.04
            java: 25
          - os: macos-latest
            java: 21
            cache_writer: true
          - os: windows-latest
            java: 25
            cache_writer: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
        with:
          cache-writer: ${{ matrix.cache_writer }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@d96a555133c275a00949d2cc77b70fe9a4242ebf # v1.9.2
      - name: "🔨 Build project"
        # build-logic is an included build, so the specs of its vulnerability-scan plugin are run through the root build.
        run: >
          ./gradlew build :grails-shell-cli:installDist groovydoc :build-logic-root:vulnerability-scan:check
          --continue
          --stacktrace
          -PonlyCoreTests
          -PskipCodeStyle
  buildRerunTasks:
    needs: [ policy ]
    if: ${{ needs.policy.outputs.run-tests == 'true' }}
    name: 'Build Grails-Core Rerunning all Tasks'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            java: 17
    runs-on: ${{ matrix.os }}
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@d96a555133c275a00949d2cc77b70fe9a4242ebf # v1.9.2
      - name: "🔨 Build project"
        run: >
          ./gradlew build :grails-shell-cli:installDist groovydoc :build-logic-root:vulnerability-scan:check
          --continue
          --rerun-tasks
          --stacktrace
          -PonlyCoreTests
          -PskipCodeStyle
  buildForge:
    name: "Build Grails Forge"
    needs: [ policy ]
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]
    runs-on: ubuntu-22.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'liberica'
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@d96a555133c275a00949d2cc77b70fe9a4242ebf # v1.9.2
      - name: "🔨 Build project without tests"
        if: ${{ needs.policy.outputs.run-tests != 'true' }}
        working-directory: 'grails-forge'
        run: >
          ./gradlew build
          --continue
          --stacktrace
          -PskipCodeStyle
          -PskipTests
      - name: "🔨 Build project with tests"
        if: ${{ needs.policy.outputs.run-tests == 'true' }}
        working-directory: 'grails-forge'
        run: >
          ./gradlew build
          --continue
          --rerun-tasks
          --stacktrace
          -PskipCodeStyle
      - name: "✅ Verify combined CLI"
        run: |
          cd grails-forge
          cp grails-cli/build/distributions/apache-grails-*.zip cli.zip
          unzip cli -d tmp1
          mv tmp1/apache-grails-* tmp1/cli
          ./tmp1/cli/bin/grails --version
          ./tmp1/cli/bin/grails-forge-cli --version
      - name: "📤 Upload CLI Zip to Workflow Summary Page"
        if: ${{ matrix.java == '17' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'apache-grails-SNAPSHOT-bin.zip'
          include-hidden-files: true
          path: grails-forge/tmp1/cli/**/*
          if-no-files-found: 'error'
  functional:
    name: "Functional Tests"
    needs: [ policy ]
    if: ${{ needs.policy.outputs.run-tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21, 25 ]
    runs-on: ubuntu-22.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@d96a555133c275a00949d2cc77b70fe9a4242ebf # v1.9.2
      - name: "🏃 Run Functional Tests"
        run: >
          ./gradlew bootJar check
          --continue
          --rerun-tasks
          --stacktrace
          -PonlyFunctionalTests
          -PskipCodeStyle
          -PskipHibernate5Tests
          -PskipMongodbTests
          -PskipSpringSecurityTests
          -PskipRedisTests
      - name: "📤 Upload Geb Reports"
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: geb-reports-functional-java${{ matrix.java }}
          path: '**/build/geb-reports/'
          if-no-files-found: ignore
  security:
    name: "Spring Security Tests"
    needs: [ policy ]
    if: ${{ needs.policy.outputs.run-tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21, 25 ]
    runs-on: ubuntu-22.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@d96a555133c275a00949d2cc77b70fe9a4242ebf # v1.9.2
      - name: "🏃 Run Functional Tests"
        run: >
          ./gradlew bootJar check
          --continue
          --rerun-tasks
          --stacktrace
          -PonlySpringSecurityTests
          -PskipCodeStyle
  securityConfig:
    name: "Spring Security Config Functional Tests"
    needs: [ policy ]
    if: ${{ needs.policy.outputs.run-tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Each value boots the core functional-test-app with a different Spring Security configuration.
        # The specs are gated with @IgnoreIf({ System.getProperty('TESTCONFIG') != '<config>' }), so a
        # config only runs when TESTCONFIG matches. TESTCONFIG is applied at app startup, so every config
        # must be its own run. Carried over from the standalone grails-spring-security CI — do not drop
        # configs (add, don't remove) when the app's security configurations change.
        test-config: [ 'static', 'annotation', 'requestmap', 'basic', 'basicCacheUsers', 'misc', 'putWithParams', 'bcrypt', 'issue503' ]
    runs-on: ubuntu-22.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: 17
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@d96a555133c275a00949d2cc77b70fe9a4242ebf # v1.9.2
      - name: "🏃 Run Spring Security Functional Tests (TESTCONFIG=${{ matrix.test-config }})"
        run: >
          ./gradlew
          :grails-test-examples-spring-security-core-functional-test-app:check
          --continue
          --rerun-tasks
          --stacktrace
          -DTESTCONFIG=${{ matrix.test-config }}
          -PskipCodeStyle
  redis:
    name: "Redis Tests"
    needs: [ policy ]
    if: ${{ needs.policy.outputs.run-tests == 'true' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21, 25 ]
        redis-version: [ '7.4', '8.0' ] # Redis container version exercised via Testcontainers
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@d96a555133c275a00949d2cc77b70fe9a4242ebf # v1.9.2
      - name: "🏃 Run Redis Tests"
        run: >
          ./gradlew bootJar check
          --continue
          --rerun-tasks
          --stacktrace
          -PonlyRedisTests
          -PredisContainerVersion=${{ matrix.redis-version }}
          -PskipCodeStyle
  mongodbFunctional:
    needs: [ policy ]
    if: ${{ needs.policy.outputs.run-tests == 'true' }}
    name: "Mongodb Functional Tests"
    # ubuntu-22.04 while https://github.com/actions/runner-images/issues/15005 is open: the ubuntu-24.04 image 20261018.339
    # ships kernel 7.0.0-1017-azure, which MongoDB 8.0 reads as 7.0.0 and refuses to start on (it exits on 6.19.0 through
    # 7.0.13), so every mongo:8.0 container of the MongoDB 8.0 lane dies before "waiting for connections". The ubuntu-22.04
    # image runs kernel 6.8. Move back to ubuntu-24.04 once the issue is resolved or mongo:8.0 is 8.0.35 or newer.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 25 ]
        mongodb-version: [ '7.0', '8.0' ] # test with supported versions https://www.mongodb.com/legal/support-policy/lifecycles
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout the repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🏃 Run Functional Tests"
        env:
          GITHUB_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew bootJar check
          --continue
          --rerun-tasks
          --stacktrace
          -PonlyMongodbTests
          -PmongodbContainerVersion=${{ matrix.mongodb-version }}
          -PskipCodeStyle
  hibernate5Functional:
    needs: [ policy ]
    if: ${{ needs.policy.outputs.run-tests == 'true' }}
    name: "Hibernate5 Functional Tests"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 25 ]
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout the repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🏃 Run Functional Tests"
        env:
          GITHUB_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew bootJar check
          --continue
          --rerun-tasks
          --stacktrace
          -PonlyHibernate5Tests
          -PskipCodeStyle
  publishGradle:
    # always() with explicit result checks, see the concurrency comment at the top. It waits for every build job,
    # not only buildGradle, so that a run cancelled before its builds have finished publishes nothing, and a
    # commit whose Forge build or dependency validation failed is not published.
    if: >-
      ${{ always() &&
          github.repository_owner == 'apache' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          needs.buildGradle.result == 'success' &&
          needs.buildForge.result == 'success' &&
          needs.validateDependencies.result == 'success'
      }}
    needs: [ buildGradle, buildForge, validateDependencies ]
    runs-on: ubuntu-22.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: 17
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@d96a555133c275a00949d2cc77b70fe9a4242ebf # v1.9.2
      - name: "📤 Publish Gradle Snapshot Artifacts"
        env:
          GRAILS_PUBLISH_RELEASE: 'false'
          MAVEN_PUBLISH_URL: ${{ secrets.GRAILS_NEXUS_PUBLISH_SNAPSHOT_URL }}
          MAVEN_PUBLISH_USERNAME: ${{ secrets.NEXUS_USER }}
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.NEXUS_PW  }}
        working-directory: 'grails-gradle'
        run: >
          ./gradlew publish aggregateChecksums aggregatePublishedArtifacts
          --no-build-cache
          --rerun-tasks
      - name: "📤 Upload grails-gradle checksums"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: grails-gradle-checksums
          path: grails-gradle/build/grails-gradle-checksums.txt
      - name: "📤 Upload grails-gradle published artifacts"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: grails-gradle-artifacts.txt
          path: grails-gradle/build/grails-gradle-artifacts.txt
  publish:
    needs: [ publishGradle, build, buildRerunTasks, functional, security, securityConfig, redis, hibernate5Functional, mongodbFunctional ]
    # always() with explicit result checks, see the concurrency comment at the top. The results are checked
    # explicitly because the implicit success() check also covers the skipped test jobs upstream, which would
    # skip this job on a build-only run, and because a cancelled test job must not be published: the core of a
    # commit whose tests were cancelled never reaches the snapshot repository, although its Gradle plugins may.
    # Every test job of this workflow belongs in these needs.
    if: >-
      ${{ always() &&
          github.repository_owner == 'apache' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          needs.publishGradle.result == 'success' &&
          (needs.build.result == 'success' || needs.build.result == 'skipped') &&
          (needs.buildRerunTasks.result == 'success' || needs.buildRerunTasks.result == 'skipped') &&
          (needs.functional.result == 'success' || needs.functional.result == 'skipped') &&
          (needs.security.result == 'success' || needs.security.result == 'skipped') &&
          (needs.securityConfig.result == 'success' || needs.securityConfig.result == 'skipped') &&
          (needs.redis.result == 'success' || needs.redis.result == 'skipped') &&
          (needs.hibernate5Functional.result == 'success' || needs.hibernate5Functional.result == 'skipped') &&
          (needs.mongodbFunctional.result == 'success' || needs.mongodbFunctional.result == 'skipped')
      }}
    runs-on: ubuntu-22.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: 17
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@d96a555133c275a00949d2cc77b70fe9a4242ebf # v1.9.2
      - name: "📤 Publish Grails-Core Snapshot Artifacts"
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          GRAILS_PUBLISH_RELEASE: 'false'
          MAVEN_PUBLISH_URL: ${{ secrets.GRAILS_NEXUS_PUBLISH_SNAPSHOT_URL }}
          MAVEN_PUBLISH_USERNAME: ${{ secrets.NEXUS_USER }}
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.NEXUS_PW  }}
        with: 
          timeout_seconds: 3600 # normal range ~14-25min uncached (no tests); generous headroom for slow Nexus uploads so a single attempt is not killed mid-publish
          max_attempts: 3 # Attempts to address: Could not write to resource 'https://repository.apache.org/content/repositories/snapshots/...' Read timed out
          retry_wait_seconds: 180
          command: ./gradlew publish aggregateChecksums aggregatePublishedArtifacts --no-build-cache --rerun-tasks
      - name: "📤 Upload grails-core checksums"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: grails-core-checksums.txt
          path: build/grails-core-checksums.txt
      - name: "📤 Upload grails-core published artifacts"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: grails-core-artifacts.txt
          path: build/grails-core-artifacts.txt
      - name: "🔨 Create Grails Wrapper Distribution Zip"
        run: |
          ./gradlew :grails-wrapper:distZip
          cp grails-wrapper/build/distributions/apache-grails-wrapper-*.zip build/wrapper.zip
          cd build
          unzip wrapper -d tmp
          mv tmp/apache-grails-wrapper-* tmp/wrapper
      - name: "📤 Upload Wrapper Zip to Workflow Summary Page"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apache-grails-wrapper-SNAPSHOT-bin
          path: build/tmp/wrapper
  publishForge:
    # The implicit success() check also covers the skipped test jobs upstream of publish, which skipped this job
    # on every build-only push although its own needs had succeeded; check them explicitly, as publish does.
    # always() for the same reason as publish.
    if: >-
      ${{ always() &&
          github.repository_owner == 'apache' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          needs.buildForge.result == 'success' &&
          needs.publishGradle.result == 'success' &&
          needs.publish.result == 'success'
      }}
    needs: [ buildForge, publishGradle, publish ]
    runs-on: ubuntu-22.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: 17
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@d96a555133c275a00949d2cc77b70fe9a4242ebf # v1.9.2
      - name: "📤 Publish Gradle Snapshot Artifacts"
        env:
          GRAILS_PUBLISH_RELEASE: 'false'
          MAVEN_PUBLISH_URL: ${{ secrets.GRAILS_NEXUS_PUBLISH_SNAPSHOT_URL }}
          MAVEN_PUBLISH_USERNAME: ${{ secrets.NEXUS_USER }}
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.NEXUS_PW  }}
        working-directory: 'grails-forge'
        run: >
          ./gradlew publish aggregateChecksums aggregatePublishedArtifacts
          --no-build-cache
          --rerun-tasks
      - name: "📤 Upload grails-forge checksums"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: grails-forge-checksums
          path: grails-forge/build/grails-forge-checksums.txt
      - name: "📤 Upload grails-gradle published artifacts"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: grails-forge-artifacts.txt
          path: grails-forge/build/grails-forge-artifacts.txt
  verifyWrapper:
    name: "Verify grails-wrapper"
    # Verifies the wrapper works end-to-end. Must run after publishForge so that
    # grails-cli (which the wrapper resolves at runtime) is available in Nexus.
    # Explicit results and always() for the same reason as publishForge.
    if: >-
      ${{ always() &&
          github.repository_owner == 'apache' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          needs.publish.result == 'success' &&
          needs.publishForge.result == 'success'
      }}
    needs: [ publish, publishForge ]
    runs-on: ubuntu-22.04
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: 17
      - name: "📥 Download Wrapper"
        uses: actions/download-artifact@v8.0.1
        with:
          name: apache-grails-wrapper-SNAPSHOT-bin
          path: wrapper
      - name: "✅ Verify grails-wrapper"
        env:
          GRAILS_WRAPPER_ALLOWED_TYPES: 'SNAPSHOT'
        run: |
          # Pin the wrapper to this branch's snapshot so it doesn't resolve the
          # globally latest SNAPSHOT in the Apache repo, which may be compiled
          # for a newer Java runtime than this job's JDK.
          export PREFERRED_GRAILS_VERSION=$(grep '^projectVersion=' gradle.properties | cut -d'=' -f2)
          # actions/download-artifact does not preserve the executable bit, so
          # restore it before invoking the wrapper script (see actions/upload-artifact#38).
          chmod +x ./wrapper/grailsw
          ./wrapper/grailsw --version
  docs:
    # Explicit results and always() for the same reason as publishForge.
    if: >-
      ${{ always() &&
          github.repository_owner == 'apache' &&
          github.event_name == 'push' &&
          needs.publish.result == 'success'
      }}
    needs: [ publish ]
    runs-on: ubuntu-22.04
    steps:
      - name: "⚙️ Maximize build space"
        run: |
          echo "-- Dotnet"
          sudo rm -rf /usr/share/dotnet
          echo "-- Android"
          sudo rm -rf /usr/local/lib/android
          echo "-- Haskell"
          sudo rm -rf /opt/ghc
          echo "-- CodeQL"
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          df -h
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout the repository"
        uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
      - name: "🔀 Store current branch name"
        run: |
          TARGET_BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}"
          echo "TARGET_BRANCH=${TARGET_BRANCH}" >> $GITHUB_ENV
          echo "Target Branch: ${TARGET_BRANCH}"
      - name: "📅 Set current date as env variable"
        run: |
          NOW=$(date +'%Y-%m-%dT%H%M%S')
          echo "NOW=${NOW}" >> $GITHUB_ENV
          echo "Current date: ${NOW}"
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: liberica
          java-version: 17
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🔨 Build Snapshot Documentation"
        run: >
          ./gradlew grails-doc:build
          -PgithubBranch=${{ env.TARGET_BRANCH }}
      - name: "📤 Upload Generated Docs to Workflow Result Page"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: grails-docs-${{ env.NOW }}.zip
          path: ./build/distributions/*.zip
          compression-level: 0 # Already a zip
      - name: "🚀 Publish to Github Pages"
        if: github.event_name == 'push'
        uses: apache/grails-github-actions/deploy-github-pages@asf
        env:
          GH_TOKEN: ${{ secrets.GRAILS_GHTOKEN }}
          GRADLE_PUBLISH_RELEASE: 'false'
          SOURCE_FOLDER: grails-doc/build/docs
          TARGET_REPOSITORY: 'apache/grails-website'
          TARGET_FOLDER: 'docs'
          DOCUMENTATION_BRANCH: 'asf-site-production'
          SKIP_SNAPSHOT_FOLDER: 'true'
