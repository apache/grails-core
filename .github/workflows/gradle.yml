          # 7.0 is the oldest supported line and the one closest to its end of life: one JDK is enough for it, and
          # 8.0 and 9.0 cover Java 25.
          - java: 25
            mongodb-version: '7.0'
        include:
          - java: 21
            mongodb-version: '7.0'
            indy: true
    steps:
      - name: "Output Agent IP" # in the event RAO blocks this agent, this can be used to debug it
        run: curl -s https://api.ipify.org
      - name: "📥 Checkout the repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.1.0
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🗄️ Restore the mongod the embedded server runs"
        id: embedmongo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          # Outside the Gradle User Home that setup-gradle caches: this holds an immutable download from
          # fastdl.mongodb.org - the archive and the binary extracted out of it - and no database,
          # so it belongs to no branch and does not change when a dependency version does.
          # Keyed by the version this entry asks for, because the matrix runs more than one and a
          # single key would keep whichever job missed first and leave the other restoring 250MB
          # of a binary it cannot use. No restore-keys, for that same reason.
          path: ~/.embedmongo
          key: embedmongo-${{ runner.os }}-${{ matrix.mongodb-version }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "🏃 Run Functional Tests"
        env:
          GITHUB_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew bootJar check
          --continue
          --rerun-tasks
          --stacktrace
          -PgrailsIndy=${{ matrix.indy }}
          -PonlyMongodbTests
          -PmongodbContainerVersion=${{ matrix.mongodb-version }}
          -PskipCodeStyle
      - name: "🗄️ Save the mongod the embedded server runs"
        # The download is the same on every branch, and every branch can restore the default branch's entries,
        # so only a push to the default branch saves it; other branches and pull requests only restore it.
        if: ${{ success() && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && steps.embedmongo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.embedmongo
          key: ${{ steps.embedmongo-cache.outputs.cache-primary-key }}
