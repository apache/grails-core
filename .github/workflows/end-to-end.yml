# The end-to-end suite is its own Gradle build, so the core build never reaches it and
# `./gradlew build` at the root is unaffected.
#
# It resolves Grails from the artifacts the core build publishes rather than by project
# substitution - that is what makes the tests end-to-end. The repository is the same
# build/local-maven that grails-forge points its generated applications at, populated by
# publishAllPublicationsToTestCaseMavenRepoRepository, so the suite exercises real poms and
# module metadata including the CLI companion artifacts. That is a hard requirement for some of
# these projects rather than a nicety: spring-dependency-management imports grails-bom as a Maven
# BOM through io.spring.dependency-management, which resolves it in its own detached configuration
# and so can only ever consume a published pom.
#
# The suite runs on the JDK of the repository's root .sdkmanrc - it has to run on whatever the core
# build it consumes runs on - which the steps below read out of that file rather than relying on
# Gradle toolchain auto-detection.
#
# A second JDK, GraalVM 25.2, builds the native-i18n image at the end of the job, from the same
# published artifacts.
name: "End to End"
on:
  push:
    branches:
      - '[0-9]+.[0-9]+.x'
  pull_request:
    # ready_for_review is not a default type: a draft runs nothing until it is ready or labelled "run ci".
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
    inputs:
      run-tests:
        description: "Run the test jobs where the branch rule would skip them (a release branch below the default); a [skip tests] head commit still skips them"
        type: boolean
        default: false
# One run per branch or pull request: a new commit cancels the run in flight, whose result would be for a
# superseded commit. This workflow publishes nothing, so nothing here needs to survive the cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: "CI policy"
    # A pull request labelled "no ci", or a draft without the "run ci" label, skips this job; every other
    # job needs it, so nothing runs for such a pull request.
    if: >-
      github.event_name != 'pull_request'
      || (!contains(github.event.pull_request.labels.*.name, 'no ci')
          && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run ci')))
    uses: ./.github/workflows/ci-policy.yml
  endToEnd:
    name: "End to End Tests (end-to-end build only)"
    needs: [ policy ]
    if: ${{ needs.policy.outputs.run-tests == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "☕️ Determine the JDK from .sdkmanrc"
        # Read the pin out of the file that already declares it. Only the major is kept:
        # `sdk env` gives a developer the exact Liberica patch, but the suite is a test build
        # outside the reproducible-build surface, so CI deliberately takes the runner's current
        # release of that major rather than pinning a patch version here.
        id: jdks
        run: |
          set -euo pipefail
          build_java=$(grep -E '^java=' .sdkmanrc | cut -d= -f2)
          echo "build-java=${build_java%%.*}" >> "$GITHUB_OUTPUT"
          echo "end-to-end build JDK (from root .sdkmanrc): ${build_java}"
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6.3.0
        with:
          distribution: liberica
          java-version: ${{ steps.jdks.outputs.build-java }}
      - name: "🗄️ Decide the Gradle cache mode"
        id: gradle-cache-policy
        uses: ./.github/actions/gradle-cache-policy
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Decided by the step above; see .github/actions/gradle-cache-policy.
          cache-read-only: ${{ steps.gradle-cache-policy.outputs.read-only }}
          develocity-access-key: ${{ secrets.GRAILS_DEVELOCITY_ACCESS_KEY }}
      - name: "📦 Setup: publish grails-gradle to the local repository the tests resolve from"
        # Both builds publish into the same build/local-maven, and both are needed: the Grails BOM
        # constrains org.apache.grails.gradle artifacts. grails-forge depends on this same pair of
        # publish tasks for the applications its tests generate.
        working-directory: 'grails-gradle'
        run: ./gradlew publishAllPublicationsToTestCaseMavenRepoRepository -PskipTests --stacktrace
      - name: "📦 Setup: publish Grails to the local repository the tests resolve from"
        id: publish-grails
        run: ./gradlew publishAllPublicationsToTestCaseMavenRepoRepository -PskipTests --stacktrace
      - name: "🔍 Setup TestLens"
        uses: testlens-app/setup-testlens@89edf53f781ac41833b4bc74d0e19a5315c79c67 # v1.10.0
      - name: "🧪 Run the end-to-end tests"
        # Only the end-to-end build. grails-core's own unit and functional suites are the CI
        # workflow's job; nothing here re-runs them. The publish steps above are setup, not tests.
        working-directory: 'end-to-end'
        env:
          DO_NOT_CACHE_TESTS: '1'
        run: ./gradlew check --continue --stacktrace
      - name: "☕️ Setup GraalVM for the native image"
        # In this job rather than its own, so the image is built from the framework published above
        # instead of publishing it a second time. It runs whether or not the tests above passed, and
        # leaves JAVA_HOME alone: only the step below uses GraalVM.
        if: ${{ !cancelled() && steps.publish-grails.outcome == 'success' }}
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          distribution: graalvm-community
          # The GraalVM release, not just the JDK: a java-version alone resolves to the last release tagged
          # by JDK version, CE 25.0.2, which still cannot compile Groovy 4 or later. Releases since are
          # tagged by GraalVM version, which is what this selects.
          version: '25.2'
          java-version: '25'
          set-java-home: 'false'
          check-for-updates: 'false'
      - name: "🧪 Build and run the native-i18n image"
        # The native half of native-i18n: compile the application to a binary with no recorded
        # metadata and resolve every message bundle from it. GraalVM 25.2 or later, because GraalVM 21 and
        # the first GraalVM 25 releases cannot compile Groovy 4 or later (oracle/graal#10200); see
        # end-to-end/README.md.
        if: ${{ !cancelled() && steps.publish-grails.outcome == 'success' }}
        working-directory: 'end-to-end'
        env:
          JAVA_HOME: ${{ env.GRAALVM_HOME }}
        run: |
          set -euo pipefail
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "setup-graalvm did not set GRAALVM_HOME; refusing to build the image on another JDK" >&2
            exit 1
          fi
          ./gradlew :native-i18n:i18nCheckOnNative -PnativeTests --stacktrace
      - name: "📤 Upload test reports"
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: end-to-end-test-reports
          path: end-to-end/**/build/reports/tests/**
