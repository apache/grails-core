# Tests the step of dismiss-stale-reviews.yml whenever it, or its test, changes. That workflow runs only from the
# default branch, on events no pull request can start, so its checks are tested here instead: the test takes the
# step's script from the workflow file and runs it against small repositories, with a stand-in for gh.
name: "Dismiss Stale Reviews Test"
on:
  push:
    branches:
      - '[0-9]+.[0-9]+.x'
    paths:
      - '.github/workflows/dismiss-stale-reviews.yml'
      - '.github/workflows/dismiss-stale-reviews-test.yml'
      - '.github/scripts/test-dismiss-stale-reviews.sh'
  pull_request:
    # ready_for_review is not a default type: a draft runs nothing until it is ready or labelled "run ci".
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - '.github/workflows/dismiss-stale-reviews.yml'
      - '.github/workflows/dismiss-stale-reviews-test.yml'
      - '.github/scripts/test-dismiss-stale-reviews.sh'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # A pull request labelled "no ci", or a draft without the "run ci" label, skips every job of this workflow.
  test:
    name: "Test the dismissal of stale reviews"
    if: >-
      github.event_name != 'pull_request'
      || (!contains(github.event.pull_request.labels.*.name, 'no ci')
          && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run ci')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: "🧪 Test the dismissal of stale reviews"
        run: bash .github/scripts/test-dismiss-stale-reviews.sh
