plugins {
    id 'groovy'
    id 'java-library'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.buildsrc.vulnerability-scan'
    id 'org.apache.grails.gradle.grails-code-style'
    id 'org.apache.grails.gradle.grails-jacoco'
}

version = projectVersion
group = 'org.apache.grails.beandsl'

ext {
    pomTitle = 'Grails Bean DSL Compiler Support'
    pomDescription =
            'A Groovy AST transformation (@GrailsBeans) that compiles a bean-definition DSL into ' +
            'real Spring @Bean methods on a plain Spring Boot @AutoConfiguration class at compile time.'
}

dependencies {

    implementation platform(project(':grails-bom'))

    api 'org.apache.groovy:groovy'

    // The transformation resolves @Bean/@ConditionalOnMissingBean against these real
    // classes (not by name) so Groovy recognises them as genuine annotation types when
    // it validates AnnotationNodes added after semantic analysis has already run.
    api 'org.springframework:spring-context'
    api 'org.springframework.boot:spring-boot-autoconfigure'

    // Only needed so fixture sources compiled by the tests can genuinely extend
    // grails.plugins.Plugin; the transformation itself detects a Plugin superclass by
    // fully-qualified name, not by type, so the main sourceSet has no such dependency.
    testImplementation project(':grails-core')

    testImplementation 'org.apache.groovy:groovy-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.spockframework:spock-core'
    testRuntimeOnly 'org.slf4j:slf4j-simple'

    testCompileOnly 'org.slf4j:slf4j-nop' // Prevents warning about missing slf4j implementation during compilation
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/docs-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
}
