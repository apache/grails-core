plugins {
    id 'groovy'
    id 'java-library'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.buildsrc.vulnerability-scan'
    id 'org.apache.grails.gradle.grails-code-style'
    id 'org.apache.grails.gradle.grails-jacoco'
}

version = projectVersion
group = 'org.apache.grails'

ext {
    pomTitle = 'Grails Latency Testing Support'
    pomDescription =
            'Testing support that injects artificial latency into a running Grails application, ' +
            'so functional tests can be exercised against randomly slowed responses to surface timing bugs'
}

dependencies {

    implementation platform(project(':grails-bom'))

    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.boot:spring-boot-servlet' // FilterRegistrationBean

    implementation 'org.apache.groovy:groovy'
    implementation 'org.springframework:spring-core' // Ordered
    implementation 'org.springframework:spring-web' // OncePerRequestFilter
    implementation 'org.slf4j:slf4j-api'

    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.assertj:assertj-core' // required by the spring-boot-test context runners
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.springframework.boot:spring-boot-test'

    testRuntimeOnly 'org.slf4j:slf4j-nop' // Remove annoying warning
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/docs-config.gradle')
}
