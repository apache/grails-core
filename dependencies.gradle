// see https://github.com/dependabot/dependabot-core/issues/1618
// This file allows dependabot to update the gradle dependencies

// This file provides the 'grails-bom' dependencies, while grails-gradle/dependencies.gradle provides the 'grails-gradle-bom' dependencies
// These files are split to facilitate separation of build vs application dependencies. These are the application dependencies.
ext {
    gradleBomDependencyVersions = [
            'ant.version'                   : '1.10.17',
            'asciidoctor-gradle-jvm.version': '4.0.5',
            'asciidoctorj.version'          : '3.0.1',
            'asm.version'                   : '9.10.1',
            'asset-pipeline-gradle.version' : '5.2.0-M3',
            'commons-text.version'          : '1.15.0',
            'directory-watcher.version'     : '0.19.1',
            'gradle-groovy.version'         : '4.0.33',
            'gradle-spock.version'          : '2.4-groovy-4.0',
            'grails-publish-plugin.version' : '1.0.0-M2',
            'javaparser-core.version'       : '3.28.2',
            // Tracks the JLine version Groovy ships (groovy-groovysh), so the framework and groovysh
            // share one terminal stack - keep in step with groovy.version.
            'jline.version'                 : '3.30.16',
            'jna.version'                   : '5.19.1',
            'jquery.version'                : '4.0.0',
            'maven-model.version'           : '3.9.16',
            'objenesis.version'             : '3.6',
            'spring-boot.version'           : '4.1.1',
    ]

    // Note: the name of the dependency must be the prefix of the property name so properties in the pom are resolved correctly
    gradleBomPlatformDependencies = [
            'spring-boot-bom'  : "org.springframework.boot:spring-boot-dependencies:${gradleBomDependencyVersions['spring-boot.version']}",
            'gradle-groovy-bom': "org.apache.groovy:groovy-bom:${gradleBomDependencyVersions['gradle-groovy.version']}",
            'gradle-spock-bom' : "org.spockframework:spock-bom:${gradleBomDependencyVersions['gradle-spock.version']}",
    ]

    // Note: the name of the dependency must be the prefix of the property name so properties in the pom are resolved correctly
    gradleBomDependencies = [
            'ant'                     : "org.apache.ant:ant:${gradleBomDependencyVersions['ant.version']}",
            'ant-junit'               : "org.apache.ant:ant-junit:${gradleBomDependencyVersions['ant.version']}",
            'asciidoctor-gradle-jvm'  : "org.asciidoctor:asciidoctor-gradle-jvm:${gradleBomDependencyVersions['asciidoctor-gradle-jvm.version']}",
            'asciidoctorj'            : "org.asciidoctor:asciidoctorj:${gradleBomDependencyVersions['asciidoctorj.version']}",
            'asset-pipeline-gradle'   : "cloud.wondrify:asset-pipeline-gradle:${gradleBomDependencyVersions['asset-pipeline-gradle.version']}",
            'commons-text'            : "org.apache.commons:commons-text:${gradleBomDependencyVersions['commons-text.version']}",
            'directory-watcher'       : "io.methvin:directory-watcher:${gradleBomDependencyVersions['directory-watcher.version']}",
            'grails-publish-plugin'   : "org.apache.grails.gradle:grails-publish:${gradleBomDependencyVersions['grails-publish-plugin.version']}",
            'javaparser-core'         : "com.github.javaparser:javaparser-core:${gradleBomDependencyVersions['javaparser-core.version']}",
            'jline'                   : "org.jline:jline:${gradleBomDependencyVersions['jline.version']}",
            'jna'                     : "net.java.dev.jna:jna:${gradleBomDependencyVersions['jna.version']}",
            'objenesis'               : "org.objenesis:objenesis:${gradleBomDependencyVersions['objenesis.version']}",
            'spring-boot-cli'         : "org.springframework.boot:spring-boot-cli:${gradleBomDependencyVersions['spring-boot.version']}",
            'spring-boot-gradle'      : "org.springframework.boot:spring-boot-gradle-plugin:${gradleBomDependencyVersions['spring-boot.version']}",
            'spring-boot-loader-tools': "org.springframework.boot:spring-boot-loader-tools:${gradleBomDependencyVersions['spring-boot.version']}",
    ]

    bomDependencyVersions = [
            'asset-pipeline-bom.version'    : '5.2.0-M3',
            'cas-client-core.version'       : '4.1.1',
            'bootstrap-icons.version'       : '1.13.1',
            'bootstrap.version'             : '5.3.8',
            'checker-qual.version'          : '3.55.1',
            'commons-codec.version'         : '1.22.1',
            'geb-spock.version'             : '8.0.1',
            // Pinned deliberately as a drift tripwire even though it matches Spring Boot's
            // managed version: graphql-java-extended-scalars (below) is NOT managed by Spring
            // Boot and must be upgraded in lockstep with graphql-java. Keeping this pin makes
            // the dependency validator flag any Spring Boot graphql-java bump so we re-check
            // extended-scalars compatibility. See https://github.com/apache/grails-core/issues/15674
            'graphql-java.version'          : '25.0',
            'graphql-java-extended-scalars.version': '24.0',
            'groovy.version'                : '5.1.0',
            'guava.version'                 : '33.7.1-jre',
            // Groovy YAML 5.1.0 requires a minimum of Jackson 2.22.1, and 2.22.2 also overrides the
            // 2.21.5 Spring Boot 4.1 manages: it adds the StreamReadConstraints length limit to
            // GregorianCalendar/Duration (CVE-2026-68497) and restricts the URI schemes
            // java.nio.file.Path deserialization accepts (CVE-2026-19032). Jackson 2 only releases
            // jackson-annotations on the minor, hence the separate 2.22 below.
            'jackson2.version'              : '2.22.2',
            'jackson2-annotations.version'  : '2.22',
            // Security: overrides the Jackson 3 line Spring Boot 4.1 manages (3.1.5). 3.1.6 adds the
            // StreamReadConstraints length limit to GregorianCalendar/Duration (CVE-2026-68497) and
            // restricts the URI schemes java.nio.file.Path deserialization accepts (CVE-2026-19032).
            // Stays on Spring Boot's 3.1.x line so its Jackson 3 integration keeps a supported version.
            'jackson3.version'              : '3.1.6',
            'jquery.version'                : '4.0.0',
            'kotlin.version'                : '2.2.21',
            'liquibase-hibernate5.version'  : '4.27.0',
            // Security: overrides the 1.5.38 Spring Boot 4.1 manages. 1.6.3 strips slashes from MDC
            // values before SiftingAppender uses them as discriminating keys (CVE-2026-19880). The
            // 1.6.x line keeps SLF4J 2.0.x and a JDK 11 baseline, so it is a drop-in replacement.
            'logback.version'               : '1.6.3',
            'mockito.version'               : '5.23.0',
            // Security: overrides the 5.8.1 Spring Boot 4.1 manages. 5.9.2 stopped ProxySettings
            // .toString() writing the SOCKS5 proxy credentials into the application log
            // (CVE-2026-18710); 5.10.0 is the current release of that line.
            'mongodb.version'               : '5.10.0',
            'nimbus-jose-jwt.version'       : '10.9.1',
            'pac4j.version'                 : '6.4.3',
            // Security: overrides the transitive 3.5.1. 4.0.3 fixes CVE-2025-67030 flagged against plexus-utils.
            'plexus-utils.version'          : '4.0.3',
            // Companion to plexus-utils 4.x: the org.codehaus.plexus.util.xml package (XmlStreamReader,
            // Xpp3Dom, the pull parsers) moved out of plexus-utils into plexus-xml. maven-model 3.9.x
            // still needs those classes, so any classpath where the BOM forces plexus-utils 4.x must
            // also carry plexus-xml. The 3.x line is the Maven 3-compatible one.
            'plexus-xml.version'            : '3.0.2',
            'rxjava.version'                : '1.3.8',
            'rxjava2.version'               : '2.2.21',
            'sitemesh.version'              : '2.6.0',
            'scribejava.version'            : '8.3.3',
            'spock.version'                 : '2.4-groovy-5.0',
            'starter-sitemesh.version'      : '3.3.0-RC1',
            'spring-webmvc-sitemesh.version': '3.3.0-RC1',
            // Spring Boot 4 no longer manages spring-retry; pin it here so the
            // grails-shell-cli SpringRetryCompilerAutoConfiguration's unversioned
            // reference resolves and consumer apps using @Retryable get a known version.
            'spring-retry.version'          : '2.0.13',
            // Undertow is no longer managed by spring-boot-dependencies: Spring Boot 4
            // removed its Undertow support before GA. Servlet 6.1 support ships as
            // undertow-core 2.4.x plus the io.undertow.ee servlet/websockets artifacts,
            // consumed by the vendored grails-undertow-spring-boot module.
            'undertow.version'              : '2.4.2.Final',
            'undertow-servlet.version'      : '2.0.1.Final',
            'undertow-websockets.version'   : '2.0.1.Final',
    ]

    // Note: the name of the dependency must be the prefix of the property name so properties in the pom are resolved correctly
    bomPlatformDependencies = [
            'asset-pipeline-bom': "cloud.wondrify:asset-pipeline-bom:${bomDependencyVersions['asset-pipeline-bom.version']}",
            'groovy-bom'        : "org.apache.groovy:groovy-bom:${bomDependencyVersions['groovy.version']}",
            'spock-bom'         : "org.spockframework:spock-bom:${bomDependencyVersions['spock.version']}",
    ]

    // Note: the name of the dependency must be the prefix of the property name so properties in the pom are resolved correctly
    bomDependencies = [
            'bootstrap'                : "org.webjars.npm:bootstrap:${bomDependencyVersions['bootstrap.version']}",
            'bootstrap-icons'          : "org.webjars.npm:bootstrap-icons:${bomDependencyVersions['bootstrap-icons.version']}",
            'cas-client-core'          : "org.apereo.cas.client:cas-client-core:${bomDependencyVersions['cas-client-core.version']}",
            'checker-qual'             : "org.checkerframework:checker-qual:${bomDependencyVersions['checker-qual.version']}",
            'commons-codec'            : "commons-codec:commons-codec:${bomDependencyVersions['commons-codec.version']}",
            'geb-spock'                : "org.apache.groovy.geb:geb-spock:${bomDependencyVersions['geb-spock.version']}",
            'graphql-java'             : "com.graphql-java:graphql-java:${bomDependencyVersions['graphql-java.version']}",
            'graphql-java-extended-scalars': "com.graphql-java:graphql-java-extended-scalars:${bomDependencyVersions['graphql-java-extended-scalars.version']}",
            'groovy'                   : "org.apache.groovy:groovy:${bomDependencyVersions['groovy.version']}",
            'groovy-ant'               : "org.apache.groovy:groovy-ant:${bomDependencyVersions['groovy.version']}",
            'groovy-astbuilder'        : "org.apache.groovy:groovy-astbuilder:${bomDependencyVersions['groovy.version']}",
            'groovy-cli-commons'       : "org.apache.groovy:groovy-cli-commons:${bomDependencyVersions['groovy.version']}",
            'groovy-cli-picocli'       : "org.apache.groovy:groovy-cli-picocli:${bomDependencyVersions['groovy.version']}",
            'groovy-console'           : "org.apache.groovy:groovy-console:${bomDependencyVersions['groovy.version']}",
            'groovy-contracts'         : "org.apache.groovy:groovy-contracts:${bomDependencyVersions['groovy.version']}",
            'groovy-datetime'          : "org.apache.groovy:groovy-datetime:${bomDependencyVersions['groovy.version']}",
            'groovy-dateutil'          : "org.apache.groovy:groovy-dateutil:${bomDependencyVersions['groovy.version']}",
            'groovy-docgenerator'      : "org.apache.groovy:groovy-docgenerator:${bomDependencyVersions['groovy.version']}",
            'groovy-ginq'              : "org.apache.groovy:groovy-ginq:${bomDependencyVersions['groovy.version']}",
            'groovy-groovydoc'         : "org.apache.groovy:groovy-groovydoc:${bomDependencyVersions['groovy.version']}",
            'groovy-groovysh'          : "org.apache.groovy:groovy-groovysh:${bomDependencyVersions['groovy.version']}",
            'groovy-jmx'               : "org.apache.groovy:groovy-jmx:${bomDependencyVersions['groovy.version']}",
            'groovy-json'              : "org.apache.groovy:groovy-json:${bomDependencyVersions['groovy.version']}",
            'groovy-jsr223'            : "org.apache.groovy:groovy-jsr223:${bomDependencyVersions['groovy.version']}",
            'groovy-macro'             : "org.apache.groovy:groovy-macro:${bomDependencyVersions['groovy.version']}",
            'groovy-macro-library'     : "org.apache.groovy:groovy-macro-library:${bomDependencyVersions['groovy.version']}",
            'groovy-nio'               : "org.apache.groovy:groovy-nio:${bomDependencyVersions['groovy.version']}",
            'groovy-servlet'           : "org.apache.groovy:groovy-servlet:${bomDependencyVersions['groovy.version']}",
            'groovy-sql'               : "org.apache.groovy:groovy-sql:${bomDependencyVersions['groovy.version']}",
            'groovy-swing'             : "org.apache.groovy:groovy-swing:${bomDependencyVersions['groovy.version']}",
            'groovy-templates'         : "org.apache.groovy:groovy-templates:${bomDependencyVersions['groovy.version']}",
            'groovy-test'              : "org.apache.groovy:groovy-test:${bomDependencyVersions['groovy.version']}",
            'groovy-test-junit5'       : "org.apache.groovy:groovy-test-junit5:${bomDependencyVersions['groovy.version']}",
            'groovy-testng'            : "org.apache.groovy:groovy-testng:${bomDependencyVersions['groovy.version']}",
            'groovy-toml'              : "org.apache.groovy:groovy-toml:${bomDependencyVersions['groovy.version']}",
            'groovy-typecheckers'      : "org.apache.groovy:groovy-typecheckers:${bomDependencyVersions['groovy.version']}",
            'groovy-xml'               : "org.apache.groovy:groovy-xml:${bomDependencyVersions['groovy.version']}",
            'groovy-yaml'              : "org.apache.groovy:groovy-yaml:${bomDependencyVersions['groovy.version']}",
            'guava'                       : "com.google.guava:guava:${bomDependencyVersions['guava.version']}",
            // Security override of the 2.21.5 spring-boot-dependencies imports through
            // com.fasterxml.jackson:jackson-bom - see jackson2.version
            'jackson2-annotations'     : "com.fasterxml.jackson.core:jackson-annotations:${bomDependencyVersions['jackson2-annotations.version']}",
            'jackson2-core'            : "com.fasterxml.jackson.core:jackson-core:${bomDependencyVersions['jackson2.version']}",
            'jackson2-databind'        : "com.fasterxml.jackson.core:jackson-databind:${bomDependencyVersions['jackson2.version']}",
            'jackson2-datatype-jsr310' : "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${bomDependencyVersions['jackson2.version']}",
            // Security override of the 3.1.5 spring-boot-dependencies imports through
            // tools.jackson:jackson-bom - see jackson3.version
            'jackson3-core'            : "tools.jackson.core:jackson-core:${bomDependencyVersions['jackson3.version']}",
            'jackson3-databind'        : "tools.jackson.core:jackson-databind:${bomDependencyVersions['jackson3.version']}",
            'jquery'                   : "org.webjars.npm:jquery:${bomDependencyVersions['jquery.version']}",
            // Security override of the transitive 1.5.38 - see logback.version
            'logback-classic'          : "ch.qos.logback:logback-classic:${bomDependencyVersions['logback.version']}",
            'logback-core'             : "ch.qos.logback:logback-core:${bomDependencyVersions['logback.version']}",
            // Security override of the 5.8.1 spring-boot-dependencies imports through
            // org.mongodb:mongodb-driver-bom - see mongodb.version. The whole driver family is
            // pinned so a classpath cannot end up mixing driver versions.
            'mongodb-bson'             : "org.mongodb:bson:${bomDependencyVersions['mongodb.version']}",
            'mongodb-bson-record-codec': "org.mongodb:bson-record-codec:${bomDependencyVersions['mongodb.version']}",
            'mongodb-driver-core'      : "org.mongodb:mongodb-driver-core:${bomDependencyVersions['mongodb.version']}",
            'mongodb-driver-reactivestreams': "org.mongodb:mongodb-driver-reactivestreams:${bomDependencyVersions['mongodb.version']}",
            'mongodb-driver-sync'      : "org.mongodb:mongodb-driver-sync:${bomDependencyVersions['mongodb.version']}",
            // Security override of the transitive 3.5.1 - see plexus-utils.version
            'plexus-utils'                : "org.codehaus.plexus:plexus-utils:${bomDependencyVersions['plexus-utils.version']}",
            // Required alongside plexus-utils 4.x - see plexus-xml.version
            'plexus-xml'                  : "org.codehaus.plexus:plexus-xml:${bomDependencyVersions['plexus-xml.version']}",
            'nimbus-jose-jwt'          : "com.nimbusds:nimbus-jose-jwt:${bomDependencyVersions['nimbus-jose-jwt.version']}",
            'pac4j-core'                  : "org.pac4j:pac4j-core:${bomDependencyVersions['pac4j.version']}",
            'pac4j-jakartaee'             : "org.pac4j:pac4j-jakartaee:${bomDependencyVersions['pac4j.version']}",
            'pac4j-oauth'                 : "org.pac4j:pac4j-oauth:${bomDependencyVersions['pac4j.version']}",
            'rxjava'                   : "io.reactivex:rxjava:${bomDependencyVersions['rxjava.version']}",
            'rxjava2'                  : "io.reactivex.rxjava2:rxjava:${bomDependencyVersions['rxjava2.version']}",
            'scribejava-core'             : "com.github.scribejava:scribejava-core:${bomDependencyVersions['scribejava.version']}",
            'sitemesh'                 : "opensymphony:sitemesh:${bomDependencyVersions['sitemesh.version']}",
            'spock-core'               : "org.spockframework:spock-core:${bomDependencyVersions['spock.version']}",
            'spock-spring'             : "org.spockframework:spock-spring:${bomDependencyVersions['spock.version']}",
            'spring-retry'             : "org.springframework.retry:spring-retry:${bomDependencyVersions['spring-retry.version']}",
            'starter-sitemesh'         : "org.sitemesh:spring-boot-starter-sitemesh:${bomDependencyVersions['starter-sitemesh.version']}",
            'spring-webmvc-sitemesh'   : "org.sitemesh:spring-webmvc-sitemesh:${bomDependencyVersions['spring-webmvc-sitemesh.version']}",
            // Not managed by spring-boot-dependencies - see undertow.version
            'undertow-core'            : "io.undertow:undertow-core:${bomDependencyVersions['undertow.version']}",
            'undertow-servlet'         : "io.undertow.ee:undertow-servlet:${bomDependencyVersions['undertow-servlet.version']}",
            'undertow-websockets'      : "io.undertow.ee:undertow-websockets:${bomDependencyVersions['undertow-websockets.version']}",
    ]

    // Because pom exclusions aren't properly supported by gradle, we can't inherit the grails-gradle-bom
    // this requires copying the platforms selectively to the grails-bom. Create a combined version for convenience.
    combinedPlatforms = [
            'spring-boot-bom': gradleBomPlatformDependencies['spring-boot-bom'],
    ] + bomPlatformDependencies
    combinedDependencies = gradleBomDependencies + bomDependencies
    combinedVersions = gradleBomDependencyVersions + bomDependencyVersions

    // Defaults for per-BOM overrides; populated in the if/else blocks below
    customBomVersions = [:]
    customBomDependencies = [:]

    // Liquibase / Hibernate dependency and version definitions used only for POM property name resolution
    // by PropertyNameCalculator. The actual dependency constraints are declared directly in the
    // BOM projects (grails-bom, grails-hibernate5-bom) so consumers of the hibernate5 BOM get the
    // correct versions without needing to declare them.
    if (project.name in ['grails-bom', 'grails-hibernate5-bom'] || project.name.startsWith('grails-data-hibernate5')) {
        customBomVersions = [
                'liquibase-hibernate.version': '4.27.0',
                'liquibase.version'          : '4.27.0',
                'hibernate.version'          : '5.6.15.Final',
        ]
        combinedVersions += customBomVersions
        customBomDependencies = [
                'liquibase'             : "org.liquibase:liquibase:${combinedVersions['liquibase.version']}",
                'liquibase-cdi'         : "org.liquibase:liquibase-cdi:${combinedVersions['liquibase.version']}",
                'liquibase-core'        : "org.liquibase:liquibase-core:${combinedVersions['liquibase.version']}",
                'liquibase-hibernate'   : "org.liquibase.ext:liquibase-hibernate5:${combinedVersions['liquibase-hibernate.version']}",
                'hibernate-core-jakarta': "org.hibernate:hibernate-core-jakarta:${combinedVersions['hibernate.version']}",
                'hibernate-ehcache'     : "org.hibernate:hibernate-ehcache:${combinedVersions['hibernate.version']}",
                'hibernate-envers'      : "org.hibernate:hibernate-envers:${combinedVersions['hibernate.version']}",
        ]
        combinedDependencies += customBomDependencies
    } else if (project.name in ['grails-neo4j-bom'] || project.name.startsWith('grails-data-neo4j')) {
        customBomVersions = [
                // Spring Boot's BOM manages a newer, binary-incompatible major version of the
                // driver; grails-data-neo4j-core needs this older one for its embedded
                // Neo4j 3.5.x test harness. Declared here (with 'strictly' below, like liquibase/
                // hibernate above) since a plain constraint can't out-rank a version Spring Boot's
                // platform already offers. Scoped to grails-neo4j-bom only (not the default
                // grails-bom) so consumers who don't use grails-data-neo4j keep Spring Boot's
                // managed driver version.
                'neo4j-driver.version': '4.4.13',
                // The embedded test harness matching the driver/server version above. Consumed
                // by grails-data-neo4j-core's published main sources (EmbeddedNeo4jServer,
                // Neo4jEmbeddedConnectionSource, Neo4jConnectionSourceFactory), so it needs a
                // BOM-managed version too, not just a build-internal gradle.properties entry -
                // otherwise Forge-generated applications using grails.neo4j.type=embedded fail to
                // resolve it.
                'neo4j-harness.version': '3.5.35',
        ]
        combinedVersions += customBomVersions
        customBomDependencies = [
                'neo4j-driver' : "org.neo4j.driver:neo4j-java-driver:${combinedVersions['neo4j-driver.version']}",
                'neo4j-harness': "org.neo4j.test:neo4j-harness:${combinedVersions['neo4j-harness.version']}",
        ]
        combinedDependencies += customBomDependencies
    } else if (project.name in ['grails-hibernate7-bom'] || project.name.startsWith('grails-data-hibernate7')) {
        customBomVersions = [
                'cache-ri-impl.version'         : '1.1.1',
                'derby.version'                 : '10.17.1.0',
                // Spring Boot 4.1 can select Hibernate ORM 7.4.x through Spring Dependency
                // Management, and Hibernate ORM 7.4.x requires hibernate-models 1.1.x.
                'hibernate-models.version'      : '1.1.1',
                'hibernate-tools.version'       : '7.3.8.Final',
                'hibernate.version'             : '7.4.1.Final',
                'jandex.version'                : '3.2.3',
                'liquibase-hibernate.version'   : '4.27.0',
                'liquibase-test-harness.version': '1.0.11',
                'liquibase.version'             : '4.27.0',
                'mockito-inline.version'        : '5.2.0',
        ]
        combinedVersions += customBomVersions
        customBomDependencies = [
                'cache-ri-impl'         : "org.jsr107.ri:cache-ri-impl:${combinedVersions['cache-ri-impl.version']}",
                'derby'                 : "org.apache.derby:derby:${combinedVersions['derby.version']}",
                'derbyclient'           : "org.apache.derby:derbyclient:${combinedVersions['derby.version']}",
                'derbyshared'           : "org.apache.derby:derbyshared:${combinedVersions['derby.version']}",
                'derbytools'            : "org.apache.derby:derbytools:${combinedVersions['derby.version']}",
                'hibernate-core'        : "org.hibernate.orm:hibernate-core:${combinedVersions['hibernate.version']}",
                'hibernate-envers'      : "org.hibernate.orm:hibernate-envers:${combinedVersions['hibernate.version']}",
                'hibernate-jcache'      : "org.hibernate.orm:hibernate-jcache:${combinedVersions['hibernate.version']}",
                'hibernate-models'      : "org.hibernate.models:hibernate-models:${combinedVersions['hibernate-models.version']}",
                'hibernate-tools-orm'   : "org.hibernate.tool:hibernate-tools-orm:${combinedVersions['hibernate-tools.version']}",
