            'opentelemetry-exporter-logging'                 : "io.opentelemetry:opentelemetry-exporter-logging:${bomDependencyVersions['opentelemetry.version']}",
            'opentelemetry-sdk'                              : "io.opentelemetry:opentelemetry-sdk:${bomDependencyVersions['opentelemetry.version']}",
            'opentelemetry-sdk-common'                       : "io.opentelemetry:opentelemetry-sdk-common:${bomDependencyVersions['opentelemetry.version']}",
            'opentelemetry-sdk-trace'                        : "io.opentelemetry:opentelemetry-sdk-trace:${bomDependencyVersions['opentelemetry.version']}",
            'opentelemetry-sdk-metrics'                      : "io.opentelemetry:opentelemetry-sdk-metrics:${bomDependencyVersions['opentelemetry.version']}",
            'opentelemetry-sdk-logs'                         : "io.opentelemetry:opentelemetry-sdk-logs:${bomDependencyVersions['opentelemetry.version']}",
            'opentelemetry-sdk-extension-autoconfigure-spi'  : "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:${bomDependencyVersions['opentelemetry.version']}",
            'opentelemetry-sdk-extension-autoconfigure'      : "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure:${bomDependencyVersions['opentelemetry.version']}",
            // end - pin opentelemetry to prevent bom conflicts
            'pac4j-core'                                     : "org.pac4j:pac4j-core:${bomDependencyVersions['pac4j.version']}",
            'pac4j-jakartaee'                                : "org.pac4j:pac4j-jakartaee:${bomDependencyVersions['pac4j.version']}",
            'pac4j-oauth'                                    : "org.pac4j:pac4j-oauth:${bomDependencyVersions['pac4j.version']}",
            'plexus-utils'                                   : "org.codehaus.plexus:plexus-utils:${bomDependencyVersions['plexus-utils.version']}",
            // Required alongside plexus-utils 4.x - see plexus-xml.version
            'plexus-xml'                                     : "org.codehaus.plexus:plexus-xml:${bomDependencyVersions['plexus-xml.version']}",
            // Security override of spring-boot-dependencies - see postgresql.version
            'postgresql'                                     : "org.postgresql:postgresql:${bomDependencyVersions['postgresql.version']}",
            'rxjava'                                         : "io.reactivex:rxjava:${bomDependencyVersions['rxjava.version']}",
            'rxjava2'                                        : "io.reactivex.rxjava2:rxjava:${bomDependencyVersions['rxjava2.version']}",
            'rxjava3'                                        : "io.reactivex.rxjava3:rxjava:${bomDependencyVersions['rxjava3.version']}",
            'scribejava-core'                                : "com.github.scribejava:scribejava-core:${bomDependencyVersions['scribejava.version']}",
            'sitemesh'                                       : "opensymphony:sitemesh:${bomDependencyVersions['sitemesh.version']}",
            'starter-sitemesh'                               : "org.sitemesh:spring-boot-starter-sitemesh:${bomDependencyVersions['starter-sitemesh.version']}",
            'spring-webmvc-sitemesh'                         : "org.sitemesh:spring-webmvc-sitemesh:${bomDependencyVersions['spring-webmvc-sitemesh.version']}",
            // Security override of spring-boot-dependencies - see tomcat.version
            'tomcat-annotations-api'                         : "org.apache.tomcat:tomcat-annotations-api:${bomDependencyVersions['tomcat.version']}",
            'tomcat-jdbc'                                    : "org.apache.tomcat:tomcat-jdbc:${bomDependencyVersions['tomcat.version']}",
            'tomcat-jsp-api'                                 : "org.apache.tomcat:tomcat-jsp-api:${bomDependencyVersions['tomcat.version']}",
            'tomcat-embed-core'                              : "org.apache.tomcat.embed:tomcat-embed-core:${bomDependencyVersions['tomcat.version']}",
            'tomcat-embed-el'                                : "org.apache.tomcat.embed:tomcat-embed-el:${bomDependencyVersions['tomcat.version']}",
            'tomcat-embed-jasper'                            : "org.apache.tomcat.embed:tomcat-embed-jasper:${bomDependencyVersions['tomcat.version']}",
            'tomcat-embed-websocket'                         : "org.apache.tomcat.embed:tomcat-embed-websocket:${bomDependencyVersions['tomcat.version']}",
    ]

    // Because pom exclusions aren't properly supported by gradle, we can't inherit the grails-gradle-bom
    // this requires copying the platforms selectively to the grails-bom. Create a combined version for convenience.
    combinedPlatforms = [
            'spring-boot-bom': gradleBomPlatformDependencies['spring-boot-bom'],
            'log4j2-bom'     : gradleBomPlatformDependencies['log4j2-bom'],
    ] + bomPlatformDependencies
    combinedDependencies = gradleBomDependencies + bomDependencies
    combinedVersions = gradleBomDependencyVersions + bomDependencyVersions

    // Liquibase / Hibernate dependency and version definitions used only for POM property name resolution
    // by PropertyNameCalculator. The actual dependency constraints are declared directly in the
    // BOM projects (grails-bom, grails-hibernate5-bom) so consumers of the hibernate5 BOM get the
    // correct versions without needing to declare them.
    if (project.name in ['grails-bom', 'grails-hibernate5-bom'] || project.name.startsWith('grails-data-hibernate5')) {
        customBomVersions = [
                'liquibase-hibernate.version': '4.27.0',
                'liquibase.version'          : '4.27.0',
                'hibernate.version'          : '5.6.15.Final',
        ]
        combinedVersions += customBomVersions
        customBomDependencies = [
                'liquibase'             : "org.liquibase:liquibase:${combinedVersions['liquibase.version']}",
                'liquibase-cdi'         : "org.liquibase:liquibase-cdi:${combinedVersions['liquibase.version']}",
                'liquibase-core'        : "org.liquibase:liquibase-core:${combinedVersions['liquibase.version']}",
                'liquibase-hibernate'   : "org.liquibase.ext:liquibase-hibernate5:${combinedVersions['liquibase-hibernate.version']}",
                'hibernate-core-jakarta': "org.hibernate:hibernate-core-jakarta:${combinedVersions['hibernate.version']}",
                'hibernate-ehcache'     : "org.hibernate:hibernate-ehcache:${combinedVersions['hibernate.version']}",
        ]
        combinedDependencies += customBomDependencies
    }
    // Micronaut-specific dependency overrides. These layer on top of grails-bom
    // (and transitively whatever DB BOM grails-bom carries) and only apply to the
    // grails-micronaut-bom project. Declared with `strictly` in the BOM project so
    // they win over Micronaut platform's higher versions when consumers use
    // enforcedPlatform(:grails-micronaut-bom).
    else if (project.name == 'grails-micronaut-bom') {
        customBomVersions = [
                'javaparser-core.version': '3.27.0', // micronaut requires 3.27, groovy 4 ships with 3.28 but is compatible with 3.27
                'asm.version'            : '9.11.1',
        ]
        combinedVersions += customBomVersions
        customBomDependencies = [
                'javaparser-core': "com.github.javaparser:javaparser-core:${combinedVersions['javaparser-core.version']}",
        ]
        combinedDependencies += customBomDependencies
    }
}
