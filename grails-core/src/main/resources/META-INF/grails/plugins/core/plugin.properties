# The descriptor of CoreGrailsPlugin. grails-core is compiled before the compiler that writes plugin
# descriptors, so this one is checked in; keep it in step with the class's @GrailsPluginDescriptor.
format.version=1
name=core
class=org.grails.plugins.CoreGrailsPlugin
version=@grails.version@
watchedResources=file:./grails-app/conf/spring/resources.xml,file:./grails-app/conf/spring/resources.groovy,file:./grails-app/conf/application.groovy,file:./grails-app/conf/application.yml
