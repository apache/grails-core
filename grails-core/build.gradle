plugins {
    id 'groovy'
    id 'java-library'
    id 'java-test-fixtures'
    id 'project-report'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.gradle.grails-plugin-cli'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.buildsrc.vulnerability-scan'
    id 'org.apache.grails.gradle.grails-code-style'
    id 'org.apache.grails.gradle.grails-jacoco'
}

version = projectVersion
group = 'org.apache.grails'

cliArtifact {
    automaticModuleName = 'org.apache.grails.core.cli'
    // this framework module wires its cli dependencies with project dependencies below
    defaultDependencies = false
}

dependencies {

    implementation platform(project(':grails-bom'))

    compileOnly 'org.aspectj:aspectjrt'
    compileOnly 'org.aspectj:aspectjweaver'
    api 'jakarta.inject:jakarta.inject-api'
    api 'jakarta.persistence:jakarta.persistence-api'
    api 'jakarta.annotation:jakarta.annotation-api'

    implementation 'com.github.ben-manes.caffeine:caffeine'
    api 'org.apache.groovy:groovy'
    implementation 'org.apache.groovy:groovy-json'
    api 'org.springframework.boot:spring-boot'
    api 'org.springframework.boot:spring-boot-web-server'
    api 'org.springframework:spring-core'
    api 'org.springframework:spring-tx'
    api 'org.springframework:spring-beans'
    api 'org.springframework:spring-context'
    api 'org.springframework.boot:spring-boot-autoconfigure'

    compileOnly 'org.springframework:spring-test'
    compileOnly 'org.apache.groovy:groovy-templates'

    api project(':grails-common')
    api project(':grails-bootstrap')
    api project(':grails-spring')

    api project(':grails-datastore-core')

    // the cli tier — published separately as org.apache.grails:grails-core-cli
    cliImplementation platform(project(':grails-bom'))
    cliApi project(project.path)
    // commands render through GrailsConsole, which ships as grails-bootstrap's cli companion; exposed
    // as cliApi so every module building on grails-core's cli tier inherits it
    cliApi(project(':grails-bootstrap')) {
        capabilities {
            requireCapability('org.apache.grails.bootstrap:grails-bootstrap-cli')
        }
    }
    cliImplementation 'org.apache.groovy:groovy-json'
    cliImplementation 'org.apache.groovy:groovy-templates'

    testImplementation 'org.springframework:spring-jdbc'

    testImplementation 'org.hamcrest:hamcrest'

    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'tools.jackson.core:jackson-databind'

    testImplementation 'org.apache.groovy:groovy-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.platform:junit-platform-suite'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'

    // Logging
    api 'org.slf4j:slf4j-api'
    api 'org.slf4j:jcl-over-slf4j'

    // Testing
    testImplementation 'org.spockframework:spock-core'

    testRuntimeOnly 'net.bytebuddy:byte-buddy' // Required by Spock's mocking support
    testRuntimeOnly 'org.objenesis:objenesis' // Required by Spock for mocking classes without default constructor

    testFixturesImplementation(platform(project(':grails-bom')))
    testFixturesApi 'ch.qos.logback:logback-classic' // LogCapture uses Logback types in its API
}

def writeProps = tasks.register('writeGrailsProperties', WriteProperties) {
    destinationFile = project.layout.buildDirectory.file('grails.build.properties')
    property('grails.version', project.version)
}

tasks.named('processResources', ProcessResources) {
    from(writeProps)
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/docs-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
}
