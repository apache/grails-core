plugins {
    id 'org.apache.grails.gradle.grails-violation-aggregation'
    id 'org.apache.grails.gradle.grails-ij-formatter'
    id 'org.apache.grails.gradle.grails-validate-actions'
    id 'org.apache.grails.buildsrc.test-task-sharding'
}

import java.time.Instant
import java.time.LocalDate
import java.time.ZoneOffset
import java.time.format.DateTimeFormatter

import javax.inject.Inject

import org.apache.tools.ant.taskdefs.condition.Os

ext {
    isReproducibleBuild = System.getenv("SOURCE_DATE_EPOCH") != null
    buildInstant = java.util.Optional.ofNullable(System.getenv("SOURCE_DATE_EPOCH"))
            .filter(s -> !s.isEmpty())
            .map(Long::parseLong)
            .map(Instant::ofEpochSecond)
            .orElseGet(Instant::now)
    formattedBuildDate = System.getenv("SOURCE_DATE_EPOCH") ?
            DateTimeFormatter.ISO_INSTANT.format(buildInstant) :
            DateTimeFormatter.ISO_DATE.format(LocalDate.ofInstant(buildInstant as Instant, ZoneOffset.UTC))
    buildDate = (buildInstant as Instant).atZone(ZoneOffset.UTC) // for reproducible builds
    isCiBuild = System.getenv().get('CI') as Boolean
    // Set DO_NOT_CACHE_TESTS=1 to force test tasks to re-run on every invocation without
    // needing --rerun-tasks. Useful for repeatedly running the same test command while
    // chasing flaky tests across runs.
    doNotCacheTests = System.getenv('DO_NOT_CACHE_TESTS')?.toBoolean()
    // availableProcessors() reports LOGICAL processors: SMT threads on x64, and on Apple silicon
    // every efficiency core as well as every performance core. Taking 3/4 of that therefore
    // asked for more concurrent Grails/Spring test JVMs than the machine has real capacity for
    // (each fork also holds a 1G heap, and the mongodb, redis and geb suites start a Docker
    // container per fork). Half is the conservative fraction. CI keeps its existing budget, so
    // this does not reduce CI fork counts - though CI forks do see fewer processors, below.
    configuredTestParallel = findProperty('maxTestParallel') as Integer ?:
            (isCiBuild ? 4 : Math.max(1, (Runtime.runtime.availableProcessors() / 2) as int))
    // Forked test JVMs are children of the daemon, so org.gradle.jvmargs does not limit their
    // heaps - each one claimed a flat 1G locally no matter how much memory the machine had.
    // Size them from a budget instead: physical memory, less the daemon's own heap, halved to
    // leave room for the OS, the compiler workers and the Docker containers the mongodb, redis
    // and geb suites start per fork, then split across the forks that can be alive at once.
    //
    // An explicit -PtestForkHeapMb wins everywhere, mirroring -PmaxTestParallel above, and CI
    // keeps its measured 768m. Both of those settle the value WITHOUT running the probe below,
    // so the CI path stays trivially neutral and does no fallible work.
    def resolvedTestForkHeapMb = findProperty('testForkHeapMb') as Integer
    if (resolvedTestForkHeapMb != null && resolvedTestForkHeapMb < 768) {
        // Reject rather than silently clamp: the property promises an exact value, so quietly
        // substituting a different one would be worse than refusing. Below 768 the forks that
        // GrailsGradlePlugin gives minHeapSize = 768m would start as -Xms768m -Xmx<less>, which
        // the JVM rejects outright - a confusing failure at test time instead of here.
        throw new GradleException(
                "-PtestForkHeapMb must be at least 768 (got ${resolvedTestForkHeapMb}). Grails test " +
                        'tasks are given minHeapSize = 768m, so a smaller maximum produces an ' +
                        'unstartable JVM. To use less memory overall, lower the fork count with ' +
                        '-PmaxTestParallel or --max-workers instead.')
    }
    if (resolvedTestForkHeapMb == null && isCiBuild) {
        resolvedTestForkHeapMb = 768
    }
    if (resolvedTestForkHeapMb == null) {
        // This script runs IN the daemon, so the daemon's own max heap is simply its runtime
        // value. Reading it beats parsing org.gradle.jvmargs, which may carry several -Xmx
        // options (the JVM honours the LAST) or a unit a regex would miss.
        long daemonMaxHeapMb = (Runtime.runtime.maxMemory() / (1024L * 1024L)) as long
        long totalPhysicalMemoryMb = 0L
        try {
            def operatingSystemMxBean = java.lang.management.ManagementFactory.operatingSystemMXBean
            if (operatingSystemMxBean instanceof com.sun.management.OperatingSystemMXBean) {
                totalPhysicalMemoryMb =
                        ((operatingSystemMxBean as com.sun.management.OperatingSystemMXBean).totalMemorySize / (1024L * 1024L)) as long
            }
        } catch (Exception | LinkageError ignored) {
            // A non-HotSpot JVM, a restricted management bean, or a module-access denial (which
            // surfaces as an Error, not an Exception) leaves the previous fixed default below.
        }
        // Budget against the BUILD-WIDE worker count, never a per-task fork cap. With
        // org.gradle.parallel=true several Test tasks each start forks until the shared worker
        // pool is full, so a build with four tasks capped at two forks apiece still runs up to
        // maxWorkerCount forks at once. Budgeting off the smaller number would hand every fork
        // a heap the machine cannot actually honour - the same bound, and the same reasoning,
        // as ActiveProcessorCountArgumentProvider below.
        int concurrentTestForks = Math.max(1, gradle.startParameter.maxWorkerCount)
        if (totalPhysicalMemoryMb <= 0L) {
            // The probe did not run or told us nothing, so there is no budget to compute -
            // keep the value this build used before rather than guess from a missing number.
            resolvedTestForkHeapMb = 1024
        } else {
            // A machine whose whole RAM is inside the daemon's own heap yields a non-positive
            // remainder. That is a real reading, not a failed probe, so it must NOT fall back
            // to the old 1G: give those forks the floor instead.
            long forkBudgetMb = Math.max(0L, totalPhysicalMemoryMb - daemonMaxHeapMb) / 2L
            // The floor is 768m, not something smaller, for two reasons. It is the value CI
            // already runs, so it is known to carry these suites. And GrailsGradlePlugin gives
            // every Grails Test task minHeapSize = 768m when nothing else has set one, so a
            // smaller maximum here would hand those forks -Xms768m -Xmx<less>, which the JVM
            // rejects outright before a single test runs.
            //
            // That floor wins whenever the computed share falls below it, so on a host with
            // many workers and little memory the forks together still exceed this budget. Heap
            // alone cannot fix that; the knob that has to come down there is the FORK COUNT
            // (-PmaxTestParallel, or --max-workers which bounds them build-wide). This budget
            // lowers memory pressure, it does not by itself prove a constrained machine fits.
            resolvedTestForkHeapMb = Math.min(1024, Math.max(768, (forkBudgetMb / concurrentTestForks) as int))
        }
    }
    testForkHeapMb = resolvedTestForkHeapMb
    excludeUnusedTransDeps = findProperty('excludeUnusedTransDeps')

    testProjectsStartWith = [
            'grails-test-suite',
            'grails-test-examples'
    ]
    testProjects = [ /* Will be populated by subprojects loop below */]
    docProjects = [ /* Will be populated by subprojects loop below */]
    cliProjects = [ /* Will be populated by subprojects loop below */]
    profileProjects = [ /* Will be populated by subprojects loop below */]
}

/**
 * Tells a forked test JVM how many processors it may size its GC and JIT thread pools from.
 *
 * Every forked JVM otherwise sizes those pools for the WHOLE machine, because no fork knows the
 * others exist. On a 20-processor host that is 15 ParallelGCThreads + 4 ConcGCThreads + 12
 * CICompilerCount = 31 threads per fork before a single test runs, so N concurrent forks become
 * N*31 threads competing for the same cores. Gradle cannot see this: it charges each fork one
 * worker lease, as though a fork were a single thread.
 *
 * The share is availableProcessors / maxWorkerCount, i.e. the BUILD-WIDE worker limit, because
 * that - not any one task's maxParallelForks - is what bounds how many forks can run at once.
 * With org.gradle.parallel=true, Test tasks from several projects execute concurrently, so a
 * per-task share would still oversubscribe the machine.
 *
 * Supplied as an argument provider rather than through jvmArgs because several modules assign
 * jvmArgs wholesale in their own build scripts, which would discard anything added here first.
 */
final class ActiveProcessorCountArgumentProvider implements CommandLineArgumentProvider {

    @Input
    final int processorCount

    ActiveProcessorCountArgumentProvider(int availableProcessorCount, int maxWorkerCount) {
        // Floor of 2: at ActiveProcessorCount=1 HotSpot's ergonomics select Serial GC, which
        // costs more on a 1G test heap than the contention it saves. Two keeps G1 with a
        // bounded worker count.
        //
        // That floor also means -PmaxTestParallel=1 still advertises 2 processors to the
        // single fork whenever maxWorkerCount is larger than availableProcessors/2 (the
        // usual local case: org.gradle.parallel=true with no org.gradle.workers.max).
        // It is not a "give the one fork the whole machine" switch.
        this.processorCount = Math.max(2, (availableProcessorCount / Math.max(1, maxWorkerCount)) as int)
    }

    @Override
    Iterable<String> asArguments() {
        ["-XX:ActiveProcessorCount=$processorCount".toString()]
    }
}

subprojects {

    tasks.withType(Test).configureEach { testTask ->
        testTask.jvmArgumentProviders.add(new ActiveProcessorCountArgumentProvider(
                Runtime.runtime.availableProcessors(), gradle.startParameter.maxWorkerCount))
    }

    for (String testPrefix : testProjectsStartWith) {
        if (name.startsWith(testPrefix)) {
            rootProject.ext['testProjects'] << name
        }
    }

    // Framework modules wire their cli tier with project dependencies; only the test-example
    // apps exercise the external-coordinate auto-provisioning (resolved locally through the
    // dependency substitution in gradle/functional-test-config.gradle) like real applications.
    if (!name.startsWith('grails-test-examples')) {
        ext.grailsCliAutoProvision = false
    }

    if (name.startsWith('grails-doc') || name.startsWith('grails-data-doc') || name.endsWith('-docs') || name.endsWith('-test-report')) {
        rootProject.ext['docProjects'] << name
    }

    if (name.startsWith('grails-wrapper')) {
        rootProject.ext['cliProjects'] << name
    }

    if (name.startsWith('grails-profiles')) {
        rootProject.ext['profileProjects'] << name
    }

    configurations.configureEach {
        resolutionStrategy {
            def cacheHours = isCiBuild || isReproducibleBuild ? 0 : 24
            cacheDynamicVersionsFor(cacheHours, 'hours')
            cacheChangingModulesFor(cacheHours, 'hours')
        }
    }
}

interface ExecSupport {
    @Inject ExecOperations getProcess()
}
tasks.register('publishAllToMavenLocal') {
    description = 'Publishes grails-gradle, the root build, and grails-forge to the local Maven cache (in order).'
    group = 'publishing'

    def execSupport = objects.newInstance(ExecSupport)

    doLast {
        def projectRoot = layout.projectDirectory.asFile
        def javaHome = System.getProperty('java.home')
        def gradlew = Os.isFamily(Os.FAMILY_WINDOWS) ? 'gradlew.bat' : 'gradlew'

        def runPublish = { File workingDir, String label ->
            logger.lifecycle("--- Publishing ${label} to Maven Local ---")
            execSupport.process.exec { ExecSpec exec ->
                exec.environment('JAVA_HOME', javaHome)
                exec.workingDir = workingDir
                exec.commandLine = [new File(workingDir, gradlew).absolutePath, 'publishToMavenLocal']
            }
        }

        // 1. Publish grails-gradle (provides Gradle plugins used by the main build)
        runPublish(new File(projectRoot, 'grails-gradle'), 'grails-gradle')
        // 2. Publish the root (main) build
        runPublish(projectRoot, 'root build')
        // 3. Publish grails-forge
        runPublish(new File(projectRoot, 'grails-forge'), 'grails-forge')
    }
}

apply {
    from layout.projectDirectory.file('gradle/publish-root-config.gradle')
    from layout.projectDirectory.file('gradle/rat-root-config.gradle')
}

