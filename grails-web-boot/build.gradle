plugins {
    id 'groovy'
    id 'java-library'
    id 'project-report'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.buildsrc.vulnerability-scan'
    id 'org.apache.grails.gradle.grails-code-style'
    id 'org.apache.grails.gradle.grails-jacoco'
}

version = projectVersion
group = 'org.apache.grails'

dependencies {

    implementation platform(project(':grails-bom'))

    api project(':grails-web-common')
    // Compatibility default through Grails 9, as in the web starter, for the applications forge and the profiles
    // generate, which list the Grails modules rather than the starter; optional from Grails 10.
    api project(':grails-xml')
    api 'org.apache.groovy:groovy'

    testImplementation project(':grails-controllers')

    testImplementation 'org.apache.tomcat.embed:tomcat-embed-core'
    testImplementation 'org.springframework.boot:spring-boot-tomcat'
    testRuntimeOnly project(':grails-url-mappings')

    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'org.slf4j:slf4j-nop' // Prevents warning about missing slf4j implementation during compilation

    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework:spring-test'

    testImplementation 'org.apache.groovy:groovy-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.platform:junit-platform-suite'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'

    // Logging
    api 'org.slf4j:slf4j-api'
    api 'org.slf4j:jcl-over-slf4j'

    // Testing
    testImplementation 'org.slf4j:slf4j-simple'
    testImplementation 'org.spockframework:spock-core'
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/docs-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
}

/**
 * Hands the tests the POM this module is published with, so that they can check the scope applications get its
 * dependencies in.
 */
abstract class PublishedPomArgument implements CommandLineArgumentProvider {

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getPom()

    @Override
    Iterable<String> asArguments() {
        ["-Dgrails.web.boot.pom=${pom.get().asFile.absolutePath}".toString()]
    }
}

// The publish plugin adds the task once this script has been evaluated, so it is named, at the path it writes to
def publishedPomArgument = objects.newInstance(PublishedPomArgument)
publishedPomArgument.pom.set(layout.buildDirectory.file('publications/maven/pom-default.xml'))
tasks.named('test', Test) { Test test ->
    test.dependsOn('generatePomFileForMavenPublication')
    test.jvmArgumentProviders.add(publishedPomArgument)
}