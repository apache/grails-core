plugins {
    id 'groovy'
    id 'java-library'
    id 'project-report'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.gradle.grails-code-style'
    id 'org.apache.grails.gradle.grails-gsp'
    id 'org.apache.grails.gradle.grails-plugin'
    id 'cloud.wondrify.asset-pipeline'
}

version = projectVersion
group = 'org.apache.grails'

dependencies {

    implementation platform(project(':grails-bom'))

    // Must be on the compileClasspath of consuming applications to
    // enable compilation of AbstractS2UiDomainController subclasses.
    compileOnlyApi project(':grails-converters')

    implementation project(':grails-spring-security')
    implementation project(':grails-controllers')
    implementation project(':grails-converters')
    implementation project(':grails-gsp')
    implementation project(':grails-layout')
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.security:spring-security-web'

    // 3rd party client-side assets bundled in webjars (versions managed by the BOM)
    implementation 'org.webjars.npm:bootstrap'
    implementation 'org.webjars.npm:jquery'

    compileOnly project(':grails-core') // Provided, as this is a Grails plugin
    compileOnly project(':grails-services')
    compileOnly project(':grails-domain-class')

    runtimeOnly 'cloud.wondrify:asset-pipeline-grails'

    testImplementation project(':grails-testing-support-web')
    testImplementation 'org.spockframework:spock-core'
}

// Ship the plugin views as templates (used by the s2ui-override command).
// 'copyTemplates' is registered by the grails-plugin gradle plugin in afterEvaluate,
// so it can only be configured from a later afterEvaluate block.
afterEvaluate {
    tasks.named('copyTemplates', Copy) {
        from(layout.projectDirectory.dir('grails-app/views')) {
            into('views')
        }
    }
}

assets {
    packagePlugin = true
    excludes = ['webjars/**']
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/grails-extension-gradle-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/docs-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/spring-security-test-config.gradle')
}
