plugins {
	id 'groovy'
	id 'java-library'
	id 'project-report'
	id 'org.apache.grails.buildsrc.properties'
	id 'org.apache.grails.buildsrc.dependency-validator'
	id 'org.apache.grails.buildsrc.compile'
	id 'org.apache.grails.buildsrc.publish'
	id 'org.apache.grails.buildsrc.sbom'
	id 'org.apache.grails.gradle.grails-code-style'
	id 'org.apache.grails.gradle.grails-plugin'
	id 'org.apache.grails.gradle.grails-gsp'
}

version = projectVersion
group = 'org.apache.grails'

cliArtifact {
	automaticModuleName = 'org.apache.grails.security.oauth2.cli'
	// this framework module wires the dependencies of its tools with project dependencies below
	defaultDependencies = false
}


dependencies {

	implementation platform(project(':grails-bom'))

	// the tools, which all run as a process of their own: published as the companion -cli-standalone, which is
	// compiled against the tool API and nothing of the plugin
	standaloneImplementation platform(project(':grails-bom'))
	standaloneApi(project(':grails-core')) {
		capabilities {
			requireCapability('org.apache.grails:grails-core-cli')
		}
	}
	// GrailsConsole (used by the tools) needs jline at compile time
	standaloneImplementation 'org.jline:jline'

	standaloneCompileOnly 'org.slf4j:slf4j-nop' // Prevents warning about missing slf4j implementation during compilation

	// the companion -cli, which has no tools of its own: the plugin, the tool API and the standalone tools, so that a
	// build that names it has every tool
	cliImplementation platform(project(':grails-bom'))
	cliApi project(project.path)
	cliApi(project(':grails-core')) {
		capabilities {
			requireCapability('org.apache.grails:grails-core-cli')
		}
	}
	cliApi(project(project.path)) {
		capabilities {
			requireCapability("${project.group}:${project.name}-cli-standalone")
		}
	}

    api project(':grails-spring-security'), {
		// api: GrailsUserDetailsService, SpringSecurityService
		// impl: GormUserDetailsService, GrailsUser, ReflectionUtils, @Secured(runtime), SecurityContextHolder,
		//       SpringSecurityUtils
	}
	api 'com.github.scribejava:scribejava-core', {
		// api: DefaultApi20, OAuth2AccessToken, OAuth20Service, Response
		// impl: OAuthRequest, ServiceBuilder, Verb
	}
	api project(':grails-bootstrap'), {
		// api: ConsoleLogger
		// impl: GrailsConsole, Model
	}
	api 'org.springframework.security:spring-security-core', {
		// api: AbstractAuthenticationToken, AuthenticationManager, GrantedAuthority
		// impl: AuthenticationException, UserDetails, UsernamePasswordAuthenticationToken
	}
	api project(':grails-taglib'), {
		// api: GrailsTagException
	}

	implementation 'commons-validator:commons-validator', {
		// impl: UrlValidator
	}
	implementation 'org.apache.commons:commons-lang3' // StringUtils, ExceptionUtils
	implementation 'org.jline:jline', {
		// comp: ConsoleReader
	}
	implementation project(':grails-datamapping-core'), {
		// impl: @Transactional(runtime)
	}
	implementation project(':grails-controllers'), {
		// impl: ControllerTraitInjector
	}
	implementation project(':grails-converters'), {
		// impl: JSON
	}
	implementation 'org.springframework:spring-webmvc', {
		// impl: ModelAndView
	}

	runtimeOnly project(':grails-services')

	compileOnly project(':grails-core'), { // Provided as this is a Grails plugin
		// api: GrailsApplication, GrailsApplicationCommand, GrailsAutoConfiguration, Plugin
		// impl: Holders
		// comp: @PluginSource(source)
	}
	compileOnly 'org.slf4j:slf4j-api', {
		// impl: @Slf4j(source)
	}
	compileOnly 'org.slf4j:slf4j-nop', {
		// Remove warning about missing slf4j implementation during gsp compilation
	}
	compileOnly 'org.apache.groovy:groovy' // Provided as this is a Grails plugin

	integrationTestImplementation project(':grails-testing-support-web')
	integrationTestImplementation 'org.spockframework:spock-core'

	integrationTestRuntimeOnly 'net.bytebuddy:byte-buddy'

	testCliImplementation 'org.spockframework:spock-core'
}

// the templates the tools render are in the companion of the tools as well as in the plugin: the same staged
// directory the plugin's jar has them from
sourceSets.named('standalone') { SourceSet standalone ->
    standalone.output.dir([builtBy: tasks.named('copyTemplates')], layout.buildDirectory.dir('grails/plugin-templates'))
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/grails-extension-gradle-config.gradle')
	from rootProject.layout.projectDirectory.file('gradle/docs-config.gradle')
	from rootProject.layout.projectDirectory.file('gradle/spring-security-test-config.gradle')
}
