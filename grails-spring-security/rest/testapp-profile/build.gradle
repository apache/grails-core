import javax.inject.Inject

plugins {
    id 'org.apache.grails.gradle.grails-profile'
    id 'org.apache.grails.buildsrc.sbom'
}

version = projectVersion
group = 'org.apache.grails.profiles'

ext {
    pomTitle = 'Grails Spring Security REST Test App Profile'
    pomDescription = 'A Grails profile to assist in generating various implementations of the Grails Spring Security REST plugin for testing purposes'
}

interface FileSystemSupport {
    @Inject FileSystemOperations getFs()
}

tasks.register('generateProfileConfig') {
    def fs = objects.newInstance(FileSystemSupport).fs
    File profileDir = layout.projectDirectory.asFile
    Map<String, Object> expansions = [pluginVersion: project.version, grailsVersion: findProperty('projectVersion')]
    doLast {
        fs.copy {
            from new File(profileDir, 'profile.yml.tmpl')
            into profileDir
            rename { String fileName -> fileName.replaceAll '\\.tmpl', '' }
            expand(expansions)
        }

        new File(profileDir, 'features').eachDir { feature ->
            fs.copy {
                from new File(feature, 'feature.yml.tmpl')
                into feature
                rename { String fileName -> fileName.replaceAll '\\.tmpl', '' }
                expand(expansions)
            }
        }
    }
}

dependencies {
    profileRuntimeApi project(':grails-profiles-base')
}

tasks.named('compileProfile') {
    dependsOn('generateProfileConfig')
}

// The sources jar packages the generated profile.yml, so it must be created first
tasks.named('sourcesJar') {
    dependsOn('generateProfileConfig')
}
