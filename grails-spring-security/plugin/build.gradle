plugins {
    id 'groovy'
    id 'java-library'
    id 'project-report'
    id 'java-test-fixtures'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.configuration-metadata'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.gradle.grails-code-style'
    id 'org.apache.grails.gradle.grails-gsp'
    id 'org.apache.grails.gradle.grails-plugin'
}

version = projectVersion
group = 'org.apache.grails'

cliArtifact {
    automaticModuleName = 'org.apache.grails.security.cli'
    // this framework module wires the dependencies of its tools with project dependencies below
    defaultDependencies = false
}


dependencies {

    implementation platform(project(':grails-bom'))

    // the tools that run as a process of their own (s2-create-persistent-token, s2-create-role-hierarchy-entry), and
    // the helpers s2-quickstart shares with them: published as the companion -cli-standalone, which is compiled against
    // the tool API and nothing of the plugin
    standaloneImplementation platform(project(':grails-bom'))
    standaloneApi(project(':grails-core')) {
        capabilities {
            requireCapability('org.apache.grails:grails-core-cli')
        }
    }
    // GrailsConsole (used by the tools) needs jline at compile time
    standaloneImplementation 'org.jline:jline'

    standaloneCompileOnly 'org.slf4j:slf4j-nop' // Prevents warning about missing slf4j implementation during compilation

    // s2-quickstart, which the build runs without starting the application: published as the companion -cli, with
    // the plugin, the tool API and the standalone tools whose helpers it uses
    cliImplementation platform(project(':grails-bom'))
    cliApi project(project.path)
    cliApi(project(':grails-core')) {
        capabilities {
            requireCapability('org.apache.grails:grails-core-cli')
        }
    }
    cliApi(project(project.path)) {
        capabilities {
            requireCapability("${project.group}:${project.name}-cli-standalone")
        }
    }
    cliImplementation 'org.jline:jline'

    cliCompileOnly 'org.slf4j:slf4j-nop' // Prevents warning about missing slf4j implementation during compilation

    api project(':grails-spring-security-compat')
    api project(':grails-async') // AsyncGrailsWebRequest is used in public API
    api project(':grails-mimetypes')
    api project(':grails-datastore-core') // API because used in templates
    api project(':grails-datamapping-core') // API because used in templates
    api project(':grails-events-transforms') // API because used in templates
    api project(':grails-web-common')
    api project(':grails-web-url-mappings')
    api 'org.springframework:spring-beans'
    api 'org.springframework:spring-context'
    api 'org.springframework:spring-web'
    api 'org.springframework.security:spring-security-core'
    api 'org.springframework.security:spring-security-web'

    implementation 'org.apache.commons:commons-text'
    implementation 'org.ehcache:ehcache', {
        capabilities {
            requireCapability('org.ehcache:ehcache-jakarta')
        }
        // ehcache requires jaxb-runtime as the version range [3,3.1). A range makes every
        // resolution list the module's versions on Maven Central once the listing cache expires
        // (on every CI build), so one failed request there disables the repository for the rest
        // of the build; validateDependencyVersions rejects dynamic versions for that reason. The
        // BOM-managed version replaces the range below.
        exclude group: 'org.glassfish.jaxb', module: 'jaxb-runtime'
    }
    runtimeOnly 'org.glassfish.jaxb:jaxb-runtime' // the version ehcache requires as a range, see above
    implementation project(':grails-converters')
    implementation project(':grails-events') // Events Plugin is required to implement EventBus
    implementation project(':grails-rest-transforms')
    implementation project(':grails-bootstrap')
    implementation 'org.springframework:spring-context-support'
    implementation 'org.springframework:spring-core'
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.security:spring-security-crypto'

    compileOnly 'jakarta.servlet:jakarta.servlet-api' // Provided
    compileOnly 'org.jline:jline' // for shell commands
    compileOnly project(':grails-core') // Provided as this is a Grails Plugin
    compileOnly 'org.apache.groovy:groovy' // Compile-time annotations
    compileOnly 'org.slf4j:slf4j-nop' // Prevents warnings about missing slf4j implementation during compilation
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure' // AutoConfigurationImportFilter SPI

    runtimeOnly project(':grails-services') // A service is defined in the plugin

    testFixturesImplementation(platform(project(':grails-bom')))
    testFixturesImplementation 'org.springframework.security:spring-security-core'
    testFixturesImplementation 'org.springframework.security:spring-security-config'

    testFixturesCompileOnly 'org.slf4j:slf4j-nop' // Prevents warning about missing slf4j implementation during compilation

    testImplementation project(':grails-testing-support-datamapping')
    testImplementation project(':grails-testing-support-web')
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-config'
    testImplementation 'org.spockframework:spock-core'

    testRuntimeOnly 'net.bytebuddy:byte-buddy'
    testRuntimeOnly 'org.slf4j:slf4j-nop' // Prevents warnings about missing slf4j implementation during tests

    // SecurityToolsLocationSpec reads the POM and the module metadata of the companions
    testCliImplementation 'org.apache.groovy:groovy-json'
    testCliImplementation 'org.apache.groovy:groovy-xml'
}

// the templates the tools render are in the companion of the tools as well as in the plugin: the same staged
// directory the plugin's jar has them from
sourceSets.named('standalone') { SourceSet standalone ->
    standalone.output.dir([builtBy: tasks.named('copyTemplates')], layout.buildDirectory.dir('grails/plugin-templates'))
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/grails-extension-gradle-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/docs-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/spring-security-test-config.gradle')
}

// DefaultSecurityConfig is compiled, so that loading it finds the class rather than compiling the script at every
// startup, which a native image cannot do.
sourceSets.main.groovy.srcDir('grails-app/conf')

tasks.named('generateConfigurationMetadata') {
    dslConfigurationFiles.from(file('grails-app/conf/DefaultSecurityConfig.groovy'))
    dslRootPrefixes.put('security', 'grails.plugin.springsecurity')
}

// SecurityToolsLocationSpec reads the jar, the POM and the module metadata of each companion of the four Spring
// Security plugins that have tools, as the build publishes them
tasks.named('testCli', Test) { Test test ->
    ToolCompanionFiles companions = new ToolCompanionFiles()
    [':grails-spring-security', ':grails-spring-security-acl', ':grails-spring-security-oauth2', ':grails-spring-security-ui'].each { String path ->
        Project plugin = project(path)
        String name = path.substring(1)
        ['cli': 'cliJar', 'cliStandalone': 'standaloneJar'].each { String publication, String jar ->
            String artifact = publication == 'cli' ? "${name}-cli" : "${name}-cli-standalone"
            companions.files["${name}.${publication}.jar".toString()] = plugin.layout.buildDirectory.file("libs/${artifact}-${projectVersion}.jar")
            companions.files["${name}.${publication}.pom".toString()] = plugin.layout.buildDirectory.file("publications/${publication}/pom-default.xml")
            companions.files["${name}.${publication}.module".toString()] = plugin.layout.buildDirectory.file("publications/${publication}/module.json")
            test.dependsOn("${path}:${jar}", "${path}:generatePomFileFor${publication.capitalize()}Publication",
                    "${path}:generateMetadataFileFor${publication.capitalize()}Publication")
        }
    }
    test.jvmArgumentProviders.add(companions)
}

/** Hands the specs the files of the companions, as {@code -Dtools.<project>.<publication>.<jar|pom|module>=<path>}. */
class ToolCompanionFiles implements CommandLineArgumentProvider {

    @Internal
    Map<String, Provider<RegularFile>> files = [:]

    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    List<Provider<RegularFile>> getCompanionFiles() {
        files.values().toList()
    }

    @Override
    Iterable<String> asArguments() {
        files.collect { String key, Provider<RegularFile> file -> "-Dtools.${key}=${file.get().asFile.absolutePath}".toString() }
    }
}
