plugins {
    id 'groovy'
    id 'java-library'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.configuration-metadata'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.buildsrc.vulnerability-scan'
    id 'org.apache.grails.gradle.grails-code-style'
    id 'org.apache.grails.gradle.grails-jacoco'
}

version = projectVersion
group = 'org.apache.grails'

ext {
    pomTitle = 'Grails Startup Progress'
    pomDescription =
            'Answers on the application port while a Grails application starts, with a page showing how far ' +
            'the start has got, until the application is ready to serve requests.'
}

dependencies {

    implementation platform(project(':grails-bom'))

    // development mode, which decides whether the page is served by default
    implementation project(':grails-bootstrap')
    // the startup tasks applications and plugins report, which the page shows
    implementation project(':grails-core')

    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.boot:spring-boot-web-server'
    implementation 'org.springframework:spring-web'
    implementation 'org.slf4j:slf4j-api'

    // the status filter is only loaded in a servlet application, which brings the Servlet API with it
    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    testImplementation 'org.apache.groovy:groovy'
    testImplementation 'org.apache.groovy:groovy-json'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.apache.tomcat.embed:tomcat-embed-core'
    testImplementation 'org.springframework.boot:spring-boot-tomcat'
    testImplementation 'org.spockframework:spock-core'

    testImplementation 'org.apache.groovy:groovy-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.slf4j:slf4j-simple'
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/docs-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
}
