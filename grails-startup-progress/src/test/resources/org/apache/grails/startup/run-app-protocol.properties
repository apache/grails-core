# How "grails run-app" learns from grails-startup-progress whether the application has started.
# The two are separate programs in separate builds and share no class, so what they agree on is
# written here, once. Each side has a specification that holds its own code to this file:
# StartupProgressSpec in this module asks a starting application what the command line asks and
# expects these answers, and RunAppReadinessSpec in grails-forge/grails-forge-cli gives the command
# line these answers and expects it to ask this way. Change this file and both fail until both follow.

# What the command line sends, on a loopback address: {path} is "/" until an answer names the status
# path, and that path from then on. It reads the status line and the headers of the answer, never a body.
request.line=HEAD {path} HTTP/1.0

# The header of every answer startup progress gives: the phase of the start. An answer without it is
# the application's own.
header.phase=Grails-Startup-Phase

# The header that comes with the phase: the full path, context path included, that is answered with
# the phase for as long as the application runs. Any path is answered with the phase until the web
# server has the port; this one also after that, while BootStrap and the startup hooks run, and
# once the application is ready.
header.statusPath=Grails-Startup-Status-Path

# The status path where nothing configures another one, below the context path. The command line
# asks it once when the first answer it gets is the application's own, to find an application that
# was past the progress page when it was first asked.
statusPath.default=/__grails/startup-progress

# The phases, as the value of the phase header. The application has started at "ready" and at no
# other; "failed" is a start that will not get there; every other value is a start that goes on.
phases.starting=PREPARING,LOADING_DEFINITIONS,CREATING_BEANS,STARTING_WEB_SERVER,INITIALIZING
phase.ready=READY
phase.failed=FAILED
