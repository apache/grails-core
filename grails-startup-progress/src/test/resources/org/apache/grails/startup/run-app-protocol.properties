# How "grails run-app" learns from grails-startup-progress whether the application has started.
# The two are separate programs in separate builds and share no class, so what they agree on is
# written here, once. Each side has a specification that holds its own code to this file:
# StartupProgressSpec in this module asks a starting application what the command line asks and
# expects these answers, and RunAppReadinessSpec in grails-forge/grails-forge-cli gives the command
# line these answers and expects it to ask this way. Change this file and both fail until both follow.

# What the command line sends, on a loopback address: {path} is "/", and, while the answer to that
# names a phase of a start that goes on, also the path that answer names. It reads the status line
# and the headers of the answer, never a body.
request.line=HEAD {path} HTTP/1.0

# The header of every answer the server of startup progress gives: the phase of the start. An answer
# to "/" without it is the application's own web server, and the application has started then, for
# the command line, although BootStrap can still be running.
header.phase=Grails-Startup-Phase

# The header that comes with the phase: the full path, context path included, that the progress page
# polls. A start that fails holds the port to say so only for a client that asked this path a moment
# ago, which is the one thing the command line asks it for.
header.statusPath=Grails-Startup-Status-Path

# The phases, as the value of the phase header. "failed" is a start that will not go on, and ends the
# wait of the command line; "ready" is an application that has started; every other value is a start
# that goes on, and the command line waits while "/" is answered with one.
phases.starting=PREPARING,LOADING_DEFINITIONS,CREATING_BEANS,STARTING_WEB_SERVER,INITIALIZING
phase.ready=READY
phase.failed=FAILED
