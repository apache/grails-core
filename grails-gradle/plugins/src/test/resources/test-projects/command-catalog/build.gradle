// An application whose commands come from every place a command can come from. Nothing of Grails is
// resolved: the specification writes the artifacts the build asks for into maven-repo, the command
// contract and the command runner among them, and the class that runs a command is a stand-in.
plugins {
    id 'org.apache.grails.gradle.grails-app'
}

grails {
    bom = null
}

repositories {
    maven {
        url = uri(layout.projectDirectory.dir('maven-repo'))
    }
}

dependencies {
    implementation localGroovy()
}

apply from: 'commands.gradle'
