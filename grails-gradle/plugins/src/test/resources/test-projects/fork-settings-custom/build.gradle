plugins {
    id 'org.apache.grails.gradle.grails-app'
}

tasks.register('customHeap', JavaExec) {
    classpath = files()
    mainClass = 'does.not.Matter'
    minHeapSize = '512m'
    maxHeapSize = '2g'
}

tasks.register('inspectHeap') {
    def heap = providers.provider {
        def task = tasks.named('customHeap', JavaExec).get()
        [min: String.valueOf(task.minHeapSize), max: String.valueOf(task.maxHeapSize)]
    }
    doLast {
        println "MIN_HEAP=${heap.get().min}"
        println "MAX_HEAP=${heap.get().max}"
    }
}
