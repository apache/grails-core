plugins {
    id 'org.apache.grails.gradle.grails-app'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(__CURRENT_JDK__)
    }
}

tasks.register('checkTestToolchain') {
    def toolchainVersion = providers.provider {
        def launcher = tasks.named('test', Test).get().javaLauncher
        launcher.isPresent() ? String.valueOf(launcher.get().metadata.languageVersion.asInt()) : 'none'
    }
    doLast {
        println "TEST_TOOLCHAIN_VERSION=${toolchainVersion.get()}"
    }
}
