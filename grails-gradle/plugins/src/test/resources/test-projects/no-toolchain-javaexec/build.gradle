plugins {
    id 'org.apache.grails.gradle.grails-app'
}

tasks.register('printLauncher', JavaExec) {
    classpath = files()
    mainClass = 'does.not.Matter'
}

tasks.register('checkToolchain') {
    def hasLauncher = providers.provider { tasks.named('printLauncher', JavaExec).get().javaLauncher.isPresent() }
    doLast {
        if (hasLauncher.get()) {
            println 'HAS_LAUNCHER=true'
        } else {
            println 'HAS_LAUNCHER=false'
        }
    }
}
