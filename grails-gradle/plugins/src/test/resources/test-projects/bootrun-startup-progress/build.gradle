plugins {
    id 'org.apache.grails.gradle.grails-app'
}

tasks.register('inspectBootRunStartupProgress') {
    doLast {
        def bootRunTask = tasks.named('bootRun', JavaExec).get()
        bootRunTask.allJvmArgs.findAll { it.startsWith('-Dgrails.startup.progress.') }.each {
            println "STARTUP_PROGRESS_ARG ${it}"
        }
    }
}
