// A tool-bearing plugin whose companion coordinates are customized. Its variants must carry the
// advertised capabilities (org.example.test:acme-cli-tools and org.example.test:acme-files) in
// addition to the Gradle defaults, so both auto-discovery and hand-written requireCapability
// against the advertised coordinates resolve in-build.
plugins {
    id 'java-library'
    id 'org.apache.grails.gradle.grails-plugin-cli'
}

cliArtifact {
    artifactId = 'acme-cli-tools'
    standaloneArtifactId = 'acme-files'
    defaultDependencies = false
}
