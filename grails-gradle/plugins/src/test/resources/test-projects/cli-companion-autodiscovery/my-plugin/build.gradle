// A tool-bearing plugin developed in the same build as the consuming app. It advertises its
// companions (org.example.test:my-plugin-cli and org.example.test:my-plugin-cli-standalone) through
// the Grails-Cli-Artifact and Grails-Cli-Standalone-Artifact manifest attributes and exposes them as
// its `cli` and `cliStandalone` feature capabilities. `defaultDependencies = false` keeps the
// companions free of the grails-core-cli contract so the whole build resolves offline.
plugins {
    id 'java-library'
    id 'org.apache.grails.gradle.grails-plugin-cli'
}

cliArtifact {
    defaultDependencies = false
}
