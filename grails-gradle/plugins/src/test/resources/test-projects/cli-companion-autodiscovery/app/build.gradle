// A consuming application. It declares only the runtime plugin dependency; the companions of the
// plugins are wired automatically by the grails-cli plugin, each to the scope of its kind.
// Auto-provisioning is toggled with -PgrailsCliAutoProvision.
plugins {
    id 'java'
    id 'org.apache.grails.gradle.grails-cli'
}

sourceSets {
    integrationTest
}

tasks.register('prepareDigitBearingPlugin') {
    dependsOn gradle.includedBuild('included-digit-bearing-plugin').task(':my-plugin-2fa-one:jar')
    dependsOn gradle.includedBuild('included-digit-bearing-plugin').task(':my-plugin-2fa-snapshot:jar')
    dependsOn gradle.includedBuild('included-digit-bearing-plugin').task(':my-plugin-2fa-timestamp:jar')
    dependsOn gradle.includedBuild('included-digit-bearing-plugin').task(':my-plugin-2fa-unspecified:jar')
}

dependencies {
    implementation project(':my-plugin')
    implementation project(':renamed-plugin')
    implementation project(':plain-library')
    implementation 'org.example.test:my-plugin-2fa-one:1'
    implementation 'org.example.test:my-plugin-2fa-snapshot:1-SNAPSHOT'
    implementation 'org.example.test:my-plugin-2fa-timestamp:1-20260101.123456-1'
    implementation 'org.example.test:my-plugin-2fa-unspecified:1.0.0'
}

tasks.register('inspectGrailsCli') {
    // build the sibling jars so their components (and advertised companions) are resolvable
    dependsOn ':my-plugin:jar', ':renamed-plugin:jar'
    def grailsCliDependencies = providers.provider {
        configurations.grailsCli.dependencies.collect { dep ->
            if (dep instanceof org.gradle.api.artifacts.ProjectDependency) {
                def caps = dep.requestedCapabilities.collect { "${it.group}:${it.name}" }.join(',')
                "GRAILSCLI_DEP: project path=${dep.path} capabilities=[${caps}]".toString()
            }
            else {
                "GRAILSCLI_DEP: module ${dep.group}:${dep.name}:${dep.version}".toString()
            }
        }
    }
    doLast {
        grailsCliDependencies.get().each { println it }
    }
}

tasks.register('inspectGrailsCliStandalone') {
    dependsOn ':my-plugin:jar', ':renamed-plugin:jar'
    def standaloneDependencies = providers.provider {
        configurations.grailsCliStandalone.dependencies.collect { dep ->
            if (dep instanceof org.gradle.api.artifacts.ProjectDependency) {
                def caps = dep.requestedCapabilities.collect { "${it.group}:${it.name}" }.join(',')
                "GRAILSCLISTANDALONE_DEP: project path=${dep.path} capabilities=[${caps}]".toString()
            }
            else {
                "GRAILSCLISTANDALONE_DEP: module ${dep.group}:${dep.name}:${dep.version}".toString()
            }
        }
    }
    doLast {
        standaloneDependencies.get().each { println it }
    }
}

tasks.register('inspectClasspathWiring') {
    def report = providers.provider {
        def extending = { org.gradle.api.artifacts.Configuration c, String name -> name in (c.hierarchy*.name as Set) }
        def configurationNames = [
                COMPILE: 'compileClasspath', RUNTIME: 'runtimeClasspath', TEST_COMPILE: 'testCompileClasspath', TEST_RUNTIME: 'testRuntimeClasspath',
                INTEGRATION_TEST_COMPILE: 'integrationTestCompileClasspath', INTEGRATION_TEST_RUNTIME: 'integrationTestRuntimeClasspath',
                CLI_COMPILE: 'cliCompileClasspath', CLI_RUNTIME: 'cliRuntimeClasspath', STANDALONE_COMPILE: 'standaloneCompileClasspath',
                STANDALONE_RUNTIME: 'standaloneRuntimeClasspath', CLASSPATH: 'grailsCliClasspath', STANDALONE_CLASSPATH: 'grailsCliStandaloneClasspath'
        ]
        configurationNames.collectMany { String label, String configuration ->
            ['grailsCli', 'grailsCliStandalone'].collect { String scope ->
                "${label}_EXTENDS_${scope.toUpperCase()}=${extending(configurations.getByName(configuration), scope)}".toString()
            }
        }
    }
    doLast {
        report.get().each { println it }
    }
}

tasks.register('inspectStandaloneClasspath') {
    // the companion jars must actually resolve through the projects' cliStandalone capabilities
    dependsOn ':my-plugin:standaloneJar', ':renamed-plugin:standaloneJar'
    def standaloneArtifacts = configurations.grailsCliStandaloneClasspath.incoming.artifactView { it.lenient(true) }.files
    doLast {
        standaloneArtifacts.each {
            println "STANDALONE_ARTIFACT: ${it.name}"
        }
    }
}

tasks.register('inspectRuntimeClasspath') {
    dependsOn ':my-plugin:jar', ':renamed-plugin:jar'
    def runtimeArtifacts = configurations.runtimeClasspath.incoming.artifactView { it.lenient(true) }.files
    doLast {
        runtimeArtifacts.each {
            println "RUNTIME_ARTIFACT: ${it.name}"
        }
    }
}

tasks.register('inspectCliClasspath') {
    // the companion jars must actually resolve through the projects' cli capabilities
    dependsOn ':my-plugin:cliJar', ':renamed-plugin:cliJar'
    def cliArtifacts = configurations.grailsCliClasspath.incoming.artifactView { it.lenient(true) }.files
    doLast {
        cliArtifacts.each {
            println "CLI_ARTIFACT: ${it.name}"
        }
    }
}
