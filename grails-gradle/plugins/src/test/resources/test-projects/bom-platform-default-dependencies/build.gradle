plugins {
    id 'org.apache.grails.gradle.grails-app'
    id 'jacoco'
}

repositories {
    maven {
        url = uri("${projectDir}/maven-repo")
    }
}

// lazy-bom stands in for grails-bom so that everything this build resolves comes from the local
// maven-repo above. It manages org.example:managed-lib at 1.0.0.
grails {
    bom = 'lazy-bom'
}

bomPropertyOverrides {
    autoDetect = providers.gradleProperty('autoDetect').map { it.toBoolean() }.orElse(true)
    if (providers.gradleProperty('explicitBom').getOrElse('false').toBoolean()) {
        bom "org.apache.grails:lazy-bom:$grailsVersion"
    }
}

// Gradle's jacoco plugin populates jacocoAgent and jacocoAnt through defaultDependencies, which
// only fire while a configuration holds no dependencies at all (gradle/gradle#11209). The tool
// version deliberately exists only in the local maven-repo.
jacoco {
    toolVersion = '0.0.1-test'
}

configurations {
    // A configuration a third-party plugin populates the same way.
    lazyTool {
        canBeConsumed = false
        canBeResolved = true
        defaultDependencies { deps ->
            deps.add(project.dependencies.create('org.example:lazy-tool:1.0.0'))
        }
    }
    // A plain configuration whose version-less dependency relies on the BOM's constraint.
    managed {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    managed 'org.example:managed-lib'
}

// Runs after Grails registers its configureEach callback. create() adds the configuration to
// the container before its closure sets the final role, unlike the role-specific factory APIs.
afterEvaluate {
    def lateResolvable = configurations.create('lateResolvable') {
        canBeDeclared = false
        canBeConsumed = false
        canBeResolved = true
    }
    def lateDeclarable = configurations.create('lateDeclarable') {
        canBeConsumed = false
        canBeResolved = true
        defaultDependencies { deps ->
            deps.add(project.dependencies.create('org.example:lazy-tool:1.0.0'))
        }
    }
    tasks.register('inspectLateConfigurations') {
        doLast {
            println "LATE_RESOLVABLE_RESOLVED=${resolvedModules(lateResolvable)}"
            println "LATE_RESOLVABLE_HAS_BOM=${lateResolvable.incoming.dependencies.any { it.name == 'lazy-bom' }}"
            println "LATE_DECLARABLE_RESOLVED=${resolvedModules(lateDeclarable)}"
        }
    }
}

tasks.register('inspectDefaultDependencies') {
    def jacocoAgent = configurations.jacocoAgent
    def jacocoAnt = configurations.jacocoAnt
    def lazyTool = configurations.lazyTool
    def managed = configurations.managed
    def profile = configurations.profile
    doLast {
        def isLazyBom = { dep -> dep.group == 'org.apache.grails' && dep.name == 'lazy-bom' }

        println "JACOCO_AGENT_RESOLVED=${resolvedModules(jacocoAgent)}"
        println "JACOCO_ANT_RESOLVED=${resolvedModules(jacocoAnt)}"
        println "LAZY_TOOL_RESOLVED=${resolvedModules(lazyTool)}"
        println "MANAGED_RESOLVED=${resolvedModules(managed)}"

        // Observing a configuration's dependencies runs its dependency actions, so the default
        // dependency and the lazily contributed platform must both be declared by now.
        println "PROFILE_DEFAULT_DECLARED=${profile.incoming.dependencies.any { it.group == 'org.apache.grails.profiles' }}"
        println "PROFILE_HAS_BOM=${profile.incoming.dependencies.any(isLazyBom)}"
        println "LAZY_TOOL_HAS_BOM=${lazyTool.incoming.dependencies.any(isLazyBom)}"
        println "JACOCO_AGENT_HAS_BOM=${jacocoAgent.incoming.dependencies.any(isLazyBom)}"
        println "JACOCO_ANT_HAS_BOM=${jacocoAnt.incoming.dependencies.any(isLazyBom)}"
    }
}

static List<String> resolvedModules(Configuration configuration) {
    configuration.incoming.resolutionResult.allComponents
            .collect { it.moduleVersion }
            .findAll { it != null && it.group }
            .collect { "${it.group}:${it.name}:${it.version}" as String }
            .sort()
}
