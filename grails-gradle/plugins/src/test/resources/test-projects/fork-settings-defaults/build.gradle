plugins {
    id 'org.apache.grails.gradle.grails-app'
}

tasks.register('checkSysProps', JavaExec) {
    classpath = files()
    mainClass = 'does.not.Matter'
}

tasks.register('inspectSysProps') {
    def settings = providers.provider {
        def task = tasks.named('checkSysProps', JavaExec).get()
        [
                hasEnv: task.systemProperties.containsKey('grails.env'),
                min: String.valueOf(task.minHeapSize),
                max: String.valueOf(task.maxHeapSize)
        ]
    }
    doLast {
        println "HAS_ENV=${settings.get().hasEnv}"
        println "MIN_HEAP=${settings.get().min}"
        println "MAX_HEAP=${settings.get().max}"
    }
}
