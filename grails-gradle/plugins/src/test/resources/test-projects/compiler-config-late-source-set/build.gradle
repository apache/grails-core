plugins {
    id 'org.apache.grails.gradle.grails-app'
}

// Registered after every afterEvaluate callback has run.
gradle.projectsEvaluated {
    sourceSets.register('late')
}

tasks.register('inspectLate') {
    def taskNames = providers.provider { tasks.names as List<String> }
    doLast {
        println "LATE_GENERATOR_EXISTS=${taskNames.get().contains('generateCompileLateGroovyGrailsCompilerConfig')}"
        println "MAIN_GENERATOR_EXISTS=${taskNames.get().contains('generateCompileGroovyGrailsCompilerConfig')}"
    }
}
