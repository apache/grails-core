plugins {
    id 'org.apache.grails.gradle.grails-app'
}

dependencies {
    implementation project(':producer')
    runtimeOnly project(':runtime-only-producer')
}

tasks.register('inspectDecoupling') {
    def report = providers.provider {
        def gen = tasks.named('generateCompileGroovyGrailsCompilerConfig').get()
        def deps = gen.taskDependencies.getDependencies(gen)*.path
        [
                "GENERATOR_DEPENDENCIES=${deps}",
                "GENERATOR_DEPENDS_ON_COMPILE_CLASSPATH=${deps.any { it == ':producer:jar' }}",
                "GENERATOR_DEPENDS_ON_RUNTIME_CLASSPATH=${deps.any { it == ':runtime-only-producer:jar' }}",
                "GENERATOR_DECLARED_INPUT_FILES=${gen.inputs.files.files.size()}",
                "GENERATOR_HAS_CONTENT_INPUT=${gen.inputs.properties.containsKey('grailsScript')}"
        ]*.toString()
    }
    doLast {
        report.get().each { println it }
    }
}
