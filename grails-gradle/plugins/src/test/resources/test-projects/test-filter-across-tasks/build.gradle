plugins {
    id 'java'
    id 'org.apache.grails.gradle.grails-integration-test'
}

// The build has no repositories: JUnit is given as the jars of the specification that runs this build.
dependencies {
    testImplementation files(providers.gradleProperty('junitClasspath').get().split(File.pathSeparator).toList())
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed'
    }
}

// a test task the build script skips with an onlyIf (-PskipPhase=NAME) or turns off (-PdisablePhase=NAME)
def skipPhase = providers.gradleProperty('skipPhase')
def disablePhase = providers.gradleProperty('disablePhase').getOrElse('')
tasks.withType(Test).configureEach {
    def name = it.name
    onlyIf { skipPhase.getOrElse('') != name }
    if (disablePhase == name) {
        enabled = false
    }
}
