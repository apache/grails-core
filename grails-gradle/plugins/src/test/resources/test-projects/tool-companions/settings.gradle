// A plugin with a tool of each kind, and the applications that use its tools: one of the same build,
// one that depends on the published plugin, one that takes only its standalone tools, and one that
// resolves the published plugin from a repository without Gradle module metadata. Beside them, a plugin
// whose tools are all standalone tools, and an application that names its -cli by hand.
rootProject.name = 'tool-companions'

include 'my-plugin', 'app', 'consumer', 'standalone-only', 'pom-consumer', 'standalone-plugin', 'cli-line-consumer'
