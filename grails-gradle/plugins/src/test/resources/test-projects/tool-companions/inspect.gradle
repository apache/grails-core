// What an application that uses the tools of the plugin says of its scopes and its class paths
tasks.register('inspectScopes') {
    def declared = providers.provider {
        ['grailsCli', 'grailsCliStandalone'].collectMany { String scope ->
            configurations.getByName(scope).dependencies.collect { dep ->
                if (dep instanceof org.gradle.api.artifacts.ProjectDependency) {
                    "${scope}: project ${dep.path} ${dep.requestedCapabilities.collect { "${it.group}:${it.name}" }.join(',')}".toString()
                } else {
                    "${scope}: module ${dep.group}:${dep.name}:${dep.version}".toString()
                }
            }
        }
    }
    doLast {
        declared.get().each { println it }
    }
}

tasks.register('inspectClasspaths') {
    def classpaths = [
            RUNTIME             : configurations.runtimeClasspath.incoming.files,
            TEST_RUNTIME        : configurations.testRuntimeClasspath.incoming.files,
            CLASSPATH           : configurations.grailsCliClasspath.incoming.files,
            STANDALONE_CLASSPATH: configurations.grailsCliStandaloneClasspath.incoming.files,
    ]
    classpaths.each { String label, FileCollection files ->
        inputs.files(files).withPropertyName(label)
    }
    doLast {
        classpaths.each { String label, FileCollection files ->
            println "${label}=${files.files*.name.sort().join(',')}"
        }
    }
}
