// A plugin whose tools are all standalone tools, as those of the scaffolding plugin are: it publishes
// -cli-standalone with them, and -cli without a tool, which depends on -cli-standalone, so that a build
// that names -cli, as earlier builds were written, gets them
plugins {
    id 'java-library'
    id 'org.apache.grails.gradle.grails-plugin-cli'
    id 'org.apache.grails.gradle.grails-publish'
}

repositories {
    maven {
        url = rootProject.layout.projectDirectory.dir('maven-repo')
    }
}

// stands in for the Grails BOM, which manages the version of the tool API the companions depend on
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.apache.grails' && !details.requested.version) {
            details.useVersion('0.0.1-test')
        }
    }
}

grailsPublish {
    githubSlug = 'apache/grails-core'
    license {
        name = 'Apache-2.0'
    }
    title = 'Standalone Plugin'
    desc = 'Test plugin whose tools are all standalone tools'
    developers = [test: 'Test Developer']
    testRepositoryPath = rootProject.layout.buildDirectory.dir('test-repo').get()
}
