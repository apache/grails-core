// An application that names the -cli of a plugin whose tools are all standalone tools by hand, as a
// line earlier builds of Grails 9 wrote for the scaffolding plugin: nothing else of the plugin is declared
plugins {
    id 'java'
    id 'org.apache.grails.gradle.grails-cli'
}

repositories {
    maven {
        url = rootProject.layout.buildDirectory.dir('test-repo')
    }
    maven {
        url = rootProject.layout.projectDirectory.dir('maven-repo')
    }
}

dependencies {
    grailsCli 'org.example.test:standalone-plugin-cli:1.0.0-SNAPSHOT'
}

apply from: rootProject.file('inspect.gradle')
