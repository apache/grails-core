plugins {
    id 'org.apache.grails.gradle.grails-web'
}

tasks.register('inspectBootRunPid') {
    def pidFile = providers.provider {
        def prefix = '-Dgrails.cli.pid.file='
        def pidArg = tasks.named('bootRun').get().jvmArgumentProviders
                .collectMany { it.asArguments() as List }
                .find { it.startsWith(prefix) }
        pidArg ? pidArg.substring(prefix.length()) : ''
    }
    doLast {
        println "PID_FILE=${pidFile.get()}"
    }
}
