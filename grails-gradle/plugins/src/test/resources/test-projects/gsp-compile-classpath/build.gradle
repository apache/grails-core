// Verifies the GSP compile classpath assembled by GroovyPagePlugin. Marker directories are used as
// file dependencies so the classpath can be asserted without resolving anything from a repository.
plugins {
    id 'groovy'
    id 'war'
    id 'org.apache.grails.gradle.grails-gsp'
}

dependencies {
    implementation files('compile-classpath-marker')
    providedCompile files('provided-compile-marker')
}

tasks.register('inspectGspCompileClasspath') {
    def report = providers.provider {
        def mainPaths = classpathOf('compileGroovyPages')
        def webappPaths = classpathOf('compileWebappGroovyPages')
        [
                "HAS_GSP_COMPILE_CONFIGURATION=${configurations.findByName('gspCompile') != null}",
                "PAGE_COMPILER_STATIC=${tasks.named('compileGroovyPages').get().compileStatic.get()}",
                "WEBAPP_PAGE_COMPILER_STATIC=${tasks.named('compileWebappGroovyPages').get().compileStatic.get()}",

                "MAIN_HAS_COMPILE_CLASSPATH=${containsEntry(mainPaths, 'compile-classpath-marker')}",
                "MAIN_HAS_PROVIDED_COMPILE=${containsEntry(mainPaths, 'provided-compile-marker')}",
                "MAIN_HAS_CLASSES_DIR=${mainPaths.any { it.contains('/build/classes/') }}",

                "WEBAPP_HAS_COMPILE_CLASSPATH=${containsEntry(webappPaths, 'compile-classpath-marker')}",
                "WEBAPP_HAS_PROVIDED_COMPILE=${containsEntry(webappPaths, 'provided-compile-marker')}",
                "WEBAPP_HAS_CLASSES_DIR=${webappPaths.any { it.contains('/build/classes/') }}"
        ]*.toString()
    }
    doLast {
        report.get().each { println it }
    }
}

// The pages these tasks compile have to be loadable by a test of the application, not only by one
// started from an archive. They are kept off the main runtime class path, which a boot archive
// packages into its classes directory - where the pages are copied already.
tasks.register('inspectGspRuntimeClasspath') {
    def test = tasks.named('test').get()
    def testDependencies = test.taskDependencies.getDependencies(test)*.name
    def report = providers.provider {
        def mainRuntime = runtimeClasspathOf('main')
        def testRuntime = runtimeClasspathOf('test')
        [
                "MAIN_RUNTIME_HAS_PAGES=${containsEntry(mainRuntime, 'build/gsp-classes/main')}",
                "MAIN_RUNTIME_HAS_WEBAPP_PAGES=${containsEntry(mainRuntime, 'build/gsp-classes/webapp')}",
                "TEST_RUNTIME_HAS_PAGES=${containsEntry(testRuntime, 'build/gsp-classes/main')}",
                "TEST_RUNTIME_HAS_WEBAPP_PAGES=${containsEntry(testRuntime, 'build/gsp-classes/webapp')}"
        ]*.toString()
    }

    doLast {
        report.get().each { println it }

        // the pages are on the class path builtBy the tasks that compile them, so running the tests
        // compiles them first rather than leaving whatever an earlier run wrote
        println "TEST_WAITS_FOR_PAGE_COMPILATION=${testDependencies.contains('compileGroovyPages')}"
        println "TEST_WAITS_FOR_WEBAPP_PAGE_COMPILATION=${testDependencies.contains('compileWebappGroovyPages')}"
    }
}

List<String> runtimeClasspathOf(String sourceSetName) {
    sourceSets.named(sourceSetName).get().runtimeClasspath.files.collect { it.absolutePath.replace('\\', '/') }
}

List<String> classpathOf(String taskName) {
    tasks.named(taskName).get().classpath.files.collect { it.absolutePath.replace('\\', '/') }
}

static boolean containsEntry(List<String> paths, String directoryName) {
    paths.any { it.endsWith("/${directoryName}") }
}
