// Verifies the GSP compile classpath assembled by GroovyPagePlugin. Marker directories are used as
// file dependencies so the classpath can be asserted without resolving anything from a repository.
plugins {
    id 'groovy'
    id 'war'
    id 'org.apache.grails.gradle.grails-gsp'
}

dependencies {
    implementation files('compile-classpath-marker')
    providedCompile files('provided-compile-marker')
}

tasks.register('inspectGspCompileClasspath') {
    doLast {
        println "HAS_GSP_COMPILE_CONFIGURATION=${configurations.findByName('gspCompile') != null}"
        println "PAGE_COMPILER_STATIC=${tasks.named('compileGroovyPages').get().compileStatic.get()}"
        println "WEBAPP_PAGE_COMPILER_STATIC=${tasks.named('compileWebappGroovyPages').get().compileStatic.get()}"

        def mainPaths = classpathOf('compileGroovyPages')
        def webappPaths = classpathOf('compileWebappGroovyPages')

        println "MAIN_HAS_COMPILE_CLASSPATH=${containsEntry(mainPaths, 'compile-classpath-marker')}"
        println "MAIN_HAS_PROVIDED_COMPILE=${containsEntry(mainPaths, 'provided-compile-marker')}"
        println "MAIN_HAS_CLASSES_DIR=${mainPaths.any { it.contains('/build/classes/') }}"

        println "WEBAPP_HAS_COMPILE_CLASSPATH=${containsEntry(webappPaths, 'compile-classpath-marker')}"
        println "WEBAPP_HAS_PROVIDED_COMPILE=${containsEntry(webappPaths, 'provided-compile-marker')}"
        println "WEBAPP_HAS_CLASSES_DIR=${webappPaths.any { it.contains('/build/classes/') }}"
    }
}

// The pages these tasks compile have to be loadable by a test of the application, not only by one
// started from an archive. They are kept off the main runtime class path, which a boot archive
// packages into its classes directory - where the pages are copied already.
tasks.register('inspectGspRuntimeClasspath') {
    doLast {
        def mainRuntime = runtimeClasspathOf('main')
        def testRuntime = runtimeClasspathOf('test')

        println "MAIN_RUNTIME_HAS_PAGES=${containsEntry(mainRuntime, 'build/gsp-classes/main')}"
        println "MAIN_RUNTIME_HAS_WEBAPP_PAGES=${containsEntry(mainRuntime, 'build/gsp-classes/webapp')}"
        println "TEST_RUNTIME_HAS_PAGES=${containsEntry(testRuntime, 'build/gsp-classes/main')}"
        println "TEST_RUNTIME_HAS_WEBAPP_PAGES=${containsEntry(testRuntime, 'build/gsp-classes/webapp')}"
    }
}

List<String> runtimeClasspathOf(String sourceSetName) {
    sourceSets.named(sourceSetName).get().runtimeClasspath.files.collect { it.absolutePath.replace('\\', '/') }
}

List<String> classpathOf(String taskName) {
    tasks.named(taskName).get().classpath.files.collect { it.absolutePath.replace('\\', '/') }
}

static boolean containsEntry(List<String> paths, String directoryName) {
    paths.any { it.endsWith("/${directoryName}") }
}
