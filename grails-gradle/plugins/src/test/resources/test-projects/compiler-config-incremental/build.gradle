plugins {
    id 'org.apache.grails.gradle.grails-app'
}
grails {
    starImports = (findProperty('extraImport') ? [findProperty('extraImport')] : [])
}
tasks.register('inspectSourceSets') {
    def generators = providers.provider {
        tasks.names.findAll { it.startsWith('generate') && it.endsWith('GrailsCompilerConfig') }.sort()
    }
    doLast {
        println "GENERATORS=${generators.get()}"
    }
}
