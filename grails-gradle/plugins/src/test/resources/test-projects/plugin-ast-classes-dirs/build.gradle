plugins {
    id 'org.apache.grails.gradle.grails-plugin'
}

// Mirrors an analysis task that reads the main classes directories directly instead of going through
// the 'classes' lifecycle task, and prints which tasks Gradle will run to produce them.
tasks.register('inspectMainClassesDirs') {
    def producers = providers.provider {
        sourceSets.main.output.classesDirs.buildDependencies.getDependencies(null)*.name.sort()
    }
    doLast {
        println "MAIN_CLASSES_DIRS_BUILT_BY=${producers.get().join(',')}"
    }
}
