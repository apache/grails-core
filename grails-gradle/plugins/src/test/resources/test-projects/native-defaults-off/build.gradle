plugins {
    id 'org.apache.grails.gradle.grails-app'
}

// An application that builds neither an image nor a cache applies neither plugin, and so should
// find nothing has been decided on its behalf.
tasks.register('inspectDefaults') {
    def indyOption = providers.provider {
        Map<String, Boolean> options = project.tasks.named('compileGroovy', GroovyCompile).get().groovyOptions.optimizationOptions
        options.containsKey('indy') ? String.valueOf(options.indy) : 'unset'
    }
    def hasNativeExtension = providers.provider { project.extensions.findByName('graalvmNative') != null }
    doLast {
        println "INDY_OPTION=${indyOption.get()}"
        println "HAS_NATIVE_EXTENSION=${hasNativeExtension.get()}"
    }
}
