plugins {
    id 'java'
    id 'org.apache.grails.gradle.grails-cli'
}

dependencies {
    implementation project(':legacy-command-plugin')
}

tasks.register('inspectLegacyCommandTask') {
    def taskNames = providers.provider { tasks.names as List<String> }
    doLast {
        println "LEGACY_COMMAND_TASK_PRESENT=${taskNames.get().contains('helloLegacyApp')}"
        println "RUN_COMMAND_TASK_PRESENT=${taskNames.get().contains('runCommand')}"
    }
}
