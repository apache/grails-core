plugins {
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.gradle.grails-web'
    id 'cloud.wondrify.asset-pipeline'
}

version = '0.1'
group = 'spring.security.cas'

dependencies {
    implementation platform(project(':grails-bom'))
    implementation 'org.apache.grails:grails-spring-security-cas'
    implementation 'org.apache.grails:grails-core'
    implementation 'org.apache.grails:grails-rest-transforms'
    implementation 'org.apache.grails:grails-web-boot'
    implementation 'org.apache.grails:grails-gsp'
    implementation 'org.apache.grails:grails-layout'

    // 3rd party client-side assets bundled in webjars
    implementation 'org.webjars:bootstrap:3.3.6'
    implementation 'org.webjars:jquery:2.2.0'

    // Starts the CAS server the app authenticates against; see CasContainerHolder
    implementation 'org.testcontainers:testcontainers'

    compileOnly 'org.slf4j:slf4j-nop' // Prevents warning about missing slf4j implementation during compilation

    runtimeOnly 'cloud.wondrify:asset-pipeline-grails'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.zaxxer:HikariCP'
    runtimeOnly 'org.apache.grails:grails-databinding'
    runtimeOnly 'org.apache.grails:grails-url-mappings'
    runtimeOnly 'org.apache.grails:grails-data-hibernate5'
    runtimeOnly 'org.springframework.boot:spring-boot-autoconfigure'
    runtimeOnly 'org.springframework.boot:spring-boot-starter-logging'
    runtimeOnly 'org.springframework.boot:spring-boot-starter-tomcat'

    integrationTestImplementation 'org.apache.grails:grails-testing-support-web'
    integrationTestImplementation 'org.spockframework:spock-core'
}

tasks.withType(Test).configureEach {
    // Lets CI pin or matrix the CAS server version, mirroring -PredisContainerVersion
    if (project.hasProperty('casContainerVersion')) {
        systemProperty('casContainerVersion', project.property('casContainerVersion'))
    }
}

tasks.named('bootRun') {
    // bootRun forks its own JVM, so the properties that select a CAS configuration have to be
    // forwarded explicitly. Without TESTCONFIG the proxy settings are never configured and
    // /secure/proxyStatus can only report that no proxy ticket is available.
    ['TESTCONFIG', 'casContainerVersion'].each { String name ->
        String value = System.getProperty(name) ?: project.findProperty(name)
        if (value) {
            systemProperty(name, value)
        }
    }
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/functional-test-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/grails-extension-gradle-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/test-webjar-asset-config.gradle')
}
