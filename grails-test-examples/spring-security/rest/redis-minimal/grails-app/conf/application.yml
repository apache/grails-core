info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
grails:
    redis:
        # Set by StartRedisGrailsIntegrationExtension to where the Redis container of the specs listens
        host: '${REDIS_HOST:localhost}'
        port: '${REDIS_PORT:6379}'
    cors:
        enabled: true
        allowedOrigins:
            - http://www.example.com
