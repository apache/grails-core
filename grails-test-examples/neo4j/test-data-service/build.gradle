plugins {
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
}

version = projectVersion
group = 'examples'

apply plugin: 'org.apache.grails.gradle.grails-web'

dependencies {

    implementation platform(project(':grails-bom'))

    implementation 'org.apache.grails:grails-data-neo4j'

    implementation 'org.apache.grails:grails-core'
    implementation 'org.apache.grails:grails-rest-transforms'
    implementation 'org.apache.grails:grails-services'
    implementation 'org.apache.grails:grails-web-boot'
    implementation "org.apache.grails:grails-spring-security:$grailsSpringSecurityVersion"
    implementation "org.apache.grails:grails-spring-security-rest:$grailsSpringSecurityVersion"
    implementation 'org.apache.grails:grails-views-gson'

    runtimeOnly 'org.apache.grails:grails-url-mappings'
    runtimeOnly 'org.apache.grails:grails-events'
    runtimeOnly 'org.springframework.boot:spring-boot-autoconfigure'
    runtimeOnly 'org.springframework.boot:spring-boot-starter-logging'
    runtimeOnly 'org.springframework.boot:spring-boot-starter-tomcat'

    integrationTestImplementation 'org.apache.grails:grails-testing-support-datamapping'
    integrationTestImplementation 'org.spockframework:spock-core'

    testRuntimeOnly "org.neo4j.test:neo4j-harness:$neo4jVersion"
}

// The Spring Boot BOM (pulled in transitively via grails-bom) force-upgrades Jetty to a 12.x
// platform version, binary-incompatible with the embedded Neo4j 3.5.x test harness this app's
// tests use. See grails-data-neo4j/grails-datastore-gorm-neo4j/build.gradle for the full
// explanation.
def neo4jHarnessJettyVersion = '9.4.43.v20210629'
[configurations.testCompileClasspath, configurations.testRuntimeClasspath,
 configurations.integrationTestCompileClasspath, configurations.integrationTestRuntimeClasspath].each {
    it.resolutionStrategy {
        force "org.eclipse.jetty:jetty-server:$neo4jHarnessJettyVersion",
                "org.eclipse.jetty:jetty-servlet:$neo4jHarnessJettyVersion",
                "org.eclipse.jetty:jetty-webapp:$neo4jHarnessJettyVersion",
                "org.eclipse.jetty:jetty-security:$neo4jHarnessJettyVersion",
                "org.eclipse.jetty:jetty-http:$neo4jHarnessJettyVersion",
                "org.eclipse.jetty:jetty-io:$neo4jHarnessJettyVersion",
                "org.eclipse.jetty:jetty-util:$neo4jHarnessJettyVersion",
                "org.eclipse.jetty:jetty-util-ajax:$neo4jHarnessJettyVersion",
                "org.eclipse.jetty:jetty-xml:$neo4jHarnessJettyVersion"
    }
}
// Deliberately older than the BOM's Jetty version (see comment above) - exempt from
// validateDependencyVersions.
project.ext.allowedBomOverrides = [
        'org.eclipse.jetty:jetty-server',
        'org.eclipse.jetty:jetty-servlet',
        'org.eclipse.jetty:jetty-webapp',
        'org.eclipse.jetty:jetty-security',
        'org.eclipse.jetty:jetty-http',
        'org.eclipse.jetty:jetty-io',
        'org.eclipse.jetty:jetty-util',
        'org.eclipse.jetty:jetty-util-ajax',
        'org.eclipse.jetty:jetty-xml'
]

tasks.withType(Test) {
    // The embedded Neo4j 3.5.x test harness reflectively pokes JDK internals at startup; JDK 9+
    // strong encapsulation blocks that without these opens.
    jvmArgs += ['--add-opens', 'java.base/java.lang=ALL-UNNAMED', '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED']
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/functional-test-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/grails-extension-gradle-config.gradle')
}
