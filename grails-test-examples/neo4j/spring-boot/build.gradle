// Standalone Spring Boot demo that embeds GORM-for-Neo4j without a full
// Grails application.

plugins {
    id 'groovy'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.springframework.boot'
    id 'org.apache.grails.buildsrc.compile'
}

version = projectVersion
group = 'examples'

dependencies {

    implementation platform(project(':grails-neo4j-bom'))

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.apache.grails:grails-data-neo4j-spring-boot'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.spockframework:spock-spring'

    testRuntimeOnly 'org.neo4j.test:neo4j-harness'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/functional-test-config.gradle')
    from rootProject.layout.projectDirectory.file('grails-data-neo4j/gradle/neo4j-harness-test-config.gradle')
}
