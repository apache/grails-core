grails:
    profile: web
info:
    app:
        name: startup-progress

# The beans below and BootStrap take as long as they are told to here, so the startup progress page has
# something to show. Any of these can be overridden on the command line, for example
#   ./gradlew :grails-test-examples-startup-progress:bootRun --args='--startup.demo.fail=bootstrap'
# and a browser opens on the progress page with
#   ./gradlew :grails-test-examples-startup-progress:bootRun -Pgrails.startup.progress.openBrowser
startup:
    demo:
        delay:
            searchIndex: 0s
            reportCache: 0s
            pricingRules: 0s
        bootstrapDelay: 0s
        # 'bean' fails creating the searchIndex bean, 'bootstrap' fails in BootStrap
        fail: none

environments:
    development:
        startup:
            demo:
                delay:
                    searchIndex: 6s
                    reportCache: 4s
                    pricingRules: 2s
                bootstrapDelay: 5s
