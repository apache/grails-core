// This Grails application is regression coverage for the legacy Spring Dependency
// Management Gradle plugin (io.spring.dependency-management). Grails 8 no longer
// applies that plugin automatically - dependency versions are managed by Gradle's
// native platform() support via the Grails Gradle plugin. However, an existing
// Grails 7 application that applied io.spring.dependency-management by hand must
// continue to work. This example reproduces that scenario:
//
//   * grails { bom = null } opts out of the Grails Gradle plugin's automatic
//     platform(grails-bom) injection, so version management is NOT provided by the
//     framework's native platform.
//   * io.spring.dependency-management is applied directly and manages the external
//     versions this example needs, so the Spring DM plugin remains the source of
//     truth for managed versions here.
plugins {
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.vulnerability-scan'
}

version = '0.1'
group = 'functionaltests'

apply plugin: 'org.apache.grails.gradle.grails-web'
apply plugin: 'org.apache.grails.gradle.grails-gsp'

// io.spring.dependency-management is already available on the build classpath, so it is
// applied here without a version (an explicit version in the plugins {} block fails when a
// plugin is already on the classpath with an unknown version). A real end-user Grails build
// would instead declare it in its own plugins {} block with a version.
apply plugin: 'io.spring.dependency-management'

grails {
    // Opt out of the native platform(grails-bom) injection; Spring DM manages versions instead.
    bom = null
}

apply from: rootProject.layout.projectDirectory.file('dependencies.gradle')
def grailsBomVersions = rootProject.project(':grails-bom').customBomVersions

// Override Spring Boot's managed properties with the Grails BOM values so the legacy
// Spring Dependency Management path keeps the project-selected versions.
ext['groovy.version'] = bomDependencyVersions['groovy.version']
ext['commons-codec.version'] = bomDependencyVersions['commons-codec.version']
ext['log4j2.version'] = bomDependencyVersions['log4j2.version']
ext['logback.version'] = bomDependencyVersions['logback.version']
ext['jackson-bom.version'] = bomDependencyVersions['jackson3.version']

dependencyManagement {
    dependencies {
        dependency "org.apache.groovy:groovy:${bomDependencyVersions['groovy.version']}"
        dependency "org.apache.ant:ant:${gradleBomDependencyVersions['ant.version']}"
        dependency "org.apache.ant:ant-junit:${gradleBomDependencyVersions['ant.version']}"
        dependency "ch.qos.logback:logback-classic:${bomDependencyVersions['logback.version']}"
        dependency "ch.qos.logback:logback-core:${bomDependencyVersions['logback.version']}"
        dependency "org.fusesource.jansi:jansi:${gradleBomDependencyVersions['jansi.version']}"
        dependency "org.jline:jline:${gradleBomDependencyVersions['jline.version']}"
        dependency "org.hibernate:hibernate-core-jakarta:${grailsBomVersions['hibernate.version']}"
        dependency "org.objenesis:objenesis:${gradleBomDependencyVersions['objenesis.version']}"
        dependency "opensymphony:sitemesh:${bomDependencyVersions['sitemesh.version']}"
        dependency "org.spockframework:spock-core:${bomDependencyVersions['spock.version']}"
        dependency "org.spockframework:spock-spring:${bomDependencyVersions['spock.version']}"
        dependency "org.sitemesh:spring-boot-starter-sitemesh:${bomDependencyVersions['starter-sitemesh.version']}"
        dependency "org.sitemesh:spring-webmvc-sitemesh:${bomDependencyVersions['spring-webmvc-sitemesh.version']}"
        dependency "tools.jackson.core:jackson-core:${bomDependencyVersions['jackson3.version']}"
        dependency "tools.jackson.core:jackson-databind:${bomDependencyVersions['jackson3.version']}"
    }
}

dependencies {
    implementation 'org.apache.grails:grails-dependencies-starter-web'
    implementation 'org.apache.grails:grails-data-hibernate5'
    implementation 'org.apache.grails:grails-layout'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.apache.tomcat:tomcat-jdbc'

    testImplementation 'org.apache.grails:grails-testing-support-web'

    integrationTestImplementation 'org.apache.grails:grails-testing-support-http-client'
}

def expectedDependencyVersions = [
        'ch.qos.logback:logback-classic'           : bomDependencyVersions['logback.version'],
        'ch.qos.logback:logback-core'              : bomDependencyVersions['logback.version'],
        'commons-codec:commons-codec'              : bomDependencyVersions['commons-codec.version'],
        'org.apache.groovy:groovy'                 : bomDependencyVersions['groovy.version'],
        'org.apache.groovy:groovy-console'         : bomDependencyVersions['groovy.version'],
        'org.apache.groovy:groovy-json'            : bomDependencyVersions['groovy.version'],
        'org.apache.groovy:groovy-sql'             : bomDependencyVersions['groovy.version'],
        'org.apache.groovy:groovy-templates'       : bomDependencyVersions['groovy.version'],
        'org.apache.groovy:groovy-xml'             : bomDependencyVersions['groovy.version'],
        'org.apache.logging.log4j:log4j-api'       : bomDependencyVersions['log4j2.version'],
        'org.apache.logging.log4j:log4j-to-slf4j'  : bomDependencyVersions['log4j2.version'],
        'tools.jackson.core:jackson-core'          : bomDependencyVersions['jackson3.version'],
        'tools.jackson.core:jackson-databind'      : bomDependencyVersions['jackson3.version'],
]

tasks.register('verifyDependencyManagementVersions') {
    group = 'verification'
    description = 'Verifies Spring Dependency Management resolves Grails-selected dependency versions.'
    doLast {
        // A coordinate is only asserted on a configuration that actually consumes it - logback and
        // jackson, for instance, are runtime-only and never appear on compileClasspath. Absence is
        // therefore not a failure here, but a coordinate that appears on NO configuration is: that
        // would mean this check had quietly stopped covering it, which is the drift it exists to catch.
        def seenDependencies = [] as Set
        [configurations.compileClasspath, configurations.integrationTestRuntimeClasspath].each { configuration ->
            def resolvedVersions = configuration.resolvedConfiguration.resolvedArtifacts.collectEntries { artifact ->
                def module = artifact.moduleVersion.id
                // toString() matters: a GString key never matches the String keys below.
                ["${module.group}:${module.name}".toString(), module.version]
            }
            expectedDependencyVersions.each { dependency, expectedVersion ->
                def resolvedVersion = resolvedVersions[dependency]
                if (resolvedVersion == null) {
                    return
                }
                seenDependencies << dependency
                if (resolvedVersion != expectedVersion) {
                    throw new GradleException("${configuration.name} resolved ${dependency}:${resolvedVersion}, expected ${expectedVersion}")
                }
            }
            resolvedVersions.findAll { dependency, ignored -> dependency.startsWith('org.apache.groovy:') }.each { dependency, resolvedVersion ->
                def expectedVersion = bomDependencyVersions['groovy.version']
                if (resolvedVersion != expectedVersion) {
                    throw new GradleException("${configuration.name} resolved ${dependency}:${resolvedVersion}, expected ${expectedVersion}")
                }
            }
        }
        def unseenDependencies = expectedDependencyVersions.keySet() - seenDependencies
        if (unseenDependencies) {
            throw new GradleException("no checked configuration resolved ${unseenDependencies.join(', ')} - " +
                    'this check is no longer covering them')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyDependencyManagementVersions')
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/functional-test-config.gradle')
}
