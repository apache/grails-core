import org.apache.maven.model.Model

import org.apache.grails.buildsrc.PomVersions
import org.apache.grails.gradle.tasks.bom.ExtractDependenciesTask
import org.apache.grails.gradle.tasks.bom.ExtractedDependencyConstraint
import org.apache.grails.gradle.tasks.bom.PropertyNameCalculator

buildscript {
    apply from: rootProject.layout.projectDirectory.file('dependencies.gradle')
}

plugins {
    id 'java-platform'
    id 'org.apache.grails.buildsrc.bom-property-validator'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
}

version = projectVersion
group = 'org.apache.grails'

javaPlatform {
    allowDependencies()
}

ext {
    isReleaseBuild = System.getenv('GRAILS_PUBLISH_RELEASE') == 'true'
    isPublishedExternal = System.getenv().containsKey('NEXUS_PUBLISH_STAGING_PROFILE_ID')
    // This BOM publishes the versions specific to this variant; validateBomProperties fails for any of them no entry uses
    bomVersionProperties = customBomVersions
    // TODO: It should be possible to pull these build names using includedBuild, but I haven't found a way to do so
    gradleBuildProjects = [
            'grails-gradle-plugins':'org.apache.grails',
            'grails-gradle-model':'org.apache.grails.gradle',
            'grails-gradle-common':'org.apache.grails.gradle',
            'grails-gradle-tasks':'org.apache.grails',
    ]
}

def pomFile = { String coordinates ->
    Configuration pom = configurations.detachedConfiguration(dependencies.create("${coordinates}@pom"))
    pom.transitive = false
    pom.singleFile
}

// Hibernate ORM follows the version spring-boot-dependencies manages, unless dependencies.gradle sets
// hibernate7VersionOverride to a newer release. Configuring this project reads only the parent BOMs' own
// entries, not the BOMs they import, so a task that needs none of them does not fail when one is missing
// from the cache; validateHibernateVersion checks the rest
List<Model> parentBomModels = parentBoms.collect { String parentBom -> PomVersions.read(pomFile(parentBom)) }
String springBootHibernateVersion = parentBomModels.findResult { Model parentBom ->
    PomVersions.managedVersion(parentBom, 'org.hibernate.orm:hibernate-core')
}
String overrideHibernateVersion = hibernate7VersionOverride ?: ''
String hibernateVersion = overrideHibernateVersion ?: springBootHibernateVersion
// An override moves every Hibernate ORM module the parent BOMs manage, not only the ones Grails uses: an
// enforcedPlatform consumer would otherwise get it for those and Spring Boot's version for the rest, such
// as hibernate-hikaricp, while a Maven consumer setting the published hibernate.version moves them all
List<String> managedHibernateOrmModules = overrideHibernateVersion ?
        (hibernateOrmModules + parentBomModels.collectMany { Model parentBom ->
            PomVersions.managedArtifactIds(parentBom, 'org.hibernate.orm')
        }).unique() :
        hibernateOrmModules
if (!hibernateVersion) {
    throw new GradleException("${parentBoms.join(', ')} does not manage org.hibernate.orm:hibernate-core in its own POM: " +
            'set hibernate7VersionOverride in dependencies.gradle to the Hibernate ORM 7 release to manage')
}

// Gradle's conflict resolution selects the newer of two requested versions, by its own version ordering
Provider<String> newerHibernateVersion = provider {
    if (!overrideHibernateVersion || !springBootHibernateVersion) {
        return ''
    }
    Configuration bothVersions = configurations.detachedConfiguration(
            dependencies.create("org.hibernate.orm:hibernate-core:${overrideHibernateVersion}"),
            dependencies.create("org.hibernate.orm:hibernate-core:${springBootHibernateVersion}"))
    bothVersions.transitive = false
    bothVersions.incoming.resolutionResult.allComponents
            .find { it.moduleVersion.name == 'hibernate-core' }.moduleVersion.version
}
// hibernate-models is strictly re-declared too, so it must move with Hibernate ORM
Provider<String> ormHibernateModels = provider {
    PomVersions.read(pomFile("org.hibernate.orm:hibernate-core:${hibernateVersion}")).dependencies
            .find { it.groupId == 'org.hibernate.models' && it.artifactId == 'hibernate-models' }?.version ?: ''
}
String managedHibernateModels = customBomVersions['hibernate-models.version']
String bootHibernateVersion = springBootHibernateVersion ?: ''
def validateHibernateVersion = tasks.register('validateHibernateVersion') { Task task ->
    task.group = 'verification'
    task.description = 'Validates that hibernate7VersionOverride is newer than the Hibernate ORM version Spring Boot manages, ' +
            'and that hibernate-models.version is the version the managed Hibernate ORM release depends on.'
    task.inputs.property('newerHibernateVersion', newerHibernateVersion)
    task.inputs.property('ormHibernateModels', ormHibernateModels)
    task.doLast {
        if (overrideHibernateVersion && bootHibernateVersion &&
                (overrideHibernateVersion == bootHibernateVersion || newerHibernateVersion.get() != overrideHibernateVersion)) {
            throw new GradleException("hibernate7VersionOverride ${overrideHibernateVersion} is not newer than the " +
                    "Hibernate ORM ${bootHibernateVersion} that spring-boot-dependencies manages: remove it from dependencies.gradle")
        }
        String ormModels = ormHibernateModels.get()
        if (ormModels && ormModels != managedHibernateModels) {
            throw new GradleException("Hibernate ORM ${hibernateVersion} depends on hibernate-models ${ormModels}, " +
                    "but dependencies.gradle manages ${managedHibernateModels}: set hibernate-models.version to ${ormModels}")
        }
    }
}
tasks.named('check') { Task task -> task.dependsOn(validateHibernateVersion) }
tasks.withType(GenerateMavenPom).configureEach { GenerateMavenPom task -> task.dependsOn(validateHibernateVersion) }

customBomVersions['hibernate.version'] = hibernateVersion
combinedVersions['hibernate.version'] = hibernateVersion
for (String module : managedHibernateOrmModules) {
    String coordinates = "org.hibernate.orm:${module}:${hibernateVersion}"
    customBomDependencies[module] = coordinates
    combinedDependencies[module] = coordinates
}

dependencies {
    api platform(project(':grails-base-bom'))

    constraints {
        // Re-declare base BOM constraints directly so enforcedPlatform() consumers
        // get forced versions. Constraints inherited via platform() are not enforced
        // by enforcedPlatform — only direct constraints are.
        for (def entry : gradleBomDependencies.entrySet()) {
            api entry.value
        }
        for (def entry : bomDependencies.entrySet()) {
            api entry.value
        }
        for (def entry : bomPlatformDependencies.entrySet()) {
            api entry.value
        }
        for (def entry : customBomDependencies.entrySet()) {
            def parts = entry.value.split(':')
            if (parts.length == 3) {
                api("${parts[0]}:${parts[1]}") {
                    version {
                        strictly parts[2]
                    }
                }
            } else {
                api entry.value
            }
        }
    }
}

configurations.register('bomDependencies').configure {
    it.canBeResolved = true
    it.transitive = true
    it.extendsFrom(configurations.named('api').get())
}

tasks.register('extractConstraints', ExtractDependenciesTask).configure { ExtractDependenciesTask it ->
    it.captureProjectServices(project.dependencies, project.configurations)
    it.configuration = configurations.named('bomDependencies')
    it.configurationName = 'bomDependencies'
    it.destination = project.layout.buildDirectory.file('grails-hibernate7-bom-constraints.adoc')
    it.platformDefinitions = combinedPlatforms
    it.definitions = combinedDependencies
    it.projectName = project.name
    it.versions = combinedVersions
    rootProject.subprojects.each { p ->
        evaluationDependsOn(p.path)
    }
    it.projectArtifactIds.set(project.provider {
        Map<String, String> artifactIdMappings = [:]

        rootProject.subprojects.each { p ->
            artifactIdMappings[p.name] = p.findProperty('pomArtifactId') ?: p.name
        }

        for (Map.Entry<String, String> dependency : project.ext.gradleBuildProjects.entrySet()) {
            artifactIdMappings[dependency.key] = dependency.key
        }

        artifactIdMappings
    })
    it.forcedGroupPrefixes.set(['org.apache.grails.profiles': 'grails-profile'])
    it.projectCoordinateProperties.set(project.provider {
        Map<String, String> projectCoordinates = [:]

        rootProject.subprojects.each { p ->
            String artifactId = p.findProperty('pomArtifactId') as String ?: p.name
            String baseVersionName = artifactId.replaceAll('[.]', '-')
            projectCoordinates["${p.group}:${ artifactId}:${p.version}" as String] = baseVersionName
        }

        for (Map.Entry<String, String> dependency : project.ext.gradleBuildProjects.entrySet()) {
            projectCoordinates["${dependency.value}:${dependency.key}:${project.version}" as String] = dependency.key
        }

        projectCoordinates
    })

    it.dependsOn(project.tasks.named('generateMetadataFileForMavenPublication'), project.tasks.named('generatePomFileForMavenPublication'))
}

def validateNoSnapshotDependencies = tasks.register('validateNoSnapshotDependencies')
validateNoSnapshotDependencies.configure { Task it ->
    it.group = 'publishing'
    it.description = 'Validates that no snapshot dependencies are present in the project when performing a release.'

    Provider<List<String>> snapshotDependencies = provider {
        configurations.collectMany { config ->
            config.allDependencies
                    .findAll { dep -> dep.version && dep.version.contains('-SNAPSHOT') }
                    .collect { dep -> "${dep.group}:${dep.name} (${dep.version})" as String }
        }
    }
    it.doLast {
        if (snapshotDependencies.get()) {
            throw new GradleException("Releases cannot have a snapshot dependency: ${snapshotDependencies.get().first()}")
        }
    }
}

if (ext.isReleaseBuild && ext.isPublishedExternal) {
    project.afterEvaluate {
        tasks.named('generateMetadataFileForMavenPublication').configure {
            dependsOn(validateNoSnapshotDependencies)
        }
        tasks.named('generatePomFileForMavenPublication').configure {
            dependsOn(validateNoSnapshotDependencies)
        }
    }
}

// The pom customization runs as the POM is generated, when the configuration cache allows no access
// to the other projects, so it reads what it needs of them from this provider
Provider<PropertyNameCalculator> bomPropertyNames = provider {
    PropertyNameCalculator propertyNameCalculator = new PropertyNameCalculator(combinedPlatforms, combinedDependencies, combinedVersions)
    propertyNameCalculator.addForcedGroupPrefix('org.apache.grails.profiles', 'grails-profile')
    propertyNameCalculator.addProjects(rootProject.subprojects)
    for (String gradleArtifactId : project.ext.gradleBuildProjects) {
        propertyNameCalculator.addProject('org.apache.grails.gradle', gradleArtifactId, project.version as String, gradleArtifactId)
    }
    propertyNameCalculator
}

ext {
    pomDescription = 'Grails Hibernate 7 BOM (Bill of Materials) for managing dependency versions used by Grails Projects with Hibernate 7'
    pomCustomization = { xml ->
        def root = xml.asNode()

        def propertiesNode = root.properties ? root.properties[0] : root.appendNode('properties')

        def depMgmt = root.dependencyManagement?.getAt(0)
        def deps = depMgmt?.dependencies?.getAt(0)
        if (deps) {
            PropertyNameCalculator propertyNameCalculator = bomPropertyNames.get()

            Map<String, String> pomProperties = [:]
            deps.dependency.each { dep ->
                String groupId = dep.groupId.text().trim()
                String artifactId = dep.artifactId.text().trim()
                boolean isBom = dep.scope.text().trim() == 'import'

                String inlineVersion = dep.version.text().trim()
                if (inlineVersion == 'null') {
                    inlineVersion = null
                }

                if (inlineVersion) {
                    ExtractedDependencyConstraint extractedConstraint = propertyNameCalculator.calculate(groupId, artifactId, inlineVersion, isBom)
                    if (extractedConstraint?.versionPropertyReference) {
                        // use the property reference instead of the hard coded version so that it can be
                        // overriden by the spring boot dependency management plugin
                        dep.version[0].value = extractedConstraint.versionPropertyReference

                        // Add an entry in the <properties> node with the actual version number
                        pomProperties.put(extractedConstraint.versionPropertyName, inlineVersion)
                    }
                } else if (!inlineVersion) {
                    throw new GradleException("Dependency $groupId:$artifactId does not have a version.")
                }
            }

            for (Map.Entry<String, String> property : pomProperties.entrySet()) {
                propertiesNode.appendNode(property.key, property.value)
            }
        }
    }
}

// Companion cli artifact constraints — declared directly (not merely inherited via platform())
// so enforcedPlatform() consumers of this derived BOM also receive forced companion versions.
apply from: rootProject.layout.projectDirectory.file('gradle/cli-companion-bom-constraints.gradle')
