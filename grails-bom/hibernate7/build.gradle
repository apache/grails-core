plugins {
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.buildsrc.bom-conventions'
}

dependencies {
    api platform(project(':grails-base-bom'))

    constraints {
        // Re-declare base BOM constraints directly so enforcedPlatform() consumers
        // get forced versions. Constraints inherited via platform() are not enforced
        // by enforcedPlatform — only direct constraints are.
        for (def entry : gradleBomDependencies.entrySet()) {
            api entry.value
        }
        for (def entry : bomDependencies.entrySet()) {
            api entry.value
        }
        for (def entry : bomPlatformDependencies.entrySet()) {
            api entry.value
        }
        for (def entry : customBomDependencies.entrySet()) {
            def parts = entry.value.split(':')
            if (parts.length == 3) {
                api("${parts[0]}:${parts[1]}") {
                    version {
                        strictly parts[2]
                    }
                }
            } else {
                api entry.value
            }
        }
    }
}

ext.pomDescription = 'Grails Hibernate 7 BOM (Bill of Materials) for managing dependency versions used by Grails Projects with Hibernate 7'
