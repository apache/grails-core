plugins {
    id 'java'
    id 'org.apache.grails.buildsrc.publish'
}

group = 'org.apache.grails.skills'
version = projectVersion

ext {
    pomArtifactId = 'grails-8-upgrade'
    pomTitle = 'Apache Grails® 8 Upgrade Agent Skill'
    pomDescription = 'Agent skill for upgrading Apache Grails® applications from Grails 7.x to Grails 8. The canonical SKILL.md source lives under .agents/skills/grails-8-upgrade.'
}
