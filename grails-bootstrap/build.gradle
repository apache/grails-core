import org.apache.tools.ant.filters.ReplaceTokens
import org.gradle.process.CommandLineArgumentProvider

plugins {
    id 'groovy'
    id 'java-library'
    id 'project-report'
    id 'org.apache.grails.gradle.grails-plugin-cli'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.buildsrc.vulnerability-scan'
    id 'org.apache.grails.gradle.grails-code-style'
    id 'org.apache.grails.gradle.grails-jacoco'
}

version = projectVersion
group = 'org.apache.grails.bootstrap'

cliArtifact {
    automaticModuleName = 'org.apache.grails.bootstrap.cli'
    // the console tier wires its own dependencies below
    defaultDependencies = false
}

configurations {
    // the optional native macOS watcher library, resolved for DirectoryWatcherSpec's isolated class
    // loaders without joining any compile or runtime classpath
    optionalWatcher {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    implementation platform(project(':grails-bom'))

    // the console, its print streams and the jline completion handler are developer tooling: they are
    // published as the grails-bootstrap-cli companion and never reach an application runtime classpath
    cliImplementation platform(project(':grails-bom'))
    cliApi project(project.path)
    cliApi 'org.jline:jline'
    cliImplementation 'org.springframework.boot:spring-boot'
    cliImplementation 'org.apache.groovy:groovy'
    cliImplementation 'org.apache.groovy:groovy-ant'

    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'

    api 'org.apache.grails.gradle:grails-gradle-model', {
        exclude group: 'org.codehaus.groovy'
    }

    compileOnly 'org.apache.groovy:groovy'
    compileOnly 'org.apache.groovy:groovy-templates'
    compileOnly 'org.apache.groovy:groovy-xml'
    compileOnly 'org.apache.groovy:groovy-ant'

    compileOnly 'io.methvin:directory-watcher'
    compileOnly 'net.java.dev.jna:jna'

    api 'org.yaml:snakeyaml'

    testImplementation 'org.apache.groovy:groovy-xml'
    testImplementation 'org.apache.groovy:groovy-templates'

    testImplementation 'org.apache.groovy:groovy-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.platform:junit-platform-suite'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'

    // Logging
    api 'org.slf4j:slf4j-api'
    api 'org.slf4j:jcl-over-slf4j'

    // Testing
    testImplementation 'org.slf4j:slf4j-simple'
    testImplementation 'org.spockframework:spock-core'

    // JNA without directory-watcher is the classpath shape DirectoryWatcherSpec pins: applications
    // routinely pick JNA up transitively, and it must not be mistaken for native watcher support.
    testImplementation 'net.java.dev.jna:jna'

    // Resolved but deliberately kept off the test runtime classpath, so the watcher selected by
    // default in tests matches an application that has not opted into the native implementation.
    // DirectoryWatcherSpec builds isolated class loaders from these jars to cover the opted-in paths.
    optionalWatcher platform(project(':grails-bom'))
    optionalWatcher 'io.methvin:directory-watcher'
}

processResources {
    inputs.property 'version', version
    filter(ReplaceTokens, tokens: [version: version])
}

tasks.named('test') {
    // Hand the optional watcher jars to DirectoryWatcherSpec as a path rather than a classpath entry.
    // Resolution stays deferred to execution time so configuring this project does not resolve it.
    Provider<String> optionalWatcherPath = configurations.named('optionalWatcher').map { it.asPath }
    inputs.files(configurations.named('optionalWatcher')).withPropertyName('optionalWatcher')
    jvmArgumentProviders.add({
        ["-Dgrails.test.optionalWatcherClasspath=${optionalWatcherPath.get()}".toString()]
    } as CommandLineArgumentProvider)
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/docs-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
}