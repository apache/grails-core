plugins {
    id 'groovy'
    id 'java-library'
    id 'org.apache.grails.gradle.grails-plugin-cli'
    id 'project-report'
    id 'org.apache.grails.buildsrc.properties'
    id 'org.apache.grails.buildsrc.dependency-validator'
    id 'org.apache.grails.buildsrc.compile'
    id 'org.apache.grails.buildsrc.configuration-metadata'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
    id 'org.apache.grails.buildsrc.vulnerability-scan'
    id 'org.apache.grails.gradle.grails-code-style'
    id 'org.apache.grails.gradle.grails-jacoco'
}

version = projectVersion
group = 'org.apache.grails'

cliArtifact {
    automaticModuleName = 'org.apache.grails.openapi.cli'
    // this framework module wires its cli dependencies with project dependencies below
    defaultDependencies = false
}

ext {
    pomTitle = 'Grails OpenAPI Plugin'
    pomDescription = 'Describes a Grails application as an OpenAPI document, at build time and through springdoc'
}

dependencies {

    implementation platform(project(':grails-bom'))
    testImplementation platform(project(':grails-bom'))

    api project(':grails-core')
    api project(':grails-url-mappings')
    api project(':grails-rest-transforms')
    // MimeType, which maps a controller's responseFormats to media types
    implementation project(':grails-web-common')
    // DataBindingUtils, which says which properties data binding binds
    implementation project(':grails-web-databinding')
    // Constrained/ConstrainedEntity and Validateable are used from src/main, not only from tests.
    api project(':grails-datamapping-validation')
    api project(':grails-validation')
    api 'org.apache.groovy:groovy'

    // The OpenAPI model, and the resolution of types and annotations into it
    api 'io.swagger.core.v3:swagger-core-jakarta'

    // Optional: when an application adds springdoc, the description is contributed to the
    // documents springdoc serves
    compileOnly 'org.springdoc:springdoc-openapi-starter-webmvc-api'
    // Optional: where an application renders with JSON views, the validation errors are described
    // as its errors view renders them
    compileOnly project(':grails-views-gson')

    // the cli tier - published separately as org.apache.grails:grails-openapi-cli, carrying the
    // generate-open-api command
    cliImplementation platform(project(':grails-bom'))
    cliApi project(project.path)
    cliApi(project(':grails-core')) {
        capabilities {
            requireCapability('org.apache.grails:grails-core-cli')
        }
    }
    cliCompileOnly 'org.springdoc:springdoc-openapi-starter-webmvc-api'
    cliCompileOnly 'org.slf4j:slf4j-nop' // Prevents warning about missing slf4j implementation during compilation

    api 'org.slf4j:slf4j-api'

    compileOnly 'org.slf4j:slf4j-nop' // Prevents warning about missing slf4j implementation during compilation

    testImplementation project(':grails-web-url-mappings')
    testImplementation project(':grails-test-suite-base')
    testImplementation 'org.apache.groovy:groovy-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.springdoc:springdoc-openapi-starter-webmvc-api'
    // JSON views, whose errors view the validation errors are described as
    testImplementation project(':grails-views-gson')
    testImplementation 'org.slf4j:slf4j-simple'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/docs-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
}
